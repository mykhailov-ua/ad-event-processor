version: "2"

run:
  timeout: 8m
  go: "1.25.12"

linters:
  enable:
    - govet
    - errcheck
    - staticcheck
    - revive
    - unused
    - misspell
    - gocritic
    - noctx
    - bodyclose
    - contextcheck
    - errorlint
    - forbidigo
  settings:
    revive:
      rules:
        - name: exported
          disabled: true
    staticcheck:
      checks:
        - all
        - SA9003
        - SA4017
        - -ST1000
    gocritic:
      enabled-checks:
        - builtinShadow
        - dupImport
        - httpNoBody
        - nilValReturn
        - octalLiteral
        - typeAssertChain
    forbidigo:
      forbid:
        - pattern: '^(fmt\.Print(|f|ln)|print|println)$'
        - pattern: 'log\.Fatal'
        - pattern: 'panic\('
  exclusions:
    generated: lax
    rules:
      - path: '_test\.go'
        linters:
          - errcheck
          - revive
          - noctx
          - contextcheck
          - forbidigo
      - path: "(/|^)(.*/)?pb/"
        linters:
          - errcheck
      - path: '\.pb\.go$'
        linters:
          - staticcheck
      - path: "(/|^)(.*/)?db/"
        linters:
          - errcheck

      - path: "cmd/admin/"
        linters:
          - forbidigo
      - path: "internal/installer/"
        linters:
          - forbidigo
      - path: 'cmd/.+/main\.go'
        linters:
          - gocritic
        text: "exitAfterDefer"
