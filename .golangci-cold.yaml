version: "2"

# Cold-path Go lint profile (everything except hot-path packages).
# Run via: scripts/ci/lint_go_gate.sh cold
run:
  timeout: 8m
  go: "1.25.12"

linters:
  enable:
    - govet
    - errcheck
    - staticcheck
    - revive
    - unused
    - misspell
    - gocritic
    - noctx
    - bodyclose
    - contextcheck
    - errorlint
    - forbidigo
  settings:
    revive:
      rules:
        - name: exported
          disabled: true
    staticcheck:
      checks:
        - all
        - SA9003
        - SA4017
    gocritic:
      enabled-checks:
        - appendAssign
        - assignOp
        - badCond
        - builtinShadow
        - dupImport
        - elseif
        - exitAfterDefer
        - httpNoBody
        - ifElseChain
        - nilValReturn
        - octalLiteral
        - singleCaseSwitch
        - typeAssertChain
        - unlambda
        - unslice
        - wrapperFunc
    forbidigo:
      forbid:
        - pattern: '^(fmt\.Print(|f|ln)|print|println)$'
        - pattern: 'log\.Fatal'
        - pattern: 'panic\('
  exclusions:
    generated: lax
    rules:
      - path: '_test\.go'
        linters:
          - errcheck
          - revive
          - noctx
          - contextcheck
          - forbidigo
      - path: '(/|^)(.*/)?pb/'
        linters:
          - errcheck
      - path: '(/|^)(.*/)?db/'
        linters:
          - errcheck
      # CLI / installer UX: stdout is the interface.
      - path: 'cmd/admin/'
        linters:
          - forbidigo
      - path: 'internal/installer/'
        linters:
          - forbidigo
      - path: 'cmd/.+/main\.go'
        linters:
          - gocritic
        text: 'exitAfterDefer'
