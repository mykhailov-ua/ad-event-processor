# Host sysctl overrides for ad-event-processor (deploy/sysctl/99-ad-event-processor-sysctl.conf).
# Apply: sudo bash scripts/ops/sysctl.sh apply
#
# net.core.somaxconn / net.ipv4.tcp_max_syn_backlog: 2048 (connection backlog, unit: connections)
# net.ipv4.tcp_syncookies: 1 (SYN flood mitigation enabled)
# vm.dirty_background_ratio: 5 (% RAM dirty before async writeback)
# vm.dirty_ratio: 10 (% RAM dirty before sync flush; affects broker mmap WAL)

# Increase max pending connection backlog to prevent queue overflow during high RPS surges
net.core.somaxconn = 2048
net.ipv4.tcp_max_syn_backlog = 2048

# Enable SYN cookies to protect against SYN flood attacks under perimeter stress
net.ipv4.tcp_syncookies = 1

# Optimize dirty page flush thresholds to prevent IO spikes during high-volume mmap WAL writes.
# dirty_background_ratio 5: start asynchronous pdflush writeback when 5% of memory contains dirty pages
vm.dirty_background_ratio = 5
# dirty_ratio 10: force blocking synchronous writes when 10% of memory contains dirty pages
vm.dirty_ratio = 10

