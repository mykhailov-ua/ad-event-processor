    target_key: sub3
  - source: "{{ad.id}}"
    target_key: sub4
  - source: "{{fbclid}}"
    target_key: fbclid
  - source: "{campaignid}"
    target_key: ad_campaign_id
  - source: "{adgroupid}"
    target_key: sub3
  - source: "{gclid}"
    target_key: gclid
  - source: "__CAMPAIGN_ID__"
    target_key: sub2
  - source: "__AID__"
    target_key: sub3
