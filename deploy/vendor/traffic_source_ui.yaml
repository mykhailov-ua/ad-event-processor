version: 1
templates:
- id: meta-facebook
  name: Facebook Ads
  category: social
  params:
  - key: sub1
    value: '{{site_source_name}}'
    label: Placement
  - key: sub2
    value: '{{campaign.id}}'
    label: Campaign
  - key: ad_campaign_id
    value: '{{campaign.id}}'
    label: Cost Sync
  - key: sub3
    value: '{{adset.id}}'
    label: Ad set
  - key: sub4
    value: '{{ad.id}}'
    label: Ad
  - key: fbclid
    value: '{{fbclid}}'
  bundled_slug: traffic_facebook
  cost_sync: meta
  notes: 'Cost Sync join: sub2 / ad_campaign_id = {{campaign.id}}'
