# Vendor SKU catalog (Layer V). Not shipped inside customer binaries.
# Commercial capability matrix (antifraud shipped vs gates): deploy/vendor/SALES_KIT.md § Antifraud capability matrix
# Sign offline: use ad-event-processor-license repo CLI
# go run ./cmd/ad-event-processor-license --sku <code> --customer-name "Acme" --deployment-id <uuid> [--fingerprint <host_fp>]
#
# Schema:
#   skus[].code              - JWT sku/plan claim (required, unique)
#   skus[].price_usd_monthly - commercial reference (USDT); not enforced in binary
#   skus[].valid_days        - JWT valid_until = issued_at + valid_days (default 30)
#   skus[].grace_days        - JWT grace_days (default 7)
#   skus[].features          - licensing.FeatureSet JSON (tier_policy.go sanitizes at runtime)
#   skus[].limits            - licensing.Limits JSON (0 = unlimited: campaigns, events/mo, requests/day)
#   skus[].bind.mode         - hard|fingerprint (1 host, FP in JWT) | multi (max_activations hosts)
#
# Tier enforcement (code): hosts (max_activations) + RPS + feature gates only.
# No campaign count, monthly event, or daily request caps on self-hosted JWT (0 = disabled).

skus:
  - code: starter
    display_name: Starter on-prem ($129)
    price_usd_monthly: 129
    valid_days: 30
    grace_days: 7
    features:
      rtb_live: false
      openrtb_engine: false
      ebpf_xdp_edge: false
      ivt_ml_detector: false
      ml_fraud_boost: false
      multi_region: false
      slot_migration: false
      margin_guard: true
      external_residential_intel: false
    limits:
      max_activations: 1
      max_regions: 1
      max_api_keys: 5
      max_rps: 10000
      max_requests_per_day: 0
      max_active_campaigns: 0
      max_tenants: 3
      max_events_per_month: 0
      max_export_chunk_bytes: 5242880
    bind:
      mode: hard

