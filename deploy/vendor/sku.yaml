# Vendor SKU catalog (Layer V). Not shipped inside customer binaries.
# Sign offline: use bidshard-license repo CLI
# go run ./cmd/bidshard-license --sku <code> --customer-name "Acme" --deployment-id <uuid> [--fingerprint <host_fp>]
#
# Schema:
#   skus[].code              - JWT sku/plan claim (required, unique)
#   skus[].price_usd_monthly - commercial reference (USDT); not enforced in binary
#   skus[].valid_days        - JWT valid_until = issued_at + valid_days (default 30)
#   skus[].grace_days        - JWT grace_days (default 7)
#   skus[].features          - licensing.FeatureSet JSON (tier_policy.go sanitizes at runtime)
#   skus[].limits            - licensing.Limits JSON
#   skus[].bind.mode         - hard|fingerprint (1 host, FP in JWT) | multi (max_activations hosts)
#
# Tier enforcement (code):
#   solo/starter — HTTP redirect + /track only; OpenRTB + eBPF blocked
#   pro          — OpenRTB live; 1 host (max_activations: 1); campaign cap
#   scale        — OpenRTB; up to 3 hosts; higher campaign cap
#   network+     — full programmatic stack; Enterprise includes eBPF/XDP

skus:
  - code: solo
    display_name: Solo on-prem ($69)
    price_usd_monthly: 69
    valid_days: 30
    grace_days: 7
    features:
      rtb_live: false
      openrtb_engine: false
      ebpf_xdp_edge: false
      ivt_ml_detector: false
      ml_fraud_boost: false
      multi_region: false
      slot_migration: false
      margin_guard: true
    limits:
      max_activations: 1
      max_regions: 1
      max_api_keys: 2
      max_rps: 2000
      max_requests_per_day: 100000
      max_active_campaigns: 10
      max_tenants: 1
      max_events_per_month: 3000000
      max_export_chunk_bytes: 1048576
    bind:
      mode: hard

