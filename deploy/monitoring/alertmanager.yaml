
global:
  resolve_timeout: 5m

route:
  group_by: ['alertname']
  group_wait: 10s
  group_interval: 10s
  repeat_interval: 1h
  receiver: 'management-webhook'

receivers:
- name: 'management-webhook'
  webhook_configs:
  - url: 'http://127.0.0.1:8188/ops/alertmanager/webhook'
    send_resolved: true
