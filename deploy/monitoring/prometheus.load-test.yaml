global:
  scrape_interval: 5s
  evaluation_interval: 5s

rule_files:
  - 'prometheus.rules.yaml'

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - '127.0.0.1:7100'

scrape_configs:
  - job_name: 'tracker'
    static_configs:
      - targets: ['127.0.0.1:9100', '127.0.0.1:9200']
  - job_name: 'processor'
    static_configs:
      - targets: ['127.0.0.1:8500']
  - job_name: 'nginx-edge'
    static_configs:
      - targets: ['127.0.0.1:8000']
    metrics_path: '/metrics/edge'
