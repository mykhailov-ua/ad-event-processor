x-rtb-env: &rtb-env
  RTB_MODE: live
  RTB_BUDGET_AUTHORITY: rtb
  RTB_CLEARING_MODE: second
  RTB_TARGETING_INDEX: 'false'
  RTB_SNAPSHOT_PATH: /var/lib/ad-event-processor/rtb_snapshot.bin
  RTB_RECONCILE_INTERVAL_MS: '30000'
  RTB_BUDGET_DIVERGENCE_THRESHOLD_MICRO: '1000'
  RTB_RECONCILE_SAMPLE_SIZE: '32'

services:
  tracker-0:
    environment:
      <<: *rtb-env
    volumes:
      - ./deploy/geoip:/deploy/geoip:ro
      - ad_event_processor_logs:/var/log/ad-event-processor:rw
      - rtb_snapshot:/var/lib/ad-event-processor

  tracker-1:
    environment:
      <<: *rtb-env
    volumes:
      - ./deploy/geoip:/deploy/geoip:ro
      - ad_event_processor_logs:/var/log/ad-event-processor:rw
      - rtb_snapshot:/var/lib/ad-event-processor

  tracker-2:
    environment:
      <<: *rtb-env
    volumes:
      - ./deploy/geoip:/deploy/geoip:ro
      - ad_event_processor_logs:/var/log/ad-event-processor:rw
      - rtb_snapshot:/var/lib/ad-event-processor

  tracker-3:
    environment:
      <<: *rtb-env
    volumes:
      - ./deploy/geoip:/deploy/geoip:ro
      - ad_event_processor_logs:/var/log/ad-event-processor:rw
      - rtb_snapshot:/var/lib/ad-event-processor

volumes:
  rtb_snapshot:
