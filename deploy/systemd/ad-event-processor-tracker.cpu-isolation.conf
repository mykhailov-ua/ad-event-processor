# systemd drop-in: pin tracker lanes to CPUs 0-3 (one lane per core).
# Pair with deploy/compose/docker-compose.cpu-isolation.yaml TRACKER_*_CPUSET and CPU_ISOLATION_ENABLED=1.
# GOMAXPROCS=4 matches four tracker unix-socket peers (tracker-0..3).

[Service]
CPUAffinity=0 1 2 3
Environment=GOMAXPROCS=4
