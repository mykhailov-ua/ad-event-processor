# Optional systemd drop-in for native (non-compose) tracker pinning.
# Install:
#   sudo mkdir -p /etc/systemd/system/ad-event-processor-tracker.service.d
#   sudo cp deploy/systemd/ad-event-processor-tracker.cpu-isolation.conf \
#     /etc/systemd/system/ad-event-processor-tracker.service.d/cpu-isolation.conf
#   sudo systemctl daemon-reload && sudo systemctl restart ad-event-processor-tracker
#
# Edit CPU list for your host (example: 8-core, trackers on CPUs 0-3).
[Service]
CPUAffinity=0 1 2 3
Environment=GOMAXPROCS=4
