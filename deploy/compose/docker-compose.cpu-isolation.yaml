# CPU isolation overlay — NOT included in root docker-compose.yaml.
# Enabled by default when CPU_ISOLATION_ENABLED=1 (.env.example); stack.sh adds profile:
#   docker compose -f deploy/compose/docker-compose.yaml \
#     -f deploy/compose/docker-compose.cpu-isolation.yaml \
#     --profile cpu-isolation up -d
#
# Defaults assume 8 logical CPUs (0-7). Override per role in .env.

x-cpu-isolation-tracker: &cpu_isolation_tracker
  profiles: [cpu-isolation]
  cpu_shares: 2048

x-cpu-isolation-redis: &cpu_isolation_redis
  profiles: [cpu-isolation]
  cpu_shares: 1536

x-cpu-isolation-edge: &cpu_isolation_edge
  profiles: [cpu-isolation]
  cpu_shares: 1536

x-cpu-isolation-cold: &cpu_isolation_cold
  profiles: [cpu-isolation]
  cpu_shares: 1024

services:
  tracker-0:
    <<: *cpu_isolation_tracker
    cpuset: "${TRACKER_0_CPUSET:-0}"
  tracker-1:
    <<: *cpu_isolation_tracker
    cpuset: "${TRACKER_1_CPUSET:-1}"
  tracker-2:
    <<: *cpu_isolation_tracker
    cpuset: "${TRACKER_2_CPUSET:-2}"
  tracker-3:
    <<: *cpu_isolation_tracker
    cpuset: "${TRACKER_3_CPUSET:-3}"

  redis-0:
    <<: *cpu_isolation_redis
    cpuset: "${REDIS_CPUSET:-4,5}"
  redis-1:
    <<: *cpu_isolation_redis
    cpuset: "${REDIS_CPUSET:-4,5}"
  redis-2:
    <<: *cpu_isolation_redis
    cpuset: "${REDIS_CPUSET:-4,5}"
  redis-3:
    <<: *cpu_isolation_redis
    cpuset: "${REDIS_CPUSET:-4,5}"

  nginx:
    <<: *cpu_isolation_edge
    cpuset: "${EDGE_CPUSET:-6}"

  processor:
    <<: *cpu_isolation_cold
    cpuset: "${COLD_CPUSET:-7}"
  processor-1:
    <<: *cpu_isolation_cold
    cpuset: "${COLD_CPUSET:-7}"
  broker:
    <<: *cpu_isolation_cold
    cpuset: "${COLD_CPUSET:-7}"
  control:
    profiles: [cpu-isolation]
    cpu_shares: 512
    cpuset: "${COLD_CPUSET:-7}"
  clickhouse:
    profiles: [cpu-isolation]
    cpu_shares: 512
    cpuset: "${COLD_CPUSET:-7}"
  db:
    profiles: [cpu-isolation]
    cpu_shares: 512
    cpuset: "${COLD_CPUSET:-7}"
  db-payment:
    profiles: [cpu-isolation]
    cpu_shares: 512
    cpuset: "${COLD_CPUSET:-7}"
