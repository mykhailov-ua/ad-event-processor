# Control-dev compose overlay (deploy/compose/docker-compose.control-dev.yaml).
# Merged by scripts/dev/stack/stack.sh ingest-only via AD_EVENT_PROCESSOR_COMPOSE_EXTRA_FILES.
# Cross-ref: deploy/DEPLOY.md, docs/DEVELOPMENT.md.
#
# Role:
# - Laptop ingest path: tracker + processor + control + PG + 2 Redis shards; no ClickHouse.
# - Disables cold-path workers on control (payment, billing, notifier, margin_guard, cost_sync).
# - Swaps tracker UDS for TCP HTTP health on :8181/:8182 for local debugging.
#
# Topology:
# - Patches: db, control, processor, tracker-0, tracker-1.
# - tracker depends_on reset: db, broker, redis-0, redis-1 (not redis-2..3).
# - PG unix socket /run/ad-event-processor/postgresql, port 5430, max_connections=600.
#
# Invariants:
# - CH_ENABLED=0 on control and processor (CH only via stack.sh clickhouse).
# - REDIS_SHARD_COUNT=2; REDIS_ADDRS lists redis-0 and redis-1 unix sockets.
# - AD_EVENT_PROCESSOR_LICENSE_MODE=dev, LICENSE_REQUIRED=0.
# - FILTER_TIMEOUT_MS=5000 (dev default; production <= 100 ms per core.mdc).
#
# Env knobs:
# - GOMAXPROCS / GNET_NUM_EVENT_LOOPS / MAX_WORKERS=12 on trackers.
# - SERVER_PORT 8181 (tracker-0), 8182 (tracker-1); METRICS_PORT 9102 on tracker-1.
# - TRANSPORT_USE_UDS=0, TRACKER_UNIX_SOCKET empty (HTTP ingest).
#
# Forbidden:
# - Do not assume redis-2..3 are up; ingest-only stops VPS extras after start.
# - Do not leave ClickHouse running overnight without explicit CH_ENABLED=1 intent.
#
# Verify:
# bash scripts/dev/stack/stack.sh ingest-only
# bash scripts/dev/stack/preflight.sh
services:
  db:
    environment:
      - PGHOST=/run/ad-event-processor/postgresql
      - PGPORT=5430
    command:
      [
        'postgres',
        '-p',
        '5430',
        '-c',
        'unix_socket_directories=/run/ad-event-processor/postgresql,/var/run/postgresql',
        '-c',
        'max_connections=600',
        '-c',
        'shared_buffers=256MB',
        '-c',
        'work_mem=32MB',
        '-c',
        'maintenance_work_mem=64MB',
        '-c',
        'effective_cache_size=512MB',
      ]
  control:
    depends_on:
      db:
        condition: service_healthy
      redis-0:
        condition: service_healthy
      redis-1:
        condition: service_healthy
    environment:
      - AD_EVENT_PROCESSOR_LICENSE_PATH=/etc/ad-event-processor/license.jwt
      - AD_EVENT_PROCESSOR_LICENSE_PUBLIC_KEY=
      - AD_EVENT_PROCESSOR_LICENSE_REQUIRED=0
      - AD_EVENT_PROCESSOR_LICENSE_MODE=dev
      - CH_ENABLED=0
      - CONTROL_ENABLE_PAYMENT=0
      - CONTROL_ENABLE_BILLING=0
      - CONTROL_ENABLE_NOTIFIER=0
      - CONTROL_ENABLE_MARGIN_GUARD=0
      - CONTROL_ENABLE_COST_SYNC=0
      - REDIS_ADDRS=/run/ad-event-processor/redis/redis-0.sock,/run/ad-event-processor/redis/redis-1.sock
      - REDIS_SHARD_COUNT=2
      - ADMIN_UI_DEV_URL=http://127.0.0.1:5173
  processor:
    environment:
      - CH_ENABLED=0
      - REDIS_ADDRS=/run/ad-event-processor/redis/redis-0.sock,/run/ad-event-processor/redis/redis-1.sock
      - REDIS_SHARD_COUNT=2
  tracker-0:
    depends_on: !reset
      db:
        condition: service_healthy
      broker:
        condition: service_healthy
      redis-0:
        condition: service_healthy
      redis-1:
        condition: service_healthy
    environment:
      - AD_EVENT_PROCESSOR_LICENSE_PATH=/etc/ad-event-processor/license.jwt
      - AD_EVENT_PROCESSOR_LICENSE_MODE=dev
      - AD_EVENT_PROCESSOR_LICENSE_REQUIRED=0
      - REDIS_ADDRS=/run/ad-event-processor/redis/redis-0.sock,/run/ad-event-processor/redis/redis-1.sock
      - REDIS_SHARD_COUNT=2
      - TRANSPORT_USE_UDS=0
      - TRACKER_UNIX_SOCKET=
      - SERVER_PORT=8181
      - GOMAXPROCS=12
      - GNET_NUM_EVENT_LOOPS=12
      - MAX_WORKERS=12
      - FILTER_TIMEOUT_MS=5000
    healthcheck:
      test: ['CMD', '/tracker', '--health-probe', 'http://127.0.0.1:8181/health']
  tracker-1:
    depends_on: !reset
      db:
        condition: service_healthy
      broker:
        condition: service_healthy
      redis-0:
        condition: service_healthy
      redis-1:
        condition: service_healthy
    environment:
      - AD_EVENT_PROCESSOR_LICENSE_PATH=/etc/ad-event-processor/license.jwt
      - AD_EVENT_PROCESSOR_LICENSE_MODE=dev
      - AD_EVENT_PROCESSOR_LICENSE_REQUIRED=0
      - REDIS_ADDRS=/run/ad-event-processor/redis/redis-0.sock,/run/ad-event-processor/redis/redis-1.sock
      - REDIS_SHARD_COUNT=2
      - TRANSPORT_USE_UDS=0
      - TRACKER_UNIX_SOCKET=
      - SERVER_PORT=8182
      - METRICS_PORT=9102
      - GOMAXPROCS=12
      - GNET_NUM_EVENT_LOOPS=12
      - MAX_WORKERS=12
      - FILTER_TIMEOUT_MS=5000
    healthcheck:
      test: ['CMD', '/tracker', '--health-probe', 'http://127.0.0.1:8182/health']
