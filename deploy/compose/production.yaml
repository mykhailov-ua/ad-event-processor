# Production compose overlay (deploy/compose/production.yaml).
# Merged when ENV=production or installer release path; not used by default laptop stack.
# Cross-ref: deploy/DEPLOY.md, docker-compose.release.yaml.
#
# Role:
# - TLS Postgres (ssl=on) and TLS Redis (tls-port 6379); production control profile.
# - Does not set COMPOSE_MEMORY_PROFILE; pair memory-dev overlay on laptops only.
#
# Topology:
# - Patches: db (PG TLS certs), redis-0 (TLS command), tracker-0..3, control, processor env.
#
# Invariants:
# - AD_EVENT_PROCESSOR_PROFILE=production on control.
# - Tracker hot path: ENV=production, FILTER_TIMEOUT_MS=100, STREAM_PRODUCER_ADMISSION_PCT=85,
#   LOCAL_QUOTA_MODE=live, QUOTA_MODE=live, TRACKER_PG_FALLBACK=0 (see .env.prod.example).
# - Processor: CH_INGEST_SOURCE=broker, BROKER_SHADOW_MODE=0 after cutover (P2).
# - Redis appendonly yes; Postgres max_connections=600, shared_buffers=1GB.
# - EVENTS_RETENTION_DAYS default 90; EVENTS_HASH_IP_AT_INSERT default 0 on processor.
# - DB_DSN sslmode=verify-full when pairing TLS Postgres (see .env.prod.example).
#
# Env knobs:
# - PG_TLS_CERT_DIR (default ./deploy/tls/postgres).
# - REDIS_TLS_CERT_DIR (default ./deploy/tls/redis).
# - EVENTS_RETENTION_DAYS, EVENTS_HASH_IP_AT_INSERT.
#
# Forbidden:
# - Do not merge on laptop dev without release images and TLS material in deploy/tls/.
#
# Verify:
# go test ./deploy/compose/ -run TestProductionOverlayDocumentsTLS -count=1
# bash scripts/ci/compose_profile_check.sh
services:
  db:
    command:
      - postgres
      - -p
      - ${DB_PORT}
      - -c
      - ssl=on
      - -c
      - ssl_cert_file=/var/lib/postgresql/tls/server.crt
      - -c
      - ssl_key_file=/var/lib/postgresql/tls/server.key
      - -c
      - max_connections=600
      - -c
      - shared_buffers=1GB
      - -c
      - work_mem=64MB
      - -c
      - maintenance_work_mem=256MB
      - -c
      - effective_cache_size=3GB
    volumes:
      - ${PG_TLS_CERT_DIR:-./deploy/tls/postgres}:/var/lib/postgresql/tls:ro

  redis-0:
    command:
      - redis-server
      - --port
      - '0'
      - --tls-port
      - '6379'
      - --tls-cert-file
      - /tls/redis.crt
      - --tls-key-file
      - /tls/redis.key
      - --tls-ca-cert-file
      - /tls/ca.crt
      - --requirepass
      - ${REDIS_PASSWORD}
      - --appendonly
      - yes
      - --appendfsync
      - everysec
      - --maxmemory-policy
      - noeviction
    volumes:
      - ${REDIS_TLS_CERT_DIR:-./deploy/tls/redis}:/tls:ro

  control:
    environment:
      - AD_EVENT_PROCESSOR_PROFILE=production
      - EVENTS_RETENTION_DAYS=${EVENTS_RETENTION_DAYS:-90}

  processor:
    environment:
      - EVENTS_HASH_IP_AT_INSERT=${EVENTS_HASH_IP_AT_INSERT:-0}
      - PROCESSOR_STREAM_LAG_MAX_SEC=${PROCESSOR_STREAM_LAG_MAX_SEC:-120}
      - CH_SPOOL_DIR=/var/spool/ad-event-processor/ch
      - CH_INGEST_SOURCE=broker
      - BROKER_URL=${BROKER_URL:-/run/ad-event-processor/broker/gnet.sock}
      - BROKER_SHADOW_MODE=${BROKER_SHADOW_MODE:-0}

  tracker-0:
    environment:
      - ENV=production
      - FILTER_TIMEOUT_MS=100
      - STREAM_PRODUCER_ADMISSION_PCT=85
      - LOCAL_QUOTA_MODE=live
      - QUOTA_MODE=live
      - TRACKER_PG_FALLBACK=0
      - TRANSPORT_USE_UDS=1

  tracker-1:
    environment:
      - ENV=production
      - FILTER_TIMEOUT_MS=100
      - STREAM_PRODUCER_ADMISSION_PCT=85
      - LOCAL_QUOTA_MODE=live
      - QUOTA_MODE=live
      - TRACKER_PG_FALLBACK=0
      - TRANSPORT_USE_UDS=1

  tracker-2:
    environment:
      - ENV=production
      - FILTER_TIMEOUT_MS=100
      - STREAM_PRODUCER_ADMISSION_PCT=85
      - LOCAL_QUOTA_MODE=live
      - QUOTA_MODE=live
      - TRACKER_PG_FALLBACK=0
      - TRANSPORT_USE_UDS=1

  tracker-3:
    environment:
      - ENV=production
      - FILTER_TIMEOUT_MS=100
      - STREAM_PRODUCER_ADMISSION_PCT=85
      - LOCAL_QUOTA_MODE=live
      - QUOTA_MODE=live
      - TRACKER_PG_FALLBACK=0
      - TRANSPORT_USE_UDS=1
