services:
  db:
    command:
      [
        'postgres',
        '-p',
        '${DB_PORT}',
        '-c',
        'unix_socket_directories=/run/ad-event-processor/postgresql',
        '-c',
        'max_connections=200',
        '-c',
        'shared_buffers=128MB',
        '-c',
        'work_mem=8MB',
        '-c',
        'maintenance_work_mem=64MB',
        '-c',
        'effective_cache_size=256MB',
      ]
    mem_limit: 320M
    memswap_limit: 320M
    deploy:
      resources:
        limits:
          memory: 320M

  db-payment:
    command:
      [
        'postgres',
        '-p',
        '${PAYMENT_DB_PORT}',
        '-c',
        'unix_socket_directories=/run/ad-event-processor/postgresql',
        '-c',
        'max_connections=50',
        '-c',
        'shared_buffers=64MB',
        '-c',
        'work_mem=8MB',
        '-c',
        'maintenance_work_mem=32MB',
        '-c',
        'effective_cache_size=128MB',
      ]
    mem_limit: 224M
    memswap_limit: 224M
    deploy:
      resources:
        limits:
          memory: 224M

  broker:
    mem_limit: 160M
