# Laptop / dev compose overlay: cgroup memory caps below production defaults.
# Enabled when COMPOSE_MEMORY_PROFILE=dev (default in scripts/dev/stack.sh).
services:
  db:
    command:
      [
        'postgres',
        '-p',
        '${DB_PORT}',
        '-c',
        'unix_socket_directories=/run/ad-event-processor/postgresql',
        '-c',
        'max_connections=200',
        '-c',
        'shared_buffers=128MB',
        '-c',
        'work_mem=8MB',
        '-c',
        'maintenance_work_mem=64MB',
        '-c',
        'effective_cache_size=256MB',
      ]
    deploy:
      resources:
        limits:
          memory: 512M

  db-payment:
    command:
      [
        'postgres',
        '-p',
        '${PAYMENT_DB_PORT}',
        '-c',
        'unix_socket_directories=/run/ad-event-processor/postgresql',
        '-c',
        'max_connections=50',
        '-c',
        'shared_buffers=64MB',
        '-c',
        'work_mem=8MB',
        '-c',
        'maintenance_work_mem=32MB',
        '-c',
        'effective_cache_size=128MB',
      ]
    deploy:
      resources:
        limits:
          memory: 384M

  broker:
    deploy:
      resources:
        limits:
          memory: 256M

  processor:
    environment:
      - GOMEMLIMIT=512MiB
    deploy:
      resources:
        limits:
          memory: 768M

  control:
    deploy:
      resources:
        limits:
          memory: 768M

  tracker-0:
    environment:
      - GOMEMLIMIT=384MiB
    deploy:
      resources:
        limits:
          memory: 512M

  tracker-1:
    environment:
      - GOMEMLIMIT=384MiB
    deploy:
      resources:
        limits:
          memory: 512M

  tracker-2:
    environment:
      - GOMEMLIMIT=384MiB
    deploy:
      resources:
