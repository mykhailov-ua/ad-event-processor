# Memory-dev compose overlay (deploy/compose/docker-compose.memory-dev.yaml).
# Auto-merged when COMPOSE_MEMORY_PROFILE=dev (default in scripts/dev/stack/stack.sh).
# Cross-ref: deploy/DEPLOY.md, docs/DEVELOPMENT.md.
#
# Role:
# - Docker cgroup memory limits for 16 GB laptop hosts; reduces OOM during full stack.
# - Sets mem_limit, memswap_limit, and GOMEMLIMIT on Go services; tightens PG command args.
#
# Topology:
# - Patches all running services when present: db, db-payment, broker, processor, control,
#   tracker-0..3, redis-0..5, clickhouse, ivt-detector, fraud-scorer, nginx, prometheus, grafana.
#
# Invariants:
# - memswap_limit equals mem_limit (no swap beyond cgroup cap).
# - Set COMPOSE_MEMORY_PROFILE= empty in .env to use base limits in docker-compose.yaml.
# - clickhouse capped at 768M here vs 4G in base compose.
#
# Env knobs (cgroup limits from this file):
# - db 320M (max_connections=200); db-payment 224M; broker 160M.
# - tracker 320M each, GOMEMLIMIT=288MiB; processor 448M; control 384M.
# - redis shard 80M each; clickhouse 768M; fraud-scorer 256M; nginx 128M.
#
# Forbidden:
# - Do not use these limits for production capacity planning.
# - Do not run clickhouse + analytics-ml on 16 GB laptop without CH opt-in awareness.
#
# Verify:
# COMPOSE_MEMORY_PROFILE=dev bash scripts/dev/stack/stack.sh status
# bash scripts/dev/stack/preflight.sh
services:
  db:
    command:
      [
        'postgres',
        '-p',
        '${DB_PORT}',
        '-c',
        'unix_socket_directories=/run/ad-event-processor/postgresql',
        '-c',
        'max_connections=200',
        '-c',
        'shared_buffers=128MB',
        '-c',
        'work_mem=8MB',
        '-c',
        'maintenance_work_mem=64MB',
        '-c',
        'effective_cache_size=256MB',
      ]
    mem_limit: 320M
    memswap_limit: 320M
    deploy:
      resources:
        limits:
          memory: 320M

  db-payment:
    command:
      [
        'postgres',
        '-p',
        '${PAYMENT_DB_PORT}',
        '-c',
        'unix_socket_directories=/run/ad-event-processor/postgresql',
        '-c',
        'max_connections=50',
        '-c',
        'shared_buffers=64MB',
        '-c',
        'work_mem=8MB',
        '-c',
        'maintenance_work_mem=32MB',
        '-c',
        'effective_cache_size=128MB',
      ]
    mem_limit: 224M
    memswap_limit: 224M
    deploy:
      resources:
        limits:
          memory: 224M

  broker:
    mem_limit: 160M
    memswap_limit: 160M
    deploy:
      resources:
        limits:
          memory: 160M

  processor:
    environment:
      - GOMEMLIMIT=384MiB
    mem_limit: 448M
