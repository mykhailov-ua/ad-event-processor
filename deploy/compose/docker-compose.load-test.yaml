# Load-test compose overlay (deploy/compose/docker-compose.load-test.yaml).
# Merged by scripts/lib/load_test_env.sh and perf/fault lab scripts; not used by stack.sh.
# Cross-ref: deploy/DEPLOY.md, .env.load-test, docs/DEVELOPMENT.md (load-test BPF tier).
#
# Role:
# - Constrained cgroup lab for malformed.sh, parser_chaos_load.sh, redis_ram_cutover_compare.sh.
# - Dual-scale trackers (0-1: 2 CPU / 512M; 2-3: 0.5 CPU / 448M); nginx fronts two trackers only.
# - TRACKER_BPF_TRACE=1 build arg; Redis AOF off, TCP ports published for host loadgen.
#
# Topology:
# - Compose: docker compose -f docker-compose.yaml -f deploy/compose/docker-compose.load-test.yaml.
# - Patches: tracker-0..3, processor, nginx, db, clickhouse, redis-0..5, prometheus, grafana,
#   alertmanager, control.
# - nginx depends_on reset: tracker-0, tracker-1 only (not tracker-2/3).
# - Ports from .env.load-test: LOAD_TEST_EDGE_PORT, LOAD_TEST_TRACKER_*_INGEST_PORT, etc.
#
# Invariants:
# - QUOTA_MODE=live and LOCAL_QUOTA_MODE=live on tracker lab env (holdout in load_test_compose_test.go).
# - TRANSPORT_USE_UDS=0; TRACKER_UNIX_SOCKET empty; HTTP1_BODY_IDLE_MS=60000.
# - REDIS_ADDRS=${LOAD_TEST_REDIS_ADDRS}; redis appendonly no, maxmemory-policy noeviction.
# - CH_DSN over TCP 127.0.0.1:9000 (CH_USE_UDS=0 on processor/control).
#
# Env knobs:
# - LOAD_TEST_REDIS_ADDRS, LOAD_TEST_PROCESSOR_PORT, LOAD_TEST_CONTROL_PORT.
# - LOAD_TEST_TRACKER_N_INGEST_PORT / METRICS_PORT / HEALTH_URL per shard.
# - SKIP_CODEGEN (default 0), TRACKER_BPF_TRACE=1, GOGC=300 on trackers.
#
# Forbidden:
# - Do not use for routine laptop dev (starts ClickHouse + 6 Redis with published ports).
# - Do not cite unit mock benches as /track SLA; use load-test Prometheus p99 gates.
#
# Verify:
# make load-test-config
# go test ./deploy/compose/ -run TestLoadTest -count=1
# bash scripts/ci/compose_profile_check.sh
x-go-load-test-env: &go_load_test_env
  GOMAXPROCS: '2'

x-tracker-healthcheck: &tracker_healthcheck
  interval: 5s
  timeout: 3s
  retries: 5
  start_period: 30s

x-tracker-lab-deploy-dual: &tracker_lab_deploy_dual
  resources:
    limits:
      cpus: '2.0'
      memory: 512M

x-tracker-lab-deploy-scale: &tracker_lab_deploy_scale
  resources:
    limits:
      cpus: '0.5'
      memory: 448M

x-tracker-lab-env: &tracker_lab_env
  GOMAXPROCS: '2'
  GOMEMLIMIT: 400MiB
  GOGC: '300'
  TRACKER_INGRESS_SCHEMA: ad_event_processor_native
  AD_EVENT_PROCESSOR_LICENSE_REQUIRED: '0'
  ENV: development
  HTTP1_BODY_IDLE_MS: '60000'
  TRANSPORT_USE_UDS: '0'
  TRACKER_UNIX_SOCKET: ''
  REDIS_ADDRS: ${LOAD_TEST_REDIS_ADDRS}
  QUOTA_MODE: live
  LOCAL_QUOTA_MODE: live

x-redis-load-test-deploy: &redis_load_test_deploy
  resources:
    limits:
      cpus: '0.75'
      memory: 384M

x-tracker-lab-build: &tracker_lab_build
  context: ../..
  dockerfile: deploy/docker/Dockerfile
  args:
    SKIP_CODEGEN: ${SKIP_CODEGEN:-0}
    TRACKER_BPF_TRACE: '1'

services:
  tracker-0:
    build:
      <<: *tracker_lab_build
    environment:
      <<: *tracker_lab_env
      SERVER_PORT: ${LOAD_TEST_TRACKER_0_INGEST_PORT}
      METRICS_PORT: ${LOAD_TEST_TRACKER_0_METRICS_PORT}
    healthcheck:
      <<: *tracker_healthcheck
      test: ['CMD', '/tracker', '--health-probe', '${LOAD_TEST_TRACKER_0_HEALTH_URL}']
    deploy:
      <<: *tracker_lab_deploy_dual

  tracker-1:
    build:
      <<: *tracker_lab_build
    environment:
      <<: *tracker_lab_env
      SERVER_PORT: ${LOAD_TEST_TRACKER_1_INGEST_PORT}
      METRICS_PORT: ${LOAD_TEST_TRACKER_1_METRICS_PORT}
    healthcheck:
      <<: *tracker_healthcheck
      test: ['CMD', '/tracker', '--health-probe', '${LOAD_TEST_TRACKER_1_HEALTH_URL}']
    deploy:
      <<: *tracker_lab_deploy_dual

  tracker-2:
    build:
      <<: *tracker_lab_build
    environment:
      <<: *tracker_lab_env
      SERVER_PORT: ${LOAD_TEST_TRACKER_2_INGEST_PORT}
      METRICS_PORT: ${LOAD_TEST_TRACKER_2_METRICS_PORT}
    healthcheck:
      <<: *tracker_healthcheck
      test: ['CMD', '/tracker', '--health-probe', '${LOAD_TEST_TRACKER_2_HEALTH_URL}']
    deploy:
      <<: *tracker_lab_deploy_scale

  tracker-3:
    build:
      <<: *tracker_lab_build
    environment:
      <<: *tracker_lab_env
      SERVER_PORT: ${LOAD_TEST_TRACKER_3_INGEST_PORT}
      METRICS_PORT: ${LOAD_TEST_TRACKER_3_METRICS_PORT}
    healthcheck:
      <<: *tracker_healthcheck
      test: ['CMD', '/tracker', '--health-probe', '${LOAD_TEST_TRACKER_3_HEALTH_URL}']
    deploy:
      <<: *tracker_lab_deploy_scale

  processor:
    environment:
      - GOMAXPROCS=2
      - GOMEMLIMIT=576MiB
      - GOGC=100
      - DB_PROCESSOR_MAX_CONNS=16
      - MAX_WORKERS=12
      - CH_MAX_WORKERS=2
      - CH_USE_UDS=0
      - REDIS_ADDRS=${LOAD_TEST_REDIS_ADDRS}
      - PROCESSOR_PORT=${LOAD_TEST_PROCESSOR_PORT}
      - SERVER_PORT=${LOAD_TEST_PROCESSOR_PORT}
      - CH_DSN=clickhouse://default:${CH_PASSWORD:-secure_ch_pass}@127.0.0.1:9000/ad_event_processor
    healthcheck:
      test:
        [
          'CMD',
          '/processor',
          '--health-probe',
          'http://127.0.0.1:${LOAD_TEST_PROCESSOR_PORT}/health',
        ]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: '1.75'
          memory: 768M

  nginx:
    depends_on: !reset
      tracker-0:
        condition: service_healthy
      tracker-1:
        condition: service_healthy
    environment:
      - EDGE_BL_STALE_SEC=3600
      - REDIS_PORT=${LOAD_TEST_REDIS_PORT}
    volumes:
      - ../../deploy/nginx/nginx.load-test.conf:/etc/nginx/nginx.conf:ro
      - ../../deploy/nginx/nginx.load-test.conf:/usr/local/openresty/nginx/conf/nginx.conf:ro
      - ../../deploy/nginx/lua/edge-tracker-peers.load-test.lua:/etc/nginx/lua/edge-tracker-peers.lua:ro
      - ../../deploy/nginx/snippets:/etc/nginx/snippets:ro
      - ../../deploy/nginx/snippets/edge_optional_locations.load-test.conf:/etc/nginx/snippets/edge_optional_locations.conf:ro
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M

  db:
    command:
      [
        'postgres',
        '-p',
        '${DB_PORT}',
        '-c',
        'unix_socket_directories=/run/ad-event-processor/postgresql',
        '-c',
        'max_connections=300',
        '-c',
        'shared_buffers=320MB',
        '-c',
        'work_mem=32MB',
        '-c',
        'maintenance_work_mem=96MB',
        '-c',
        'effective_cache_size=640MB',
      ]
    deploy:
      resources:
        limits:
          cpus: '1.25'
          memory: 896M

  clickhouse:
    deploy:
      resources:
        limits:
          cpus: '1.25'
          memory: 1152M
    volumes:
      - ../../deploy/clickhouse/config.load-test.yaml:/etc/clickhouse-server/config.d/memory_limit.yaml:ro

  redis-0:
    ports: ['${LOAD_TEST_REDIS_0_PORT}:6379']
    command:
      [
        'redis-server',
        '--port',
        '6379',
        '--unixsocket',
        '/run/ad-event-processor/redis/redis-0.sock',
        '--unixsocketperm',
        '777',
        '--requirepass',
        '${REDIS_PASSWORD}',
        '--appendonly',
        'no',
        '--maxmemory-policy',
        'noeviction',
        '--tcp-backlog',
        '2048',
      ]
    deploy:
      <<: *redis_load_test_deploy
  redis-1:
    ports: ['${LOAD_TEST_REDIS_1_PORT}:6379']
    command:
      [
        'redis-server',
        '--port',
        '6379',
        '--unixsocket',
        '/run/ad-event-processor/redis/redis-1.sock',
        '--unixsocketperm',
        '777',
        '--requirepass',
        '${REDIS_PASSWORD}',
        '--appendonly',
        'no',
        '--maxmemory-policy',
        'noeviction',
        '--tcp-backlog',
        '2048',
      ]
    deploy:
      <<: *redis_load_test_deploy
  redis-2:
    ports: ['${LOAD_TEST_REDIS_2_PORT}:6379']
    command:
      [
        'redis-server',
        '--port',
        '6379',
        '--unixsocket',
        '/run/ad-event-processor/redis/redis-2.sock',
        '--unixsocketperm',
        '777',
        '--requirepass',
        '${REDIS_PASSWORD}',
        '--appendonly',
        'no',
        '--maxmemory-policy',
        'noeviction',
        '--tcp-backlog',
        '2048',
      ]
    deploy:
      <<: *redis_load_test_deploy
  redis-3:
    ports: ['${LOAD_TEST_REDIS_3_PORT}:6379']
    command:
      [
        'redis-server',
        '--port',
        '6379',
        '--unixsocket',
        '/run/ad-event-processor/redis/redis-3.sock',
        '--unixsocketperm',
        '777',
        '--requirepass',
        '${REDIS_PASSWORD}',
        '--appendonly',
        'no',
        '--maxmemory-policy',
        'noeviction',
        '--tcp-backlog',
        '2048',
      ]
    deploy:
      <<: *redis_load_test_deploy
  redis-4:
    ports: ['${LOAD_TEST_REDIS_4_PORT}:6379']
    command:
      [
        'redis-server',
        '--port',
        '6379',
        '--unixsocket',
        '/run/ad-event-processor/redis/redis-4.sock',
        '--unixsocketperm',
        '777',
        '--requirepass',
        '${REDIS_PASSWORD}',
        '--appendonly',
        'no',
        '--maxmemory-policy',
        'noeviction',
        '--tcp-backlog',
        '2048',
      ]
    deploy:
      <<: *redis_load_test_deploy
  redis-5:
    ports: ['${LOAD_TEST_REDIS_5_PORT}:6379']
    command:
      [
        'redis-server',
        '--port',
        '6379',
        '--unixsocket',
        '/run/ad-event-processor/redis/redis-5.sock',
        '--unixsocketperm',
        '777',
        '--requirepass',
        '${REDIS_PASSWORD}',
        '--appendonly',
        'no',
        '--maxmemory-policy',
        'noeviction',
        '--tcp-backlog',
        '2048',
      ]
    deploy:
      <<: *redis_load_test_deploy

  prometheus:
    command:
      [
        '--config.file=/etc/prometheus/prometheus.yaml',
        '--web.listen-address=:${LOAD_TEST_PROMETHEUS_PORT}',
      ]
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 256M
    volumes:
      - ../../deploy/monitoring/prometheus.load-test.yaml:/etc/prometheus/prometheus.yaml:ro
      - ../../deploy/monitoring/prometheus.rules.yaml:/etc/prometheus/prometheus.rules.yaml:ro

  grafana:
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 256M
    volumes:
      - ../../deploy/monitoring/grafana-provisioning/datasources/datasource.load-test.yaml:/etc/grafana/provisioning/datasources/datasource.yaml:ro

  alertmanager:
    command:
      [
        '--config.file=/etc/alertmanager/alertmanager.yaml',
        '--web.listen-address=:${LOAD_TEST_ALERTMANAGER_PORT}',
      ]
    deploy:
      resources:
        limits:
          cpus: '0.1'
          memory: 128M

  control:
    environment:
      - MANAGEMENT_PORT=${LOAD_TEST_CONTROL_PORT}
      - CONTROL_PORT=${LOAD_TEST_CONTROL_PORT}
      - CONTROL_ENABLE_PAYMENT=0
      - CONTROL_ENABLE_BILLING=0
      - CONTROL_ENABLE_NOTIFIER=0
      - CONTROL_ENABLE_MARGIN_GUARD=0
      - CONTROL_ENABLE_COST_SYNC=0
      - AD_EVENT_PROCESSOR_LICENSE_REQUIRED=0
      - REPORT_EXPORT_DIR=/run/ad-event-processor/report-exports
      - DB_TRACKER_MAX_CONNS=32
      - DB_MIN_CONNS=4
      - VOLUME_METER_ENABLED=0
      - CH_USE_UDS=0
      - CH_DSN=clickhouse://default:${CH_PASSWORD:-secure_ch_pass}@127.0.0.1:9000/ad_event_processor
      - CH_READONLY_DSN=clickhouse://default:${CH_PASSWORD:-secure_ch_pass}@127.0.0.1:9000/ad_event_processor
      - DB_DSN=postgres://${DB_USER:-ad_event_processor_user}:${DB_PASSWORD:-secure_pass_123}@127.0.0.1:${DB_PORT:-5430}/${DB_NAME:-ad_event_processor}?sslmode=${DB_SSLMODE:-disable}
      - REDIS_ADDRS=${LOAD_TEST_REDIS_ADDRS}
    healthcheck:
      test:
        ['CMD', '/control', '--health-probe', 'http://127.0.0.1:${LOAD_TEST_CONTROL_PORT}/healthz']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
