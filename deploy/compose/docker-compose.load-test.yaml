# Load-test overlay: ports from .env.load-test + deploy/compose/.env.load-test.runtime (generated).
# Materialize nginx/prometheus/grafana: make load-test-config

x-go-load-test-env: &go_load_test_env
  GOMAXPROCS: '2'

x-tracker-healthcheck: &tracker_healthcheck
  interval: 5s
  timeout: 3s
  retries: 5
  start_period: 30s

x-tracker-lab-deploy-dual: &tracker_lab_deploy_dual
  resources:
    limits:
      cpus: '2.0'
      memory: 512M

x-tracker-lab-deploy-scale: &tracker_lab_deploy_scale
  resources:
    limits:
      cpus: '0.5'
      memory: 448M

x-tracker-lab-env: &tracker_lab_env
  GOMAXPROCS: '2'
  GOMEMLIMIT: 400MiB
  GOGC: '300'
  TRACKER_INGRESS_SCHEMA: ad_event_processor_native
  AD_EVENT_PROCESSOR_LICENSE_REQUIRED: '0'
  ENV: development
  TRANSPORT_USE_UDS: '0'
  TRACKER_UNIX_SOCKET: ''
  REDIS_ADDRS: ${LOAD_TEST_REDIS_ADDRS}
  QUOTA_MODE: live
  LOCAL_QUOTA_MODE: live

x-tracker-lab-build: &tracker_lab_build
  context: ../..
  dockerfile: deploy/docker/Dockerfile
  args:
    SKIP_CODEGEN: ${SKIP_CODEGEN:-0}
    TRACKER_BPF_TRACE: '1'

services:
  tracker-0:
    build:
      <<: *tracker_lab_build
    environment:
      <<: *tracker_lab_env
      SERVER_PORT: ${LOAD_TEST_TRACKER_0_INGEST_PORT}
      METRICS_PORT: ${LOAD_TEST_TRACKER_0_METRICS_PORT}
    healthcheck:
      <<: *tracker_healthcheck
      test: ['CMD', '/tracker', '--health-probe', '${LOAD_TEST_TRACKER_0_HEALTH_URL}']
    deploy:
      <<: *tracker_lab_deploy_dual

  tracker-1:
    build:
      <<: *tracker_lab_build
    environment:
      <<: *tracker_lab_env
      SERVER_PORT: ${LOAD_TEST_TRACKER_1_INGEST_PORT}
      METRICS_PORT: ${LOAD_TEST_TRACKER_1_METRICS_PORT}
    healthcheck:
      <<: *tracker_healthcheck
      test: ['CMD', '/tracker', '--health-probe', '${LOAD_TEST_TRACKER_1_HEALTH_URL}']
    deploy:
      <<: *tracker_lab_deploy_dual

  tracker-2:
    build:
      <<: *tracker_lab_build
    environment:
      <<: *tracker_lab_env
      SERVER_PORT: ${LOAD_TEST_TRACKER_2_INGEST_PORT}
      METRICS_PORT: ${LOAD_TEST_TRACKER_2_METRICS_PORT}
    healthcheck:
      <<: *tracker_healthcheck
      test: ['CMD', '/tracker', '--health-probe', '${LOAD_TEST_TRACKER_2_HEALTH_URL}']
    deploy:
      <<: *tracker_lab_deploy_scale

  tracker-3:
    build:
      <<: *tracker_lab_build
    environment:
      <<: *tracker_lab_env
      SERVER_PORT: ${LOAD_TEST_TRACKER_3_INGEST_PORT}
      METRICS_PORT: ${LOAD_TEST_TRACKER_3_METRICS_PORT}
    healthcheck:
      <<: *tracker_healthcheck
      test: ['CMD', '/tracker', '--health-probe', '${LOAD_TEST_TRACKER_3_HEALTH_URL}']
    deploy:
      <<: *tracker_lab_deploy_scale

  processor:
    environment:
      - GOMAXPROCS=2
      - GOMEMLIMIT=576MiB
      - GOGC=100
      - DB_PROCESSOR_MAX_CONNS=16
      - MAX_WORKERS=12
      - CH_MAX_WORKERS=2
      - CH_USE_UDS=0
      - PROCESSOR_PORT=${LOAD_TEST_PROCESSOR_PORT}
      - SERVER_PORT=${LOAD_TEST_PROCESSOR_PORT}
      - CH_DSN=clickhouse://default:${CH_PASSWORD:-secure_ch_pass}@127.0.0.1:9000/ad_event_processor
    deploy:
      resources:
        limits:
          cpus: '1.75'
          memory: 768M

  nginx:
    depends_on: !reset
      tracker-0:
        condition: service_healthy
      tracker-1:
        condition: service_healthy
    environment:
      - EDGE_BL_STALE_SEC=3600
      - REDIS_PORT=${LOAD_TEST_REDIS_PORT}
    volumes:
      - ../../deploy/nginx/nginx.load-test.conf:/etc/nginx/nginx.conf:ro
      - ../../deploy/nginx/nginx.load-test.conf:/usr/local/openresty/nginx/conf/nginx.conf:ro
      - ../../deploy/nginx/lua/edge-tracker-peers.load-test.lua:/etc/nginx/lua/edge-tracker-peers.lua:ro
      - ../../deploy/nginx/snippets:/etc/nginx/snippets:ro
      - ../../deploy/nginx/snippets/edge_optional_locations.load-test.conf:/etc/nginx/snippets/edge_optional_locations.conf:ro
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M

  db:
    command:
      [
        'postgres',
        '-p',
        '${DB_PORT}',
        '-c',
        'unix_socket_directories=/run/ad-event-processor/postgresql',
        '-c',
        'max_connections=300',
        '-c',
        'shared_buffers=320MB',
        '-c',
        'work_mem=32MB',
        '-c',
        'maintenance_work_mem=96MB',
        '-c',
        'effective_cache_size=640MB',
      ]
    deploy:
      resources:
        limits:
          cpus: '1.25'
          memory: 896M

  clickhouse:
    deploy:
      resources:
        limits:
          cpus: '1.25'
          memory: 1152M
    volumes:
      - ../../deploy/clickhouse/config.load-test.yaml:/etc/clickhouse-server/config.d/memory_limit.yaml:ro

  redis-0:
    ports: ['${LOAD_TEST_REDIS_0_PORT}:6379']
    deploy:
      resources:
        limits:
          cpus: '0.35'
          memory: 384M
  redis-1:
    ports: ['${LOAD_TEST_REDIS_1_PORT}:6379']
    deploy:
      resources:
        limits:
          cpus: '0.35'
          memory: 384M
  redis-2:
    ports: ['${LOAD_TEST_REDIS_2_PORT}:6379']
    deploy:
      resources:
        limits:
          cpus: '0.35'
          memory: 384M
  redis-3:
    ports: ['${LOAD_TEST_REDIS_3_PORT}:6379']
    deploy:
      resources:
        limits:
          cpus: '0.35'
          memory: 384M
  redis-4:
    ports: ['${LOAD_TEST_REDIS_4_PORT}:6379']
    deploy:
      resources:
        limits:
          cpus: '0.35'
          memory: 384M
  redis-5:
    ports: ['${LOAD_TEST_REDIS_5_PORT}:6379']
    deploy:
      resources:
        limits:
          cpus: '0.35'
          memory: 384M

  prometheus:
    command: ['--config.file=/etc/prometheus/prometheus.yaml', '--web.listen-address=:${LOAD_TEST_PROMETHEUS_PORT}']
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 256M
    volumes:
      - ../../deploy/monitoring/prometheus.load-test.yaml:/etc/prometheus/prometheus.yaml:ro
      - ../../deploy/monitoring/prometheus.rules.yaml:/etc/prometheus/prometheus.rules.yaml:ro

  grafana:
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 256M
    volumes:
      - ../../deploy/monitoring/grafana-provisioning/datasources/datasource.load-test.yaml:/etc/grafana/provisioning/datasources/datasource.yaml:ro

  alertmanager:
    command: ['--config.file=/etc/alertmanager/alertmanager.yaml', '--web.listen-address=:${LOAD_TEST_ALERTMANAGER_PORT}']
    deploy:
      resources:
        limits:
          cpus: '0.1'
          memory: 128M

  control:
    environment:
      - MANAGEMENT_PORT=${LOAD_TEST_CONTROL_PORT}
      - CONTROL_PORT=${LOAD_TEST_CONTROL_PORT}
      - CONTROL_ENABLE_PAYMENT=0
      - CONTROL_ENABLE_BILLING=0
      - CONTROL_ENABLE_NOTIFIER=0
      - AD_EVENT_PROCESSOR_LICENSE_REQUIRED=0
      - REPORT_EXPORT_DIR=/run/ad-event-processor/report-exports
      - DB_TRACKER_MAX_CONNS=32
      - DB_MIN_CONNS=4
      - VOLUME_METER_ENABLED=0
      - CH_USE_UDS=0
      - CH_DSN=clickhouse://default:${CH_PASSWORD:-secure_ch_pass}@127.0.0.1:9000/ad_event_processor
      - CH_READONLY_DSN=clickhouse://default:${CH_PASSWORD:-secure_ch_pass}@127.0.0.1:9000/ad_event_processor
      - DB_DSN=postgres://${DB_USER:-ad_event_processor_user}:${DB_PASSWORD:-secure_pass_123}@127.0.0.1:${DB_PORT:-5430}/${DB_NAME:-ad_event_processor}?sslmode=${DB_SSLMODE:-disable}
      - REDIS_ADDRS=${LOAD_TEST_REDIS_ADDRS}
    healthcheck:
      test: ['CMD', '/control', '--health-probe', 'http://127.0.0.1:${LOAD_TEST_CONTROL_PORT}/health']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
