# Sentinel compose overlay (deploy/compose/docker-compose.sentinel.yaml).
# Merged for Redis HA lab: stack.sh sentinel, scripts/test/sentinel.sh.
# Cross-ref: deploy/DEPLOY.md, deploy/redis/sentinel-entrypoint.sh.
#
# Role:
# - Adds redis-0..3-replica services and sentinel-0..2 for failover fault tests.
# - Does not replace base redis masters; replicas use database network only.
#
# Topology:
# - redis-N-replica: replicaof redis-N:6379, depends_on redis-N healthy.
# - sentinel-0 depends on redis-0..3 healthy; sentinel-1/2 chain from sentinel-0 healthy.
# - sentinel :26379; entrypoint deploy/redis/sentinel-entrypoint.sh.
# - stack.sh sentinel starts: redis-0, redis-0-replica, sentinel-0, sentinel-1, sentinel-2.
#
# Invariants:
# - REDIS_SHARD_COUNT=4 on sentinel containers (production shard count).
# - REDIS_PASSWORD required (requirepass + masterauth on replicas).
# - Base compose must already run redis-0..3 masters before merging this overlay.
#
# Env knobs:
# - REDIS_VERSION, REDIS_PASSWORD from .env.
# - HEALTHCHECK_INTERVAL/TIMEOUT/RETRIES (default 5s/5s/5).
#
# Forbidden:
# - Do not point app REDIS_ADDRS at replicas while masters are down without failover proof.
# - Do not set REDIS_SHARD_COUNT=2 in app env while sentinel expects 4 master names.
#
# Verify:
# bash scripts/dev/stack/stack.sh sentinel
# bash scripts/test/sentinel.sh
# SENTINEL_FAULT_TEST=1 go test ./internal/database/ -run Sentinel -count=1
services:
  redis-0-replica:
    image: redis:${REDIS_VERSION}
    env_file:
      - ../../.env
    command:
      - redis-server
      - --port
      - '6379'
      - --requirepass
      - ${REDIS_PASSWORD}
      - --masterauth
      - ${REDIS_PASSWORD}
      - --replicaof
      - redis-0
      - '6379'
      - --tcp-backlog
      - '2048'
    networks:
      - database
    depends_on:
      redis-0:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'redis-cli', '-p', '6379', '-a', '${REDIS_PASSWORD}', 'ping']
      interval: ${HEALTHCHECK_INTERVAL:-5s}
      timeout: ${HEALTHCHECK_TIMEOUT:-5s}
      retries: ${HEALTHCHECK_RETRIES:-5}

  redis-1-replica:
    image: redis:${REDIS_VERSION}
    env_file:
      - ../../.env
    command:
      - redis-server
      - --port
      - '6379'
      - --requirepass
      - ${REDIS_PASSWORD}
      - --masterauth
      - ${REDIS_PASSWORD}
      - --replicaof
      - redis-1
      - '6379'
      - --tcp-backlog
      - '2048'
    networks:
      - database
    depends_on:
      redis-1:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'redis-cli', '-p', '6379', '-a', '${REDIS_PASSWORD}', 'ping']
      interval: ${HEALTHCHECK_INTERVAL:-5s}
      timeout: ${HEALTHCHECK_TIMEOUT:-5s}
      retries: ${HEALTHCHECK_RETRIES:-5}

  redis-2-replica:
    image: redis:${REDIS_VERSION}
    env_file:
      - ../../.env
    command:
      - redis-server
      - --port
      - '6379'
      - --requirepass
      - ${REDIS_PASSWORD}
      - --masterauth
      - ${REDIS_PASSWORD}
      - --replicaof
      - redis-2
      - '6379'
      - --tcp-backlog
      - '2048'
    networks:
      - database
    depends_on:
      redis-2:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'redis-cli', '-p', '6379', '-a', '${REDIS_PASSWORD}', 'ping']
      interval: ${HEALTHCHECK_INTERVAL:-5s}
      timeout: ${HEALTHCHECK_TIMEOUT:-5s}
      retries: ${HEALTHCHECK_RETRIES:-5}

  redis-3-replica:
    image: redis:${REDIS_VERSION}
    env_file:
      - ../../.env
    command:
      - redis-server
      - --port
      - '6379'
      - --requirepass
      - ${REDIS_PASSWORD}
      - --masterauth
      - ${REDIS_PASSWORD}
      - --replicaof
      - redis-3
      - '6379'
      - --tcp-backlog
      - '2048'
    networks:
      - database
    depends_on:
      redis-3:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'redis-cli', '-p', '6379', '-a', '${REDIS_PASSWORD}', 'ping']
      interval: ${HEALTHCHECK_INTERVAL:-5s}
      timeout: ${HEALTHCHECK_TIMEOUT:-5s}
      retries: ${HEALTHCHECK_RETRIES:-5}

  sentinel-0:
    image: redis:${REDIS_VERSION}
    env_file:
      - ../../.env
    entrypoint: ['/bin/sh', '/sentinel-entrypoint.sh']
    volumes:
      - ../redis/sentinel-entrypoint.sh:/sentinel-entrypoint.sh:ro
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      REDIS_SHARD_COUNT: '4'
    networks:
      - database
    depends_on:
      redis-0:
        condition: service_healthy
      redis-1:
        condition: service_healthy
      redis-2:
        condition: service_healthy
      redis-3:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'redis-cli', '-p', '26379', 'ping']
      interval: ${HEALTHCHECK_INTERVAL:-5s}
      timeout: ${HEALTHCHECK_TIMEOUT:-5s}
      retries: ${HEALTHCHECK_RETRIES:-5}

  sentinel-1:
    image: redis:${REDIS_VERSION}
    env_file:
      - ../../.env
    entrypoint: ['/bin/sh', '/sentinel-entrypoint.sh']
    volumes:
      - ../redis/sentinel-entrypoint.sh:/sentinel-entrypoint.sh:ro
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      REDIS_SHARD_COUNT: '4'
    networks:
      - database
    depends_on:
      sentinel-0:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'redis-cli', '-p', '26379', 'ping']
      interval: ${HEALTHCHECK_INTERVAL:-5s}
      timeout: ${HEALTHCHECK_TIMEOUT:-5s}
      retries: ${HEALTHCHECK_RETRIES:-5}

  sentinel-2:
    image: redis:${REDIS_VERSION}
    env_file:
      - ../../.env
    entrypoint: ['/bin/sh', '/sentinel-entrypoint.sh']
    volumes:
      - ../redis/sentinel-entrypoint.sh:/sentinel-entrypoint.sh:ro
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      REDIS_SHARD_COUNT: '4'
    networks:
      - database
    depends_on:
      sentinel-0:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'redis-cli', '-p', '26379', 'ping']
      interval: ${HEALTHCHECK_INTERVAL:-5s}
      timeout: ${HEALTHCHECK_TIMEOUT:-5s}
      retries: ${HEALTHCHECK_RETRIES:-5}
