    healthcheck:
      test: ["CMD", "redis-cli", "-p", "6379", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: ${HEALTHCHECK_INTERVAL}
      timeout: ${HEALTHCHECK_TIMEOUT}
      retries: ${HEALTHCHECK_RETRIES}

  redis-5:
    image: redis:${REDIS_VERSION}
    env_file:
      - ../../.env
    ports:
      - "6484:6379"
    command: ["redis-server", "--port", "6379", "--requirepass", "${REDIS_PASSWORD}",
              "--appendonly", "yes", "--appendfsync", "everysec",
              "--maxmemory-policy", "noeviction"]
    volumes:
      - redis_5_data:/data
    deploy:
      resources:
        limits:
          memory: 512M
    networks:
      - database
    healthcheck:
      test: ["CMD", "redis-cli", "-p", "6379", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: ${HEALTHCHECK_INTERVAL}
      timeout: ${HEALTHCHECK_TIMEOUT}
      retries: ${HEALTHCHECK_RETRIES}

  clickhouse:
    image: clickhouse/clickhouse-server:${CH_VERSION}
    profiles:
      - single_vps
      - network_operator
      - analytics_ml
      - resilience
      - fraud-scorer
      - multi-region
      - tools
    env_file:
      - ../../.env
    ports:
      - "${CH_PORT}:${CH_PORT}"
      - "${CH_HTTP_PORT}:8123"
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    volumes:
      - clickhouse_data:/var/lib/clickhouse
      - ../../deploy/clickhouse/config.yaml:/etc/clickhouse-server/config.d/memory_limit.yaml:ro
      - ../../deploy/clickhouse/users.yaml:/etc/clickhouse-server/users.d/custom_users.yaml:ro
      - ../../deploy/clickhouse/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - ../../deploy/clickhouse/recon_materialized_views.sql:/docker-entrypoint-initdb.d/02_recon_materialized_views.sql:ro
    deploy:
      resources:
        limits:
          memory: 4G
    networks:
      - database
      - monitoring
    environment:
      - CLICKHOUSE_DB=${CH_NAME}
      - CLICKHOUSE_USER=${CH_USER}
      - CLICKHOUSE_PASSWORD=${CH_PASSWORD}
      - CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT=1
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8123/ping || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
    logging:
      driver: "json-file"
      options:
        max-size: "100m"
        max-file: "3"


  prometheus:
    image: prom/prometheus:latest
    network_mode: "${NET_MODE:-host}"
    profiles:
      - monitoring
      - single_vps
      - network_operator
    command: ["--config.file=/etc/prometheus/prometheus.yaml", "--web.listen-address=:9190"]
    volumes:
      - ../../deploy/monitoring/prometheus.yaml:/etc/prometheus/prometheus.yaml:ro
      - ../../deploy/monitoring/prometheus.rules.yaml:/etc/prometheus/prometheus.rules.yaml:ro
    deploy:
      resources:
        limits:
          memory: 512M
    logging:
      driver: "json-file"
      options:
        max-size: "100m"
        max-file: "3"

  grafana:
    image: grafana/grafana:latest
    network_mode: "${NET_MODE:-host}"
    profiles:
      - monitoring
      - single_vps
      - network_operator
    volumes:
      - ../../deploy/monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
    environment:
      - GF_SERVER_HTTP_PORT=3100
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Admin
    deploy:
      resources:
        limits:
          memory: 512M
    logging:
      driver: "json-file"
      options:
        max-size: "100m"
        max-file: "3"

  alertmanager:
    image: prom/alertmanager:latest
    network_mode: "${NET_MODE:-host}"
    profiles:
      - monitoring
      - single_vps
      - network_operator
    command: ["--config.file=/etc/alertmanager/alertmanager.yaml", "--web.listen-address=:9093"]
    volumes:
      - ../../deploy/monitoring/alertmanager.yaml:/etc/alertmanager/alertmanager.yaml:ro
    deploy:
      resources:
        limits:
          memory: 256M
    logging:
      driver: "json-file"
      options:
        max-size: "100m"
        max-file: "3"

  alertmanager-telegram:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile
    entrypoint: ["/alertmanager-telegram"]
    network_mode: "${NET_MODE:-host}"
    profiles:
      - monitoring
      - single_vps
      - network_operator
    environment:
      - PROXY_PORT=8222
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN:-YOUR_TELEGRAM_BOT_TOKEN_PLACEHOLDER}
      - TELEGRAM_CHAT_ID=${TELEGRAM_CHAT_ID:-YOUR_TELEGRAM_CHAT_ID_PLACEHOLDER}
    deploy:
      resources:
        limits:
          memory: 256M
    logging:
      driver: "json-file"
      options:
        max-size: "100m"
        max-file: "3"

  log-compactor:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile.log-compactor
    volumes:
      - espx_logs:/var/log/espx:ro
      - log_compactor_state:/var/lib/espx:rw
    environment:
      - LOG_COMPACTOR_BACKEND=local
      - LOG_COMPACTOR_SOURCE_DIR=/var/log/espx
      - LOG_COMPACTOR_WARM_DIR=/var/lib/espx/log-store/warm
      - LOG_COMPACTOR_HOT_MIN_AGE_H=24
      - LOG_COMPACTOR_WARM_SAMPLE_RATE=1000
      - LOG_COMPACTOR_WORK_INTERVAL_H=1
      - LOG_COMPACTOR_METRICS_PORT=9190
      - CH_DSN=${CH_DSN}
      - LOG_COMPACTOR_COLD_WARM_MIN_AGE_D=7
      - LOG_COMPACTOR_COLD_WORK_INTERVAL_H=24
    profiles:
      - tools
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  log-evacuator:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile.log-evacuator
    volumes:
      - espx_logs:/var/log/espx:rw
      - ${STORAGE_BOX_SSH_KEY_PATH:-~/.ssh/id_rsa}:/root/.ssh/id_rsa:ro
    environment:
      - LOG_DIR=/var/log/espx
      - STORAGE_BOX_HOST=${STORAGE_BOX_HOST}
      - STORAGE_BOX_USER=${STORAGE_BOX_USER}
      - STORAGE_BOX_PATH=${STORAGE_BOX_PATH:-/}
      - RSYNC_BWLIMIT=${RSYNC_BWLIMIT:-5000}
    profiles:
      - tools
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

networks:
  frontend:
  backend:
  database:
  monitoring:

volumes:
  db_data:
  db_payment_data:
  clickhouse_data:
  redis_0_data:
  redis_1_data:
  redis_2_data:
  redis_3_data:
  redis_4_data:
  redis_5_data:
  espx_logs:
  espx_ch_spool:
  espx_ch_spool_1:
  espx_region_proxy_wal:
  espx_broker_data:
  log_compactor_state:
