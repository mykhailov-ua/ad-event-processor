
services:
  tracker-0:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile
    entrypoint: ["/tracker"]
    network_mode: "${NET_MODE:-host}"
    env_file:
      - ../../.env
    environment:
      - SERVER_PORT=8181
      - METRICS_PORT=9101
      - TRACKER_PG_FALLBACK=${TRACKER_PG_FALLBACK:-0}
      - GOMEMLIMIT=700MiB
      - GOGC=300
    volumes:
      - ../../deploy/geoip:/deploy/geoip:ro
      - espx_logs:/var/log/espx:rw
    ulimits:
      nofile:
        soft: 100000
        hard: 100000
    deploy:
      resources:
        limits:
          memory: 1G
    healthcheck:
      test: ["CMD", "/tracker", "--health-probe", "http://127.0.0.1:8181/health"]
      interval: 5s
      timeout: 3s
      retries: 3
    restart: always
    depends_on:
      db:
        condition: service_healthy
      redis-0:
        condition: service_healthy
      redis-1:
        condition: service_healthy
      redis-2:
        condition: service_healthy
      redis-3:
        condition: service_healthy
      redis-4:
        condition: service_healthy
      redis-5:
        condition: service_healthy
    logging:
      driver: "json-file"
      options:
        max-size: "100m"
        max-file: "3"


