    healthcheck:
      test: ['CMD', '/tracker', '--health-probe', '/run/ad-event-processor/tracker/tracker-1.sock']
      interval: 5s
      timeout: 3s
      retries: 3
    restart: always
    depends_on:
      db:
        condition: service_healthy
      broker:
        condition: service_healthy
      redis-0:
        condition: service_healthy
      redis-1:
        condition: service_healthy
      redis-2:
        condition: service_healthy
      redis-3:
        condition: service_healthy
    logging:
      driver: 'json-file'
      options:
        max-size: '100m'
        max-file: '3'

  tracker-2:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile
      args:
        SKIP_CODEGEN: ${SKIP_CODEGEN:-0}
    entrypoint: ['/tracker']
    network_mode: '${NET_MODE:-host}'
    env_file:
      - ../../.env
    environment:
      - TRACKER_UNIX_SOCKET=/run/ad-event-processor/tracker/tracker-2.sock
      - METRICS_PORT=9103
      - BROKER_URL=${BROKER_URL:-/run/ad-event-processor/broker/gnet.sock}
      - CH_INGEST_SOURCE=${CH_INGEST_SOURCE:-broker}
      - BROKER_SHADOW_MODE=${BROKER_SHADOW_MODE:-0}
      - GOMEMLIMIT=700MiB
      - GOGC=300
    volumes:
      - type: bind
        source: ../../deploy/geoip
        target: /deploy/geoip
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ../../var/license.jwt
        target: /etc/ad-event-processor/license.jwt
        read_only: true
        bind:
          create_host_path: false
      - ad_event_processor_logs:/var/log/ad-event-processor:rw
      - ad_event_processor_run:/run/ad-event-processor:rw
    ulimits:
      nofile:
        soft: 100000
        hard: 100000
    deploy:
      resources:
        limits:
          memory: 1G
    healthcheck:
      test: ['CMD', '/tracker', '--health-probe', '/run/ad-event-processor/tracker/tracker-2.sock']
      interval: 5s
      timeout: 3s
      retries: 3
    restart: always
    depends_on:
      db:
        condition: service_healthy
      broker:
        condition: service_healthy
      redis-0:
        condition: service_healthy
      redis-1:
        condition: service_healthy
      redis-2:
        condition: service_healthy
      redis-3:
        condition: service_healthy
    logging:
      driver: 'json-file'
      options:
        max-size: '100m'
        max-file: '3'

  tracker-3:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile
      args:
        SKIP_CODEGEN: ${SKIP_CODEGEN:-0}
    entrypoint: ['/tracker']
    network_mode: '${NET_MODE:-host}'
    env_file:
      - ../../.env
    environment:
      - TRACKER_UNIX_SOCKET=/run/ad-event-processor/tracker/tracker-3.sock
      - METRICS_PORT=9104
      - BROKER_URL=${BROKER_URL:-/run/ad-event-processor/broker/gnet.sock}
      - CH_INGEST_SOURCE=${CH_INGEST_SOURCE:-broker}
      - BROKER_SHADOW_MODE=${BROKER_SHADOW_MODE:-0}
      - GOMEMLIMIT=700MiB
      - GOGC=300
    volumes:
      - type: bind
        source: ../../deploy/geoip
        target: /deploy/geoip
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ../../var/license.jwt
        target: /etc/ad-event-processor/license.jwt
        read_only: true
        bind:
          create_host_path: false
      - ad_event_processor_logs:/var/log/ad-event-processor:rw
      - ad_event_processor_run:/run/ad-event-processor:rw
    ulimits:
      nofile:
        soft: 100000
        hard: 100000
    deploy:
      resources:
        limits:
          memory: 1G
    healthcheck:
      test: ['CMD', '/tracker', '--health-probe', '/run/ad-event-processor/tracker/tracker-3.sock']
      interval: 5s
      timeout: 3s
      retries: 3
    restart: always
    depends_on:
      db:
        condition: service_healthy
      broker:
        condition: service_healthy
      redis-0:
        condition: service_healthy
      redis-1:
        condition: service_healthy
      redis-2:
        condition: service_healthy
      redis-3:
        condition: service_healthy
    logging:
      driver: 'json-file'
      options:
        max-size: '100m'
        max-file: '3'

  nginx:
    image: openresty/openresty:alpine
    network_mode: '${NET_MODE:-host}'
    environment:
      - REDIS_HOST=127.0.0.1
      - REDIS_PORT=6479
      - REDIS_PASS=${REDIS_PASSWORD}
      - REDIS_ADDRS=${REDIS_ADDRS}
      - MANAGEMENT_URL=unix:///run/ad-event-processor/control/http.sock
      - CONTROL_URL=unix:///run/ad-event-processor/control/http.sock
      - TRACKER_INGRESS_SCHEMA=${TRACKER_INGRESS_SCHEMA:-openrtb_3}
      - EDGE_EXPOSE_CLICK=${EDGE_EXPOSE_CLICK:-true}
      - EDGE_EXPOSE_OPENRTB=${EDGE_EXPOSE_OPENRTB:-false}
    volumes:
      - ../../deploy/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ../../deploy/nginx/nginx.conf:/usr/local/openresty/nginx/conf/nginx.conf:ro
      - ../../deploy/nginx/lua:/etc/nginx/lua:ro
      - ../../deploy/nginx/snippets:/etc/nginx/snippets:ro
      - ../../deploy/nginx/certs:/etc/nginx/certs:ro
      - ad_event_processor_run:/run/ad-event-processor:ro
    depends_on:
      tracker-0:
        condition: service_healthy
      tracker-1:
        condition: service_healthy
      tracker-2:
        condition: service_healthy
      tracker-3:
        condition: service_healthy
    ulimits:
      nofile:
        soft: 100000
        hard: 100000
    deploy:
      resources:
        limits:
          memory: 1G
    restart: always
    logging:
      driver: 'json-file'
      options:
        max-size: '100m'
        max-file: '3'

  processor:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile
      args:
        SKIP_CODEGEN: ${SKIP_CODEGEN:-0}
    entrypoint: ['/processor']
    network_mode: '${NET_MODE:-host}'
    env_file:
      - ../../.env
    volumes:
      - ad_event_processor_logs:/var/log/ad-event-processor:rw
      - ad_event_processor_run:/run/ad-event-processor:rw
      - ad_event_processor_ch_spool:/var/spool/ad-event-processor/ch:rw
      - type: bind
        source: ../../deploy/geoip
        target: /deploy/geoip
        bind:
          create_host_path: false
      - type: bind
        source: ../../var/fraudscore/artifacts
        target: /var/fraudscore/artifacts
        read_only: true
        bind:
          create_host_path: false
    environment:
      - DB_DSN=${DB_DSN}
      - REDIS_ADDRS=${REDIS_ADDRS}
      - CH_DSN=${CH_DSN}
      - CH_ENABLED=${CH_ENABLED:-1}
      - PROCESSOR_PORT=${PROCESSOR_PORT:-8186}
      - SERVER_PORT=${PROCESSOR_PORT:-8186}
      - GEOIP_DB_PATH=/deploy/geoip/GeoLite2-Country.mmdb
      - GEOIP_UPDATER_ENABLED=${GEOIP_UPDATER_ENABLED:-false}
      - MAXMIND_LICENSE_KEY=${MAXMIND_LICENSE_KEY:-}
      - DB_PROCESSOR_MAX_CONNS=${DB_PROCESSOR_MAX_CONNS}
      - CH_SPOOL_DIR=/var/spool/ad-event-processor/ch
      - BROKER_URL=${BROKER_URL:-/run/ad-event-processor/broker/gnet.sock}
      - CH_INGEST_SOURCE=${CH_INGEST_SOURCE:-broker}
      - BROKER_SHADOW_MODE=${BROKER_SHADOW_MODE:-0}
      - TRACKER_PG_FALLBACK=${TRACKER_PG_FALLBACK:-0}
      - ENV=${ENV:-development}
      - MULTI_REGION_ENABLED=${MULTI_REGION_ENABLED:-0}
      - AD_EVENT_PROCESSOR_REGION_CODE=${AD_EVENT_PROCESSOR_REGION_CODE:-0}
      - REGION_PROXY_ADDR=${REGION_PROXY_ADDR:-127.0.0.1:9093}
      - REGION_PROXY_REDIS_URL=${REGION_PROXY_REDIS_URL:-redis://127.0.0.1:6479/0}
      - GLOBAL_SPEND_BATCH_MIN=${GLOBAL_SPEND_BATCH_MIN:-100}
      - NODE_ID=${NODE_ID:-processor}
      - PROCESSOR_WEIGHT_ENABLED=${PROCESSOR_WEIGHT_ENABLED:-0}
      - MANAGEMENT_URL=${MANAGEMENT_URL:-http://127.0.0.1:8188}
      - FRAUD_SCORING_ENABLED=${FRAUD_SCORING_ENABLED:-false}
      - FRAUD_SCORING_MODEL_PATH=/var/fraudscore/artifacts/model.txt
      - GOMEMLIMIT=1500MiB
      - GOGC=100
    healthcheck:
      test: ['CMD', '/processor', '--health-probe', 'http://127.0.0.1:8186/health']
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 2G
    restart: always
    depends_on:
      db:
        condition: service_healthy
      broker:
        condition: service_healthy
      redis-0:
        condition: service_healthy
    logging:
      driver: 'json-file'
      options:
        max-size: '100m'
        max-file: '3'

  processor-1:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile
      args:
        SKIP_CODEGEN: ${SKIP_CODEGEN:-0}
    entrypoint: ['/processor']
    network_mode: '${NET_MODE:-host}'
    profiles:
      - multi-region
    env_file:
      - ../../.env
    volumes:
      - ad_event_processor_logs:/var/log/ad-event-processor:rw
      - ad_event_processor_run:/run/ad-event-processor:rw
      - ad_event_processor_ch_spool_1:/var/spool/ad-event-processor/ch:rw
      - type: bind
        source: ../../deploy/geoip
        target: /deploy/geoip
        bind:
          create_host_path: false
    environment:
      - DB_DSN=${DB_DSN}
      - REDIS_ADDRS=${REDIS_ADDRS}
      - CH_DSN=${CH_DSN}
      - PROCESSOR_PORT=8187
      - SERVER_PORT=8187
      - GEOIP_DB_PATH=/deploy/geoip/GeoLite2-Country.mmdb
      - DB_PROCESSOR_MAX_CONNS=${DB_PROCESSOR_MAX_CONNS}
      - CH_SPOOL_DIR=/var/spool/ad-event-processor/ch
      - BROKER_URL=${BROKER_URL:-/run/ad-event-processor/broker/gnet.sock}
      - CH_INGEST_SOURCE=${CH_INGEST_SOURCE:-broker}
      - BROKER_SHADOW_MODE=${BROKER_SHADOW_MODE:-0}
      - TRACKER_PG_FALLBACK=${TRACKER_PG_FALLBACK:-0}
      - ENV=${ENV:-development}
      - NODE_ID=processor-1
      - NODE_ROLE=processor
      - PROCESSOR_WEIGHT_ENABLED=1
      - MANAGEMENT_URL=${MANAGEMENT_URL:-http://127.0.0.1:8188}
      - GOMEMLIMIT=1500MiB
      - GOGC=100
    healthcheck:
      test: ['CMD', '/processor', '--health-probe', 'http://127.0.0.1:8187/health']
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 2G
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      broker:
        condition: service_healthy
      redis-0:
        condition: service_healthy
    logging:
      driver: 'json-file'
      options:
        max-size: '100m'
        max-file: '3'

  region-proxy:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile
      args:
        SKIP_CODEGEN: ${SKIP_CODEGEN:-0}
    entrypoint: ['/region-proxy']
    network_mode: '${NET_MODE:-host}'
    profiles:
      - multi-region
    env_file:
      - ../../.env
    environment:
      - GLOBAL_INGEST_URL=${GLOBAL_INGEST_URL:-http://127.0.0.1:8188/api/v1/region/ingest/batch}
      - GLOBAL_INGEST_API_KEY=${GLOBAL_INGEST_API_KEY:-${ADMIN_API_KEY}}
    command:
      - -addr=/run/ad-event-processor/region-proxy/gnet.sock
      - -health-addr=/run/ad-event-processor/region-proxy/health.sock
      - -data-dir=/tmp/ad-event-processor-region-proxy
      - -node-id=region-proxy-1
      - -region-code=${AD_EVENT_PROCESSOR_REGION_CODE:-1}
      - -redis-url=${REGION_PROXY_REDIS_URL:-unix:///run/ad-event-processor/redis/redis-0.sock?db=0}
      - -global-ingest-url=${GLOBAL_INGEST_URL:-http://127.0.0.1:8188/api/v1/region/ingest/batch}
      - -global-ingest-api-key=${GLOBAL_INGEST_API_KEY:-${ADMIN_API_KEY}}
    volumes:
      - ad_event_processor_region_proxy_wal:/tmp/ad-event-processor-region-proxy
      - ad_event_processor_run:/run/ad-event-processor:rw
    restart: unless-stopped
    depends_on:
      redis-0:
        condition: service_healthy
    logging:
      driver: 'json-file'
      options:
        max-size: '100m'
        max-file: '3'

  broker-data-init:
    image: busybox:1.36
    user: root
    volumes:
      - ad_event_processor_broker_data:/data
    command: ['sh', '-c', 'chown -R 65532:65532 /data && chmod -R u+rwX /data']
    restart: 'no'

  broker:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile
      args:
        SKIP_CODEGEN: ${SKIP_CODEGEN:-0}
    entrypoint: ['/broker']
    network_mode: '${NET_MODE:-host}'
    env_file:
      - ../../.env
    environment:
      - BROKER_REDIS_PASSWORD=${REDIS_PASSWORD}
    command:
      - serve
      - -addr=/run/ad-event-processor/broker/gnet.sock
      - -health-addr=/run/ad-event-processor/broker/health.sock
      - -data-dir=/tmp/ad-event-processor-broker
      - -node-id=broker-1
      - -redis-url=${BROKER_REDIS_URL:-unix:///run/ad-event-processor/redis/redis-0.sock?db=0}
    volumes:
      - ad_event_processor_broker_data:/tmp/ad-event-processor-broker
      - ad_event_processor_run:/run/ad-event-processor:rw
    healthcheck:
      test: ['CMD', '/broker', '--health-probe', '/run/ad-event-processor/broker/health.sock']
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    depends_on:
      broker-data-init:
        condition: service_completed_successfully
      redis-0:
        condition: service_healthy
    logging:
      driver: 'json-file'
      options:
        max-size: '100m'
        max-file: '3'

  control:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile
      args:
        SKIP_CODEGEN: ${SKIP_CODEGEN:-0}
    entrypoint: ['/control']
    network_mode: '${NET_MODE:-host}'
    profiles:
      - single_vps
      - ingest_only
      - network_operator
      - resilience
      - crypto
      - fraud-scorer
    env_file:
      - ../../.env
    volumes:
      - type: bind
        source: ../../var/license.jwt
        target: /etc/ad-event-processor/license.jwt
        bind:
          create_host_path: false
      - ad_event_processor_run:/run/ad-event-processor:rw
    environment:
      - MANAGEMENT_PORT=8188
      - CONTROL_UNIX_SOCKET=/run/ad-event-processor/control/http.sock
      - PAYMENT_WEBHOOK_PORT=8187
      - DB_DSN=${DB_DSN}
      - PAYMENT_DB_DSN=${PAYMENT_DB_DSN}
      - REDIS_ADDRS=${REDIS_ADDRS:-/run/ad-event-processor/redis/redis-0.sock}
      - CONTROL_ENABLE_AUTH=1
      - CONTROL_ENABLE_MANAGEMENT=1
      - CONTROL_ENABLE_PAYMENT=${CONTROL_ENABLE_PAYMENT:-1}
      - CONTROL_ENABLE_BILLING=${CONTROL_ENABLE_BILLING:-1}
      - CONTROL_ENABLE_NOTIFIER=${CONTROL_ENABLE_NOTIFIER:-1}
      - CONTROL_ENABLE_MARGIN_GUARD=${CONTROL_ENABLE_MARGIN_GUARD:-1}
      - CONTROL_ENABLE_COST_SYNC=${CONTROL_ENABLE_COST_SYNC:-1}
      - ALERTMANAGER_WEBHOOK_ENABLED=${ALERTMANAGER_WEBHOOK_ENABLED:-false}
      - ALERTMANAGER_WEBHOOK_TOKEN=${ALERTMANAGER_WEBHOOK_TOKEN:-}
      - BLACKLIST_JANITOR_ENABLED=${BLACKLIST_JANITOR_ENABLED:-true}
      - GLOBAL_SPEND_BATCH_MIN=${GLOBAL_SPEND_BATCH_MIN:-100}
      - GLOBAL_SPEND_FLUSH_INTERVAL_MS=${GLOBAL_SPEND_FLUSH_INTERVAL_MS:-500}
      - GLOBAL_SPEND_MAX_CONCURRENCY=${GLOBAL_SPEND_MAX_CONCURRENCY:-8}
      - CRYPTO_WEBHOOK_SECRET=${CRYPTO_WEBHOOK_SECRET:-}
      - CRYPTO_MIN_PAYMENT_MICRO=${CRYPTO_MIN_PAYMENT_MICRO:-10000000}
      - CRYPTO_CONFIRMATION_DEPTH=${CRYPTO_CONFIRMATION_DEPTH:-12}
      - CH_ENABLED=${CH_ENABLED:-1}
      - MULTI_REGION_ENABLED=${MULTI_REGION_ENABLED:-0}
      - AD_EVENT_PROCESSOR_REGION_CODE=${AD_EVENT_PROCESSOR_REGION_CODE:-0}
      - CADDY_TLS_ASK_TOKEN=${CADDY_TLS_ASK_TOKEN:-}
      - CADDY_TLS_ASK_ALLOW_LOCAL=${CADDY_TLS_ASK_ALLOW_LOCAL:-1}
    deploy:
      resources:
        limits:
          memory: 1536M
    healthcheck:
      test: ['CMD', '/control', '--health-probe', 'http://127.0.0.1:8188/health']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 45s
    restart: always
    depends_on:
      db:
        condition: service_healthy
      redis-0:
        condition: service_healthy
      db-payment:
        condition: service_healthy
        required: false
    logging:
      driver: 'json-file'
      options:
        max-size: '100m'
        max-file: '3'

  ingress:
    image: caddy:2.8-alpine
    profiles:
      - ingress
    network_mode: '${NET_MODE:-host}'
    env_file:
      - ../../.env
    volumes:
      - type: bind
        source: ../../deploy/ingress/caddy/generated/Caddyfile
        target: /etc/caddy/Caddyfile
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ../../deploy/ingress/certs
        target: /etc/caddy/certs
        read_only: true
        bind:
          create_host_path: false
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      tracker-0:
        condition: service_healthy
      control:
        condition: service_healthy
    restart: always
    logging:
      driver: 'json-file'
      options:
        max-size: '50m'
        max-file: '3'

  edge-xdp:
    build:
      context: ../..
      dockerfile: deploy/edge/xdp/Dockerfile
    network_mode: '${NET_MODE:-host}'
    profiles:
      - enterprise-xdp
    privileged: true
    cap_add:
      - BPF
      - NET_ADMIN
    security_opt:
      - seccomp:unconfined
    pid: host
    env_file:
      - ../../.env
    environment:
      - INGRESS_INTERFACE=${EDGE_XDP_INGRESS_INTERFACE:-lo}
      - BPF_PIN_DIR=${EDGE_BPF_PIN_DIR:-/sys/fs/bpf/ad-event-processor}
      - XDP_MODE=${EDGE_XDP_MODE:-generic}
      - REDIS_ADDRS=${EDGE_XDP_REDIS_ADDRS:-127.0.0.1:6479}
      - REDIS_PASS=${REDIS_PASSWORD}
      - SYNC_INTERVAL=${EDGE_BPF_SYNC_INTERVAL:-5s}
      - METRICS_PORT=${EDGE_BPF_SYNC_METRICS_PORT:-9191}
      - XDP_SYN_COOKIE=${XDP_SYN_COOKIE:-0}
