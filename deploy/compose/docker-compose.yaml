      redis-0:
        condition: service_healthy
    logging:
      driver: "json-file"
      options:
        max-size: "100m"
        max-file: "3"


  control:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile
    entrypoint: ["/control"]
    network_mode: "${NET_MODE:-host}"
    profiles:
      - single_vps
      - ingest_only
      - network_operator
      - resilience
      - crypto
      - fraud-scorer
    env_file:
      - ../../.env
    environment:
      - SERVER_PORT=${SERVER_PORT:-8181}
      - MANAGEMENT_PORT=8188
      - PAYMENT_WEBHOOK_PORT=8187
      - DB_DSN=${DB_DSN}
      - PAYMENT_DB_DSN=${PAYMENT_DB_DSN}
      - REDIS_ADDRS=127.0.0.1:6479
      - CONTROL_ENABLE_AUTH=1
      - CONTROL_ENABLE_MANAGEMENT=1
      - CONTROL_ENABLE_PAYMENT=${CONTROL_ENABLE_PAYMENT:-1}
      - CONTROL_ENABLE_BILLING=${CONTROL_ENABLE_BILLING:-1}
      - CONTROL_ENABLE_NOTIFIER=${CONTROL_ENABLE_NOTIFIER:-1}
      - CONTROL_ENABLE_MARGIN_GUARD=${CONTROL_ENABLE_MARGIN_GUARD:-1}
      - CONTROL_ENABLE_COST_SYNC=${CONTROL_ENABLE_COST_SYNC:-1}
      - ALERTMANAGER_WEBHOOK_ENABLED=${ALERTMANAGER_WEBHOOK_ENABLED:-false}
      - ALERTMANAGER_WEBHOOK_TOKEN=${ALERTMANAGER_WEBHOOK_TOKEN:-}
      - BLACKLIST_JANITOR_ENABLED=${BLACKLIST_JANITOR_ENABLED:-true}
      - GLOBAL_SPEND_BATCH_MIN=${GLOBAL_SPEND_BATCH_MIN:-100}
      - GLOBAL_SPEND_FLUSH_INTERVAL_MS=${GLOBAL_SPEND_FLUSH_INTERVAL_MS:-500}
      - GLOBAL_SPEND_MAX_CONCURRENCY=${GLOBAL_SPEND_MAX_CONCURRENCY:-8}
      - CRYPTO_WEBHOOK_SECRET=${CRYPTO_WEBHOOK_SECRET:-}
      - CRYPTO_MIN_PAYMENT_MICRO=${CRYPTO_MIN_PAYMENT_MICRO:-10000000}
      - CRYPTO_CONFIRMATION_DEPTH=${CRYPTO_CONFIRMATION_DEPTH:-12}
      - CH_ENABLED=${CH_ENABLED:-1}
      - MULTI_REGION_ENABLED=${MULTI_REGION_ENABLED:-0}
      - ESPX_REGION_CODE=${ESPX_REGION_CODE:-0}
    deploy:
      resources:
        limits:
          memory: 1536M
    healthcheck:
      test: ["CMD", "/control", "--health-probe", "http://127.0.0.1:8188/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 45s
    restart: always
    depends_on:
      db:
        condition: service_healthy
      redis-0:
        condition: service_healthy
      db-payment:
        condition: service_healthy
        required: false
    logging:
      driver: "json-file"
      options:
        max-size: "100m"
        max-file: "3"


  ivt-detector:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile
    entrypoint: ["/ivt-detector"]
    network_mode: "${NET_MODE:-host}"
    profiles:
      - analytics_ml
      - resilience
    env_file:
      - ../../.env
    environment:
      - IVT_DETECTOR_ENABLED=true
      - CH_DSN=${CH_DSN}
      - DB_DSN=${DB_DSN}
      - MANAGEMENT_URL=http://127.0.0.1:8188
      - ADMIN_API_KEY=${ADMIN_API_KEY}
    deploy:
      resources:
        limits:
          memory: 256M
    restart: always
    depends_on:
      db:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
    logging:
      driver: "json-file"
      options:
        max-size: "100m"
        max-file: "3"

  fraud-scorer:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile
    entrypoint: ["/fraud-scorer"]
    network_mode: "${NET_MODE:-host}"
    profiles:
      - analytics_ml
      - fraud-scorer
    env_file:
      - ../../.env
    environment:
      - FRAUD_SCORING_ENABLED=true
      - FRAUD_SCORER_STANDALONE=true
      - CH_DSN=${CH_DSN}
      - DB_DSN=${DB_DSN}
      - MANAGEMENT_URL=http://127.0.0.1:8188
      - ADMIN_API_KEY=${ADMIN_API_KEY}
    volumes:
      - ../../var/fraudscore/artifacts:/var/fraudscore/artifacts:rw
    deploy:
      resources:
        limits:
          memory: 512M
    restart: always
    depends_on:
      db:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
    logging:
      driver: "json-file"
      options:
        max-size: "100m"
        max-file: "3"


  db:
    image: postgres:${POSTGRES_VERSION}
    env_file:
      - ../../.env
    environment:
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - POSTGRES_DB=${DB_NAME}
    ports:
      - "${DB_PORT}:${DB_PORT}"
    command:
      ["postgres", "-p", "${DB_PORT}", "-c", "max_connections=600", "-c", "shared_buffers=1GB", "-c", "work_mem=64MB", "-c", "maintenance_work_mem=256MB", "-c", "effective_cache_size=3GB"]
    volumes:
      - db_data:/var/lib/postgresql/data
    networks:
      - database
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -p ${DB_PORT} -U ${DB_USER} -d ${DB_NAME}"]
      interval: ${HEALTHCHECK_INTERVAL}
      timeout: ${HEALTHCHECK_TIMEOUT}
      retries: ${HEALTHCHECK_RETRIES}
    deploy:
      resources:
        limits:
          memory: 2G
    logging:
      driver: "json-file"
      options:
        max-size: "100m"
        max-file: "3"


  db-payment:
    image: postgres:${POSTGRES_VERSION}
    profiles:
      - single_vps
      - network_operator
      - crypto
      - resilience
    env_file:
      - ../../.env
    environment:
      - POSTGRES_USER=${PAYMENT_DB_USER}
      - POSTGRES_PASSWORD=${PAYMENT_DB_PASSWORD}
      - POSTGRES_DB=${PAYMENT_DB_NAME}
    ports:
      - "${PAYMENT_DB_PORT}:${PAYMENT_DB_PORT}"
    command:
      ["postgres", "-p", "${PAYMENT_DB_PORT}", "-c", "max_connections=100", "-c", "shared_buffers=256MB", "-c", "work_mem=16MB", "-c", "maintenance_work_mem=64MB", "-c", "effective_cache_size=768MB"]
    volumes:
      - db_payment_data:/var/lib/postgresql/data
    networks:
      - database
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -p ${PAYMENT_DB_PORT} -U ${PAYMENT_DB_USER} -d ${PAYMENT_DB_NAME}"]
      interval: ${HEALTHCHECK_INTERVAL}
      timeout: ${HEALTHCHECK_TIMEOUT}
      retries: ${HEALTHCHECK_RETRIES}
    deploy:
      resources:
        limits:
          memory: 1G
    logging:
      driver: "json-file"
      options:
        max-size: "100m"
        max-file: "3"


  redis-0:
    image: redis:${REDIS_VERSION}
    env_file:
      - ../../.env
    ports:
      - "6479:6379"
    command: ["redis-server", "--port", "6379", "--requirepass", "${REDIS_PASSWORD}",
              "--appendonly", "yes", "--appendfsync", "everysec",
              "--maxmemory-policy", "noeviction"]
    volumes:
      - redis_0_data:/data
    deploy:
      resources:
        limits:
          memory: 768M
    networks:
      - database
    healthcheck:
      test: ["CMD", "redis-cli", "-p", "6379", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: ${HEALTHCHECK_INTERVAL}
      timeout: ${HEALTHCHECK_TIMEOUT}
      retries: ${HEALTHCHECK_RETRIES}

