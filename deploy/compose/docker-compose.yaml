    command:
      - -addr=127.0.0.1:9092
      - -health-addr=127.0.0.1:8084
      - -data-dir=/tmp/espx-broker
      - -node-id=broker-1
      - -redis-url=${REGION_PROXY_REDIS_URL:-redis://127.0.0.1:6479/0}
    volumes:
      - espx_broker_data:/tmp/espx-broker
    restart: unless-stopped
