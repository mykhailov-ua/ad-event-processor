services:
  run-dir-init:
    image: busybox:1.36
    command: ['/bin/sh', '/scripts/init-run-volume.sh']
    volumes:
      - ad_event_processor_run:/run/ad-event-processor
      - type: bind
        source: ./scripts/init-run-volume.sh
        target: /scripts/init-run-volume.sh
        read_only: true
    networks:
      - database
    restart: 'no'

  tracker-0:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile
      args:
        SKIP_CODEGEN: ${SKIP_CODEGEN:-0}
    entrypoint: ['/tracker']
    network_mode: '${NET_MODE:-host}'
    env_file:
      - ../../.env
    environment:
      - TRACKER_UNIX_SOCKET=/run/ad-event-processor/tracker/tracker-0.sock
      - METRICS_PORT=9101
      - REDIS_ADDRS=${REDIS_ADDRS}
      - BROKER_URL=${BROKER_URL:-/run/ad-event-processor/broker/gnet.sock}
      - CH_INGEST_SOURCE=${CH_INGEST_SOURCE:-broker}
      - BROKER_SHADOW_MODE=${BROKER_SHADOW_MODE:-0}
      - TRACKER_PG_FALLBACK=${TRACKER_PG_FALLBACK:-0}
      - TRACKER_INGRESS_SCHEMA=${TRACKER_INGRESS_SCHEMA:-openrtb_3}
      - GOMEMLIMIT=700MiB
      - GOGC=300
    volumes:
      - type: bind
        source: ../../deploy/geoip
        target: /deploy/geoip
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ../../var/license.jwt
        target: /etc/ad-event-processor/license.jwt
        read_only: true
        bind:
          create_host_path: false
      - ad_event_processor_logs:/var/log/ad-event-processor:rw
      - ad_event_processor_run:/run/ad-event-processor:rw
    ulimits:
      nofile:
        soft: 100000
        hard: 100000
    deploy:
      resources:
        limits:
          memory: 1G
    healthcheck:
      test: ['CMD', '/tracker', '--health-probe', '/run/ad-event-processor/tracker/tracker-0.sock']
      interval: 5s
      timeout: 3s
      retries: 3
    restart: always
    depends_on:
      db:
        condition: service_healthy
      broker:
        condition: service_healthy
      redis-0:
        condition: service_healthy
      redis-1:
        condition: service_healthy
      redis-2:
        condition: service_healthy
      redis-3:
        condition: service_healthy
    logging:
      driver: 'json-file'
      options:
        max-size: '100m'
        max-file: '3'

  tracker-1:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile
      args:
        SKIP_CODEGEN: ${SKIP_CODEGEN:-0}
    entrypoint: ['/tracker']
    network_mode: '${NET_MODE:-host}'
    env_file:
      - ../../.env
    environment:
      - TRACKER_UNIX_SOCKET=/run/ad-event-processor/tracker/tracker-1.sock
      - METRICS_PORT=9102
      - BROKER_URL=${BROKER_URL:-/run/ad-event-processor/broker/gnet.sock}
      - CH_INGEST_SOURCE=${CH_INGEST_SOURCE:-broker}
      - BROKER_SHADOW_MODE=${BROKER_SHADOW_MODE:-0}
      - GOMEMLIMIT=700MiB
      - GOGC=300
    volumes:
      - type: bind
        source: ../../deploy/geoip
        target: /deploy/geoip
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ../../var/license.jwt
        target: /etc/ad-event-processor/license.jwt
        read_only: true
        bind:
