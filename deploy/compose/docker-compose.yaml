  db:
    image: postgres:${POSTGRES_VERSION}
    env_file:
      - ../../.env
    depends_on:
      run-dir-init:
        condition: service_completed_successfully
    environment:
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - POSTGRES_DB=${DB_NAME}
    ports:
      - '${DB_PORT}:${DB_PORT}'
    command:
      [
        'postgres',
        '-p',
        '${DB_PORT}',
        '-c',
        'unix_socket_directories=/run/ad-event-processor/postgresql',
        '-c',
        'max_connections=600',
        '-c',
        'shared_buffers=1GB',
        '-c',
        'work_mem=64MB',
        '-c',
        'maintenance_work_mem=256MB',
        '-c',
        'effective_cache_size=3GB',
      ]
    volumes:
      - db_data:/var/lib/postgresql/data
      - ad_event_processor_run:/run/ad-event-processor
    networks:
      - database
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'pg_isready -h /run/ad-event-processor/postgresql -p ${DB_PORT} -U ${DB_USER} -d ${DB_NAME}',
        ]
      interval: ${HEALTHCHECK_INTERVAL:-5s}
      timeout: ${HEALTHCHECK_TIMEOUT:-5s}
      retries: ${HEALTHCHECK_RETRIES:-5}
    deploy:
      resources:
        limits:
          memory: 2G
    logging:
      driver: 'json-file'
      options:
        max-size: '100m'
        max-file: '3'

