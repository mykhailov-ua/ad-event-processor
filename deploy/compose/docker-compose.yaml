  nginx:
    image: openresty/openresty:alpine
    network_mode: "${NET_MODE:-host}"
    environment:
      - REDIS_HOST=127.0.0.1
      - REDIS_PORT=6479
      - REDIS_PASS=${REDIS_PASSWORD}
      - REDIS_ADDRS=127.0.0.1:6479,127.0.0.1:6480,127.0.0.1:6481,127.0.0.1:6482,127.0.0.1:6483,127.0.0.1:6484
      - MANAGEMENT_URL=http://127.0.0.1:8188
      - TRACKER_INGRESS_SCHEMA=${TRACKER_INGRESS_SCHEMA:-openrtb_3}
    volumes:
      - ../../deploy/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ../../deploy/nginx/nginx.conf:/usr/local/openresty/nginx/conf/nginx.conf:ro
      - ../../deploy/nginx/lua:/etc/nginx/lua:ro
      - ../../deploy/nginx/certs:/etc/nginx/certs:ro
    depends_on:
      tracker-0:
        condition: service_healthy
      tracker-1:
        condition: service_healthy
      tracker-2:
        condition: service_healthy
      tracker-3:
        condition: service_healthy
    ulimits:
      nofile:
        soft: 100000
        hard: 100000
    deploy:
      resources:
        limits:
          memory: 1G
    restart: always
    logging:
      driver: "json-file"
      options:
        max-size: "100m"
        max-file: "3"


  processor:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile
    entrypoint: ["/processor"]
    network_mode: "${NET_MODE:-host}"
    env_file:
      - ../../.env
    volumes:
      - espx_logs:/var/log/espx:rw
      - espx_ch_spool:/var/spool/espx/ch:rw
      - ../../deploy/geoip:/deploy/geoip:rw
    environment:
      - DB_DSN=${DB_DSN}
      - REDIS_ADDRS=127.0.0.1:6479,127.0.0.1:6480,127.0.0.1:6481,127.0.0.1:6482,127.0.0.1:6483,127.0.0.1:6484
      - CH_DSN=${CH_DSN}
      - CH_ENABLED=${CH_ENABLED:-1}
      - PROCESSOR_PORT=${PROCESSOR_PORT:-8186}
      - SERVER_PORT=${PROCESSOR_PORT:-8186}
      - GEOIP_DB_PATH=/deploy/geoip/GeoLite2-Country.mmdb
      - GEOIP_UPDATER_ENABLED=${GEOIP_UPDATER_ENABLED:-false}
      - MAXMIND_LICENSE_KEY=${MAXMIND_LICENSE_KEY:-}
      - DB_PROCESSOR_MAX_CONNS=${DB_PROCESSOR_MAX_CONNS}
      - CH_SPOOL_DIR=/var/spool/espx/ch
      - TRACKER_PG_FALLBACK=${TRACKER_PG_FALLBACK:-0}
      - ENV=${ENV:-development}
      - MULTI_REGION_ENABLED=${MULTI_REGION_ENABLED:-0}
      - ESPX_REGION_CODE=${ESPX_REGION_CODE:-0}
      - REGION_PROXY_ADDR=${REGION_PROXY_ADDR:-127.0.0.1:9093}
      - REGION_PROXY_REDIS_URL=${REGION_PROXY_REDIS_URL:-redis://127.0.0.1:6479/0}
      - GLOBAL_SPEND_BATCH_MIN=${GLOBAL_SPEND_BATCH_MIN:-100}
      - NODE_ID=${NODE_ID:-processor}
      - PROCESSOR_WEIGHT_ENABLED=${PROCESSOR_WEIGHT_ENABLED:-0}
      - MANAGEMENT_URL=${MANAGEMENT_URL:-http://127.0.0.1:8188}
      - GOMEMLIMIT=1500MiB
      - GOGC=100
    healthcheck:
      test: ["CMD", "/processor", "--health-probe", "http://127.0.0.1:8186/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 2G
    restart: always
    depends_on:
      db:
        condition: service_healthy
      redis-0:
        condition: service_healthy
    logging:
      driver: "json-file"
      options:
        max-size: "100m"
        max-file: "3"


  processor-1:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile
    entrypoint: ["/processor"]
    network_mode: "${NET_MODE:-host}"
    profiles:
      - multi-region
    env_file:
      - ../../.env
    volumes:
      - espx_logs:/var/log/espx:rw
      - espx_ch_spool_1:/var/spool/espx/ch:rw
      - ../../deploy/geoip:/deploy/geoip:rw
    environment:
      - DB_DSN=${DB_DSN}
      - REDIS_ADDRS=127.0.0.1:6479,127.0.0.1:6480,127.0.0.1:6481,127.0.0.1:6482,127.0.0.1:6483,127.0.0.1:6484
      - CH_DSN=${CH_DSN}
      - PROCESSOR_PORT=8187
      - SERVER_PORT=8187
      - GEOIP_DB_PATH=/deploy/geoip/GeoLite2-Country.mmdb
      - DB_PROCESSOR_MAX_CONNS=${DB_PROCESSOR_MAX_CONNS}
      - CH_SPOOL_DIR=/var/spool/espx/ch
      - TRACKER_PG_FALLBACK=${TRACKER_PG_FALLBACK:-0}
      - ENV=${ENV:-development}
      - NODE_ID=processor-1
      - NODE_ROLE=processor
      - PROCESSOR_WEIGHT_ENABLED=1
      - MANAGEMENT_URL=${MANAGEMENT_URL:-http://127.0.0.1:8188}
      - GOMEMLIMIT=1500MiB
      - GOGC=100
    healthcheck:
      test: ["CMD", "/processor", "--health-probe", "http://127.0.0.1:8187/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 2G
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis-0:
        condition: service_healthy
    logging:
      driver: "json-file"
      options:
        max-size: "100m"
        max-file: "3"


  region-proxy:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile
    entrypoint: ["/region-proxy"]
    network_mode: "${NET_MODE:-host}"
    profiles:
      - multi-region
    env_file:
      - ../../.env
    environment:
      - GLOBAL_INGEST_URL=${GLOBAL_INGEST_URL:-http://127.0.0.1:8188/api/v1/region/ingest/batch}
      - GLOBAL_INGEST_API_KEY=${GLOBAL_INGEST_API_KEY:-${ADMIN_API_KEY}}
    command:
      - -addr=127.0.0.1:9093
      - -health-addr=127.0.0.1:8083
      - -data-dir=/tmp/espx-region-proxy
      - -node-id=region-proxy-1
      - -region-code=${ESPX_REGION_CODE:-1}
      - -redis-url=${REGION_PROXY_REDIS_URL:-redis://127.0.0.1:6479/0}
      - -global-ingest-url=${GLOBAL_INGEST_URL:-http://127.0.0.1:8188/api/v1/region/ingest/batch}
      - -global-ingest-api-key=${GLOBAL_INGEST_API_KEY:-${ADMIN_API_KEY}}
    volumes:
      - espx_region_proxy_wal:/tmp/espx-region-proxy
    restart: unless-stopped
    depends_on:
      redis-0:
        condition: service_healthy
    logging:
      driver: "json-file"
      options:
        max-size: "100m"
        max-file: "3"

  broker:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile
    entrypoint: ["/broker"]
    network_mode: "${NET_MODE:-host}"
    profiles:
      - multi-region
    env_file:
