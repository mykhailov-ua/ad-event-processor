# Merged when AD_EVENT_PROCESSOR_USE_RELEASE_IMAGES=1 or AD_EVENT_PROCESSOR_APP_IMAGE is set (see scripts/dev/stack.sh).
# Requires AD_EVENT_PROCESSOR_APP_IMAGE (e.g. ghcr.io/<owner>/ad-event-processor:v1.0.0).
# Legacy ESPX_APP_IMAGE is exported as AD_EVENT_PROCESSOR_APP_IMAGE by stack.sh when unset.
services:
  tracker-0:
    image: ${AD_EVENT_PROCESSOR_APP_IMAGE}
    build: null
  processor:
    image: ${AD_EVENT_PROCESSOR_APP_IMAGE}
    build: null
  control:
    image: ${AD_EVENT_PROCESSOR_APP_IMAGE}
    build: null
