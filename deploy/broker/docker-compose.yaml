services:
  redis:
    image: redis:7-alpine
    container_name: ad-event-processor-broker-redis
    network_mode: host
    command: ['redis-server', '--port', '6379', '--appendonly', 'yes', '--tcp-backlog', '2048']

  haproxy:
    image: haproxy:2.8-alpine
    network_mode: host
    volumes:
      - ./haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
    depends_on:
      - broker-1
      - broker-2

  broker-1:
    image: alpine:latest
    network_mode: host
    command:
      - /app/ad-event-processor-broker
      - -addr
      - 127.0.0.1:19093
      - -health-addr
      - 127.0.0.1:8081
      - -data-dir
      - /data
      - -node-id
      - broker-1
      - -redis-url
      - redis://127.0.0.1:6379/0
    volumes:
      - ${AD_EVENT_PROCESSOR_BROKER_BIN:-./deploy/broker/bin/ad-event-processor-broker}:/app/ad-event-processor-broker:ro
      - broker-1-data:/data
    depends_on:
      - redis

  broker-2:
    image: alpine:latest
    network_mode: host
    command:
      - /app/ad-event-processor-broker
      - -addr
      - 127.0.0.1:19094
      - -health-addr
      - 127.0.0.1:8082
      - -data-dir
      - /data
      - -node-id
      - broker-2
      - -redis-url
      - redis://127.0.0.1:6379/0
    volumes:
      - ${AD_EVENT_PROCESSOR_BROKER_BIN:-./deploy/broker/bin/ad-event-processor-broker}:/app/ad-event-processor-broker:ro
      - broker-2-data:/data
    depends_on:
      - redis

volumes:
  broker-1-data:
  broker-2-data:
