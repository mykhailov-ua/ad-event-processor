# Shared TCP TLS settings for the :443 server (not QUIC/HTTP3).
ssl_certificate     /etc/nginx/certs/edge-dev.crt;
ssl_certificate_key /etc/nginx/certs/edge-dev.key;
ssl_protocols       TLSv1.2 TLSv1.3;
ssl_prefer_server_ciphers off;

# Kernel TLS (OpenSSL SSL_OP_ENABLE_KTLS). After handshake, record crypto can
# move into the kernel for TCP TLS. Does not apply to listen quic / HTTP3.
# nginx SSL_sendfile is for file responses; /track is proxy_pass (SSL_write).
# Host needs the `tls` module (CONFIG_TLS). If it is absent, OpenSSL stays in
# userspace AES-NI and nginx still starts.
ssl_conf_command Options KTLS;
