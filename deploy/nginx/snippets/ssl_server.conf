
ssl_certificate     /etc/nginx/certs/edge-dev.crt;
ssl_certificate_key /etc/nginx/certs/edge-dev.key;

# Mozilla SSL Configuration Generator profile: Intermediate (2024-11).
# Do not reorder ssl_ciphers without updating deploy/nginx/baselines/tls_server_persona.manifest
# and running bash scripts/test/edge/tls_server_persona_audit.sh.
ssl_protocols       TLSv1.2 TLSv1.3;
ssl_prefer_server_ciphers off;
ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;

ssl_conf_command Options KTLS;
