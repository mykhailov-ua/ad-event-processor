        location = /click {
            limit_except GET {
                deny all;
            }
            limit_req zone=track_ip burst=50 nodelay;

            access_by_lua_file /etc/nginx/lua/access-check.lua;

            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_pass http://trackers;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

            header_filter_by_lua_block {
                local edge_safe_page = require "edge-safe-page"
                edge_safe_page.header_filter()
            }

            body_filter_by_lua_block {
                local edge_safe_page = require "edge-safe-page"
                edge_safe_page.body_filter()
            }

            proxy_next_upstream error timeout invalid_header http_500 http_502 http_503 http_504;
            proxy_connect_timeout 1s;
            proxy_buffering off;
            proxy_read_timeout 35s;
            proxy_send_timeout 35s;
        }

        location = /safe_page_content {
            internal;
            proxy_http_version 1.1;
            proxy_pass http://trackers/safe_page_stub;
            proxy_set_header Host $host;
            proxy_set_header Connection "";
        }

        location = /openrtb/bid {
            limit_req zone=track_ip burst=50 nodelay;

            access_by_lua_file /etc/nginx/lua/access-check.lua;

            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_pass http://trackers;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

            proxy_next_upstream error timeout invalid_header http_500 http_502 http_503 http_504;
            proxy_connect_timeout 1s;
            proxy_read_timeout 5s;
        }
