# Optional hosted lander security headers for /lp/ static serve.
# Enable by setting LANDER_CSP_ENABLED=1 in edge env and including this file from edge_optional_locations.conf.
add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
