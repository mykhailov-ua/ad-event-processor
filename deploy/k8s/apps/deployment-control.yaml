apiVersion: apps/v1
kind: Deployment
metadata:
  name: control
  namespace: espx
  labels:
    app.kubernetes.io/name: control
    app.kubernetes.io/component: cold-path
    app.kubernetes.io/part-of: espx
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: control
  template:
    metadata:
      labels:
        app.kubernetes.io/name: control
        app.kubernetes.io/component: cold-path
        app.kubernetes.io/part-of: espx
    spec:
      containers:
        - name: control
          image: ad-event-processor:latest
          imagePullPolicy: IfNotPresent
          command: ["/control"]
          envFrom:
            - configMapRef:
                name: espx-env
            - secretRef:
                name: espx-secrets
          env:
            - name: GOMEMLIMIT
              value: "1400MiB"
            - name: MANAGEMENT_PORT
              value: "8188"
            - name: PAYMENT_WEBHOOK_PORT
              value: "8187"
            - name: CONTROL_ENABLE_AUTH
              value: "1"
            - name: CONTROL_ENABLE_MANAGEMENT
              value: "1"
            - name: CONTROL_ENABLE_PAYMENT
              value: "1"
            - name: CONTROL_ENABLE_BILLING
              value: "1"
            - name: CONTROL_ENABLE_NOTIFIER
              value: "1"
            - name: CONTROL_ENABLE_MARGIN_GUARD
              value: "1"
            - name: CONTROL_ENABLE_COST_SYNC
              value: "1"
          ports:
            - name: http
              containerPort: 8188
            - name: webhook
              containerPort: 8187
            - name: udp-control
              containerPort: 8190
              protocol: UDP
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
          resources:
            requests:
              memory: 256Mi
              cpu: 200m
            limits:
              memory: 1536Mi
