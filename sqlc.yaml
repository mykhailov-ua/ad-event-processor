version: "2"
sql:
  - schema: "internal/ingestion/migrations"
    queries: "internal/ingestion/queries"
    engine: "postgresql"
    gen:
      go:
        package: "db"
        out: "internal/domain/db"
        sql_package: "pgx/v5"
        emit_json_tags: true
        emit_prepared_queries: false
        emit_interface: true
        emit_exact_table_names: false
  - schema: "internal/identity/migrations"
    queries: "internal/identity/queries"
    engine: "postgresql"
