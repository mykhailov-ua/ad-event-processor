[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
extend-select = ["W291", "W293"]

[tool.ruff.lint.isort]
lines-after-imports = 1
known-first-party = [
    "contract",
    "train",
    "eval",
    "data",
    "repo_paths",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.pyright]
include = ["."]
pythonVersion = "3.12"
typeCheckingMode = "basic"
reportMissingModuleSource = "none"
venvPath = "."
venv = ".venv"
extraPaths = ["."]

[[tool.pyright.executionEnvironments]]
root = "."
extraPaths = ["."]
pythonVersion = "3.12"
