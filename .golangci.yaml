version: "2"

run:
  timeout: 8m
  go: "1.25.12"

linters:
  enable:
    - govet
    - errcheck
    - staticcheck
    - revive
    - unused
    - misspell
    - gocritic
    - noctx
    - bodyclose
    - contextcheck
    - errorlint
    - forbidigo
  settings:
    revive:
      rules:
        - name: exported
          disabled: true
    staticcheck:
      checks:
        - all
        - SA9003
        - SA4017
        - -ST1000
    gocritic:
      enabled-checks:
        - builtinShadow
        - dupImport
        - httpNoBody
        - nilValReturn
        - octalLiteral
        - typeAssertChain
    forbidigo:
      analyze-types: true
      forbid:
        - pattern: '^(fmt\.Print(|f|ln)|print|println)$'
          msg: "use logger instead of fmt.Print"
        - pattern: 'log\.Fatal'
          msg: "do not use log.Fatal in library code"
        - pattern: 'panic\('
          msg: "avoid panics"
        - pattern: 'fmt\.Sprintf'
          pkg: "^ad-event-processor/(internal/(ingestion|domain|rtb)|cmd/tracker|pkg/broker)(/|$)"
          msg: "fmt.Sprintf is forbidden on the hot path (allocates)"
        - pattern: 'context\.(WithTimeout|WithCancel|WithValue)'
          pkg: "^ad-event-processor/(internal/(ingestion|domain|rtb)|cmd/tracker|pkg/broker)(/|$)"
          msg: "context manipulation is forbidden on the hot path"
        - pattern: 'defer\s'
          pkg: "^ad-event-processor/(internal/(ingestion|domain|rtb)|cmd/tracker|pkg/broker)(/|$)"
          msg: "defer is forbidden on the hot path (allocates in old Go, discouraged in ad-event-processor)"
  exclusions:
    generated: lax
    rules:
      - path: '_test\.go'
        linters:
          - errcheck
          - revive
          - noctx
          - contextcheck
          - forbidigo
      - path: "(/|^)(.*/)?pb/"
        linters:
          - errcheck
      - path: internal/controlplane/outboxpb/
        linters:
          - staticcheck
      - path: "(/|^)(.*/)?db/"
        linters:
          - errcheck
      - path: "cmd/admin/"
        linters:
          - forbidigo
      - path: "internal/installer/"
        linters:
          - forbidigo
      - path: "internal/ingestion/"
        linters:
          - errcheck
          - gocritic
          - noctx
          - bodyclose
          - contextcheck
          - errorlint
          - forbidigo
      - path: "internal/domain/"
        linters:
          - errcheck
          - gocritic
          - noctx
          - bodyclose
          - contextcheck
          - errorlint
          - forbidigo
      - path: "internal/rtb/"
        linters:
          - errcheck
          - gocritic
          - noctx
          - bodyclose
          - contextcheck
          - errorlint
          - forbidigo
      - path: "cmd/tracker/"
        linters:
          - errcheck
          - gocritic
          - noctx
          - bodyclose
          - contextcheck
          - errorlint
          - forbidigo
      - path: "pkg/broker/"
        linters:
          - errcheck
          - gocritic
          - noctx
          - bodyclose
          - contextcheck
          - errorlint
          - forbidigo
      - path: 'cmd/.+/main\.go'
        linters:
          - gocritic
        text: "exitAfterDefer"
