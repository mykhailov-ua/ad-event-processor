<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ad-event-processor Admin</title>
    <script>
      (function () {
        try {
          if (localStorage.getItem('aed-admin-theme-dark-default-v3') !== '1') {
            localStorage.setItem('aed-admin-theme', 'dark');
            localStorage.setItem('aed-admin-theme-dark-default-v3', '1');
          }
          var theme = localStorage.getItem('aed-admin-theme');
          document.documentElement.classList.add(theme === 'light' ? 'light' : 'dark');
        } catch (e) {
          document.documentElement.classList.add('dark');
        }
      })();
    </script>
      <link rel="stylesheet" href="/src/styles/app.css?v=1788859144410" />
  </head>
  <body>
    <div id="root"></div>
      <script type="module" src="/src/main.js?v=1788859144410"></script>
  </body>
</html>
