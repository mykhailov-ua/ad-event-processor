syntax = "proto3";

package ads.v1;

option go_package = "ad-event-processor/internal/ingestion/pb;pb";

message AdEvent {
  bytes campaign_id = 1;
  bytes event_type = 2;
  EventMetadata metadata = 3;
}

message EventMetadata {
  bytes click_id = 1;
  bytes user_id = 2;
  bytes device_type = 3;
  bytes os = 4;
  repeated bytes extra_keys = 5;
  repeated bytes extra_values = 7;
  bytes extra_bytes = 6;
}

message TrackResponse {
  string request_id = 1;
  string status = 2;
  string landing_url = 3;
}

message AdStreamEvent {
  bytes click_id = 1;
  bytes campaign_id = 2;
  bytes event_type = 3;
  bytes payload = 4;
  bytes ip = 5;
  bytes ua = 6;
  int64 created_at_unix = 7;
  uint32 fraud_score = 8;
  bytes fraud_reason = 9;
  bool silent_reject_event = 10;
  bytes user_id = 11;
}

message AdDLQEvent {
  AdStreamEvent original_event = 1;
  bytes error = 2;
  bytes original_id = 3;
  int64 failed_at_unix = 4;
  bytes worker_id = 5;
  int32 retry_count = 6;
}

message AdLogRecord {
  int64 timestamp_unix = 1;
  bytes campaign_id = 2;
  bytes click_id = 3;
  bytes event_type = 4;
  uint32 priority = 5;
}

message BudgetDelta {
  bytes campaign_id = 1;
  int64 amount_micro = 2;
  int64 created_at_unix_nano = 3;
  bytes tracker_id = 4;
}
