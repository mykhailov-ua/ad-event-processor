BillingInvoiceLine:
  type: object
  properties:
    ledger_type:
      type: string
    amount_micro:
      type: integer
      format: int64
    entry_count:
      type: integer
      format: int32

Invoice:
  type: object
  required: [id, customer_id, billing_month, subtotal_micro, tax_micro, total_micro, currency]
  properties:
    id:
      type: string
      format: uuid
    customer_id:
      type: string
      format: uuid
    billing_month:
      type: string
      description: YYYY-MM billing period.
    subtotal_micro:
      type: integer
      format: int64
    tax_micro:
      type: integer
      format: int64
    total_micro:
      type: integer
      format: int64
    currency:
      type: string
    tax_scheme:
      type: string
    tax_rate_bps:
      type: integer
      format: int32
    lines:
      type: array
      items:
        $ref: '#/BillingInvoiceLine'
    pdf_url:
      type: string
    status:
      type: string
      description: Present on admin fleet list rows; omitted on full invoice GET.

InvoiceSummary:
  type: object
  properties:
    id:
      type: string
      format: uuid
    customer_id:
      type: string
      format: uuid
    billing_month:
      type: string
    subtotal_micro:
      type: integer
      format: int64
    tax_micro:
      type: integer
      format: int64
    total_micro:
      type: integer
      format: int64
    status:
      type: string
    currency:
      type: string

InvoiceListResponse:
  type: object
  required: [items, total]
  properties:
    items:
      type: array
      items:
        $ref: '#/Invoice'
    total:
      type: integer
      format: int64
    limit:
      type: integer
      format: int32
    offset:
      type: integer
      format: int32

SelfServeInvoiceListResponse:
  type: object
  required: [invoices, total]
  properties:
    invoices:
      type: array
      items:
        $ref: '#/Invoice'
    total:
      type: integer
      format: int64

PreviewInvoiceRequest:
  type: object
  required: [customer_id, billing_month]
  properties:
    customer_id:
      type: string
      format: uuid
    billing_month:
      type: string
      description: YYYY-MM

InvoicePreview:
  type: object
  properties:
    customer_id:
      type: string
      format: uuid
    billing_month:
      type: string
    currency:
      type: string
    subtotal_micro:
      type: integer
      format: int64
    tax_micro:
      type: integer
      format: int64
    total_micro:
      type: integer
      format: int64
    tax_scheme:
      type: string
    tax_rate_bps:
      type: integer
      format: int32
    lines:
      type: array
      items:
        $ref: '#/BillingInvoiceLine'
    would_skip:
      type: boolean
    ledger_sum_micro:
      type: integer
      format: int64

PeriodBounds:
  type: object
  properties:
    from:
      type: string
      format: date-time
    to:
      type: string
      format: date-time

TaxBreakdown:
  type: object
  properties:
    scheme:
      type: string
    rate_bps:
      type: integer
      format: int32
    tax_micro:
      type: integer
      format: int64

Reconciliation:
  type: object
  properties:
    invoice_total_micro:
      type: integer
      format: int64
    ledger_sum_micro:
      type: integer
      format: int64
    delta_micro:
      type: integer
      format: int64

PaymentSummary:
  type: object
  properties:
    ledger_id:
      type: integer
      format: int64
    amount_micro:
      type: integer
      format: int64
    payment_intent_id:
      type: string
    created_at:
      type: string
      format: date-time

BillingStatement:
  type: object
  properties:
    customer_id:
      type: string
      format: uuid
    period:
      $ref: '#/PeriodBounds'
    opening_balance_micro:
      type: integer
      format: int64
    closing_balance_micro:
      type: integer
      format: int64
    lines:
      type: array
      items:
        $ref: '#/BillingInvoiceLine'
    invoices:
      type: array
      items:
        $ref: '#/InvoiceSummary'
    payments:
      type: array
      items:
        $ref: '#/PaymentSummary'
    tax_breakdown:
      $ref: '#/TaxBreakdown'
    reconciliation:
      $ref: '#/Reconciliation'
    currency:
      type: string

CHHourlyPoint:
  type: object
  properties:
    hour:
      type: string
    impressions:
      type: integer
      format: int64

BillingForecast:
  type: object
  properties:
    customer_id:
      type: string
      format: uuid
    month:
      type: string
    ledger_mtd_micro:
      type: integer
      format: int64
    ledger_run_rate_micro_per_day:
      type: integer
      format: int64
    ch_hourly_impressions:
      type: array
      items:
        $ref: '#/CHHourlyPoint'
    projected_month_end_micro:
      type: integer
      format: int64
    days_remaining:
      type: integer
    low_confidence:
      type: boolean
    ch_unavailable:
      type: boolean

Wallet:
  type: object
  properties:
    customer_id:
      type: string
      format: uuid
    balance_micro:
      type: integer
      format: int64
    currency:
      type: string
    allowed_overdraft_micro:
      type: integer
      format: int64
    low_balance_threshold_micro:
      type: integer
      format: int64
    burn_days_estimate:
      type: integer
    last_invoice_at:
      type: string
      format: date-time
    payment_provider:
      type: string
    payment_provider_configured:
      type: boolean

BillingInvariant:
  type: object
  required: [ok]
  properties:
    ok:
      type: boolean
    customer_id:
      type: string
      format: uuid
    balance_micro:
      type: integer
      format: int64
    ledger_sum_micro:
      type: integer
      format: int64
    diff_micro:
      type: integer
      format: int64
    fleet_scan_limit:
      type: integer

BillingSummary:
  type: object
  properties:
    invoiced_mtd_micro:
      type: integer
      format: int64
    invoice_count_mtd:
      type: integer
      format: int64
    undelivered_invoice_notifications:
      type: integer
      format: int64
    customers_with_spend_in_month:
      type: integer
      format: int64

InvoiceDelivery:
  type: object
  required: [id, status, provider, recipient, template_id, retry_count, created_at, updated_at]
  properties:
    id:
      type: string
    status:
      type: string
    provider:
      type: string
    recipient:
      type: string
    template_id:
      type: string
    error_message:
      type: string
    retry_count:
      type: integer
      format: int32
    created_at:
      type: string
      format: date-time
    updated_at:
      type: string
      format: date-time

InvoiceDeliveryListResponse:
  type: object
  properties:
    items:
      type: array
      items:
        $ref: '#/InvoiceDelivery'

BillingExportJobSpec:
  type: object
  required: [customer_id, from, to]
  properties:
    customer_id:
      type: string
      format: uuid
    from:
      type: string
      description: RFC3339 or YYYY-MM-DD period start.
    to:
      type: string
    format:
      type: string
      enum: [csv, ndjson]
      default: csv

BillingExportJob:
  type: object
  required: [id, customer_id, format, status, created_at]
  properties:
    id:
      type: string
      format: uuid
    customer_id:
      type: string
      format: uuid
    format:
      type: string
    status:
      type: string
      enum: [PENDING, RUNNING, COMPLETED, FAILED]
    bytes:
      type: integer
      format: int64
    download_url:
      type: string
    error:
      type: string
    created_at:
      type: string
      format: date-time
    completed_at:
      type: string
      format: date-time

BillingExportJobCreatedResponse:
  type: object
  required: [job_id]
  properties:
    job_id:
      type: string
      format: uuid

BillingLedgerLine:
  type: object
  properties:
    id:
      type: integer
      format: int64
    amount_micro:
      type: integer
      format: int64
    ledger_type:
      type: string
    created_at:
      type: string
      format: date-time

InvoiceLedgerLinesResponse:
  type: object
  properties:
    items:
      type: array
      items:
        $ref: '#/BillingLedgerLine'
    total:
      type: integer
      format: int64
    next_cursor:
      type: string
    limit:
      type: integer
      format: int32

BalanceLedgerEntry:
  type: object
  properties:
    id:
      type: integer
      format: int64
    customer_id:
      type: string
      format: uuid
    campaign_id:
      type: string
      format: uuid
    amount:
      type: string
    type:
      type: string
    idempotency_hash:
      type: string
    created_at:
      type: string
      format: date-time

CustomerBalance:
  type: object
  properties:
    customer_id:
      type: string
      format: uuid
    balance:
      type: string
    currency:
      type: string
    ledger:
      type: array
      items:
        $ref: '#/BalanceLedgerEntry'

CustomerLedgerListResponse:
  type: object
  properties:
    items:
      type: array
      items:
        $ref: '#/BalanceLedgerEntry'
    total:
      type: integer
      format: int64
    limit:
      type: integer
      format: int32
    offset:
      type: integer
      format: int32

TaxProfile:
  type: object
  properties:
    customer_id:
      type: string
      format: uuid
    country_code:
      type: string
    tax_region:
      type: string
    tax_scheme:
      type: string
    tax_rate_bps:
      type: integer
      format: int32

PaymentHistoryRow:
  type: object
  properties:
    intent_id:
      type: string
    customer_id:
      type: string
      format: uuid
    amount_micro:
      type: integer
      format: int64
    currency:
      type: string
    status:
      type: string
    provider:
      type: string
    provider_ref:
      type: string
    idempotency_key:
      type: string
    ledger_entry_id:
      type: string
    created_at:
      type: string
      format: date-time
    updated_at:
      type: string
      format: date-time

PaymentHistoryListResponse:
  type: object
  properties:
    items:
      type: array
      items:
        $ref: '#/PaymentHistoryRow'
    total:
      type: integer
      format: int64
    limit:
      type: integer
      format: int32
    offset:
      type: integer
      format: int32

SelfServeCampaignTemplate:
  type: object
  required: [id, customer_id, name, budget_limit]
  properties:
    id:
      type: string
      format: uuid
    customer_id:
      type: string
      format: uuid
    name:
      type: string
    budget_limit:
      type: string
    pacing_mode:
      type: string
    daily_budget:
      type: string
    timezone:
      type: string
    freq_limit:
      type: integer
      format: int32
    freq_window:
      type: integer
      format: int32
    target_countries:
      type: array
      items:
        type: string
    brand_id:
      type: string
      format: uuid
    daypart_hours:
      type: array
      items:
        type: integer
        format: int32
    created_at:
      type: string
      format: date-time
    updated_at:
      type: string
      format: date-time

SelfServeTemplateListResponse:
  type: object
  properties:
    items:
      type: array
      items:
        $ref: '#/SelfServeCampaignTemplate'
    total:
      type: integer
      format: int64

SelfServeCreateCampaignRequest:
  type: object
  required: [template_id]
  properties:
    customer_id:
      type: string
      format: uuid
    template_id:
      type: string
      format: uuid
    name:
      type: string
    budget_limit_micro:
      type: integer
      format: int64

SelfServePauseCampaignRequest:
  type: object
  properties:
    reason:
      type: string

CreatePaymentIntentRequest:
  type: object
  required: [amount_micro]
  properties:
    customer_id:
      type: string
      format: uuid
    amount_micro:
      type: integer
      format: int64
    currency:
      type: string
      default: USD

PaymentIntentCreatedResponse:
  type: object
  required: [intent_id, status, checkout_url]
  properties:
    intent_id:
      type: string
    status:
      type: string
    checkout_url:
      type: string
    provider_ref:
      type: string
    deposit_address:
      type: string
      description: Crypto deposit address when provider is on-chain; not a stored API key.
    deposit_network:
      type: string
    deposit_qr_svg:
      type: string

CreateAPIKeyRequest:
  type: object
  required: [name]
  properties:
    name:
      type: string

APIKeyCreatedResponse:
  type: object
  required: [id, name, raw_key]
  properties:
    id:
      type: string
    name:
      type: string
    raw_key:
      type: string
      description: Returned once at creation only; list endpoints never echo secrets.
    expires_at:
      type: string
      format: date-time
