PatchCampaignRequest:
  type: object
  description: |
    Partial update (PATCH /api/v1/campaigns/{id}). Only keys present in the JSON body are applied;
    omitted keys leave stored values unchanged. Empty string arrays replace target_countries or
    daypart_hours when those keys are sent. Budget accepts budget_limit (decimal string) or
    budget_limit_micro (integer). flow_id, brand_id, ingress_cost_config, traffic_template_id,
    and click_query_params run dedicated assign/patch handlers when present.
  properties:
    name:
      type: string
    status:
      type: string
    budget_limit:
      type: string
    budget_limit_micro:
      type: integer
      format: int64
    pacing_mode:
      type: string
    daily_budget_micro:
      type: integer
      format: int64
    timezone:
      type: string
    freq_limit:
      type: integer
      format: int32
    freq_window:
      type: integer
      format: int32
    target_countries:
      type: array
      items:
        type: string
    target_url:
      type: string
    safe_page_url:
      type: string
    safe_page_enabled:
      type: boolean
    dmr_enabled:
      type: boolean
    cidr_block_enabled:
      type: boolean
    proxy_vpn_block_enabled:
      type: boolean
    moderator_intel_enabled:
      type: boolean
    review_traffic_action:
      type: string
    tls_fingerprint_block_enabled:
      type: boolean
    conn_type_policy:
      type: string
    link_signing_enabled:
      type: boolean
    link_signing_ttl_sec:
      type: integer
      format: int32
    attestation_enabled:
      type: boolean
    attestation_mode:
      type: string
    attestation_ttl_sec:
      type: integer
      format: int32
    referrer_filter:
      type: string
    click_delivery:
      type: string
    proxy_upstream_url:
      type: string
    proxy_rewrite_assets:
      type: boolean
    start_at:
      type: string
      format: date-time
    end_at:
      type: string
      format: date-time
    daypart_hours:
      type: array
      items:
        type: integer
        format: int32
    flow_id:
      type: string
      format: uuid
    brand_id:
      type: string
      format: uuid
    ingress_cost_config:
      $ref: '#/IngressCostConfig'
    traffic_template_id:
