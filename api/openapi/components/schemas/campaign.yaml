IngressCostConfig:
  type: object
  required: [param]
  description: |
    Ingress macro cost parsing for /click query params. Stored on campaign row;
    attributed to ClickHouse clicks.attributed_cost_micro with cost_source=ingress_macro.
    See docs/INTEGRATIONS.md ingress macro section.
  properties:
    param:
      type: string
      description: Query param name (cost, cpc, bid, or custom).
    scale:
      type: string
      description: decimal (USD float) or micro (integer micro-units).
    max_micro:
      type: integer
      format: int64
      description: Reject or cap parsed cost above this micro amount when policy requires.
    policy:
      type: string
      description: Invalid or over-cap handling (ignore, etc.).

