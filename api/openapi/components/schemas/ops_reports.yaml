ReportJobSpec:
  type: object
  required: [customer_id, report_key, from, to]
  properties:
    customer_id:
      type: string
      format: uuid
    report_key:
      type: string
    from:
      type: string
      format: date-time
    to:
      type: string
      format: date-time
    format:
      type: string
      enum: [csv, json, zip, xlsx]
    destination:
      type: string
      enum: [download, google_sheet]
      default: download
    google_sheet:
      $ref: '#/ReportJobGoogleSheetSpec'
    row_limit:
      type: integer
      minimum: 1
      maximum: 5000000
      description: Max data rows in the export file. Server clamps to deployment tier (hard cap 5M).
    import_payload:
      type: object
      additionalProperties: true
      description: Report-specific export parameters (campaign-toggle-cohort, layer-desync-drilldown, etc.).
    compare_from:
      type: string
      format: date-time
      description: Optional comparison period start; requires compare_to.
    compare_to:
      type: string
      format: date-time
      description: Optional comparison period end; requires compare_from.
    notify:
      $ref: '#/ReportJobNotifySpec'

ReportJobNotifySpec:
  type: object
  properties:
    channel:
      type: string
      enum: [none, in_app, email, slack_webhook]
      default: none
    email:
      type: string
      format: email
      description: Required when channel is email.
    webhook_url:
      type: string
      format: uri
      description: Required when channel is slack_webhook.

ReportExportNotification:
  type: object
  properties:
