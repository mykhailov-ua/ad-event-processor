DataSourceFreshness:
  type: object
  properties:
    name:
      type: string
    consistency:
      type: string
    stale:
      type: boolean
    ch_lag_seconds:
      type: integer
      format: int32

DataFreshness:
  type: object
  required: [as_of, consistency, stale]
  properties:
    as_of:
      type: string
      format: date-time
    as_of_display:
      type: string
    consistency:
      type: string
      description: eventual or strong
    stale:
      type: boolean
      description: true when ClickHouse lag exceeds operator SLA window
    ch_lag_seconds:
      type: integer
      format: int32
    sources:
      type: array
      items:
        $ref: '#/DataSourceFreshness'

