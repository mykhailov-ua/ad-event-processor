TrackBehaviorTelemetryEvent:
  type: object
  required: [t, ts, x, y]
  properties:
    t:
      type: string
      description: Event kind (mousemove, pointerdown, click, keydown, visibilitychange, touchstart, scroll)
    ts:
      type: integer
      format: int64
      description: Monotonic offset from page load in microseconds (performance.now based)
    x:
      type: integer
      format: int32
    y:
      type: integer
      format: int32
    z:
      type: integer
      format: int32
      description: Optional third axis (touch force, device motion z)
    fx:
      type: number
      format: float
      description: Subpixel client X where supported
    fy:
      type: number
      format: float
      description: Subpixel client Y where supported
    trusted:
      type: integer
      format: int32
      description: 1 when Event.isTrusted, else 0
    force:
      type: number
      format: float
      description: Touch force where supported (Pointer Events)
    radius_x:
      type: number
      format: float
      description: Touch ellipse radiusX where supported
    radius_y:
      type: number
      format: float
      description: Touch ellipse radiusY where supported

TrackBehaviorTelemetry:
  type: object
  properties:
    events:
      type: array
      maxItems: 64
      items:
        $ref: '#/TrackBehaviorTelemetryEvent'

TrackIngestRequest:
  type: object
  required: [type, campaign_id]
  description: Native JSON body for tracker POST /track (gnet ingress).
  properties:
    type:
      type: string
      description: Event type (click, conversion, impression, ...)
    campaign_id:
      type: string
      format: uuid
    user_id:
      type: string
    click_id:
      type: string
    placement_id:
      type: string
    payload:
      type: object
      additionalProperties: true
    telemetry:
      $ref: '#/TrackBehaviorTelemetry'
