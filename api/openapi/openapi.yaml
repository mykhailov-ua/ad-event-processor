openapi: 3.0.3
info:
  title: ad-event-processor control plane API
  version: 0.6.0
  description: |
    Operator and automation REST on `/api/v1` (`cmd/control`, default `:8188`).
    Documented domains: cost-sync, integrations, campaigns, billing, reports, ops,
    fraud admin, dashboards, and saved views. All `/api/v1` catalog routes are hand-documented or explicitly allowlisted.
    New endpoints must land in OpenAPI before handler code (`deploy/vendor/openapi_backlog.md`).
servers:
  - url: http://localhost:8188
    description: Local control plane
tags:
  - name: cost-sync
    description: Ad network spend import credentials and manual runs
  - name: postbacks
    description: Outbound CAPI and webhook configs
  - name: integration
    description: Custom schemas and bundled templates
  - name: supply
    description: sellers.json and ads.txt export
  - name: margin-guard
    description: ROI margin policies and placement overrides
  - name: smart-alerts
    description: Metric threshold alerts to webhooks
  - name: platform-campaigns
    description: External ad platform link and mutation API (Enterprise SKU)
  - name: campaigns
    description: Campaign CRUD, fraud, stats, clone, and owner assignment
  - name: flows
    description: Flow builder paths, offers, and lander routing
  - name: landers
    description: Lander CRUD and hosted ZIP editor
  - name: brands
    description: Advertiser brands and weighted creatives
  - name: domains
    description: Tracking domain health and TLS setup
  - name: billing
    description: Invoices, ledger, exports, tax profile, and wallet
  - name: selfserve
    description: Bearer-authenticated buyer API for templates, campaigns, and top-ups
  - name: reports
    description: ClickHouse-backed analytics reports with freshness metadata
  - name: ops
    description: Operator health, DLQ, outbox, blacklist, and ML model status
  - name: fraud-admin
    description: Fraud labels, decisions, presets, and integration status
  - name: dashboards
    description: Role-specific KPI dashboards (buyer, CFO, fraud, operator)
  - name: views
    description: Saved report filter views per customer
  - name: telegram
    description: Telegram Mini App, bots, webhooks, and analytics reports
  - name: audit
    description: Admin audit log and CSV export
  - name: customers
    description: Customer directory (admin)
  - name: disputes
    description: Payment dispute and chargeback rows
  - name: eula
    description: End-user license acceptance
  - name: license
    description: JWT license status and apply
  - name: meta
    description: Product metadata and bootstrap flags
  - name: consent
    description: Signed consent records
  - name: recon
    description: Ledger reconciliation run history
  - name: report-schedules
    description: Scheduled report delivery cron jobs
  - name: settings
    description: Platform install configuration
  - name: support
    description: Operator feedback to vendor
  - name: team
    description: Team members and budget approvals
  - name: publisher
    description: Scoped publisher dashboard and statements
  - name: rtb
    description: OpenRTB deals, shadow diff, and floor optimizer
