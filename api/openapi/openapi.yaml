      in: query
      required: false
      schema:
        type: string
        description: YYYY-MM calendar month.

    ReportFromQuery:
      name: from
      in: query
      required: false
      schema:
        type: string
        format: date-time
      description: Range start (RFC3339). Default is now minus 7 days.
    ReportToQuery:
      name: to
      in: query
      required: false
      schema:
        type: string
        format: date-time
      description: Range end (RFC3339). Default is now UTC.
    ReportCompareQuery:
      name: compare
      in: query
      required: false
      schema:
        type: string
        enum: [previous, '1', 'true']
      description: When set, attaches prior-period deltas on each row (compare_period=true alias).
    CursorQuery:
      name: cursor
      in: query
      required: false
      schema:
        type: string
