  securitySchemes:
    SessionCookie:
      type: apiKey
      in: cookie
      name: session
      description: Admin UI session cookie
    BearerApiKey:
      type: http
      scheme: bearer
      description: |
        Self-serve API key for /api/v1/selfserve/* (Authorization Bearer header).
        Mint keys via POST /api/v1/selfserve/api-keys with an admin session cookie.
        raw_key is returned once at creation and is not echoed on list routes.
security:
  - SessionCookie: []
