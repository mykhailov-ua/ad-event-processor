paths:
  /api/v1/campaigns:
    get:
      tags: [campaigns]
      operationId: campaignsList
      summary: List campaigns
      description: Paginated campaign list filtered by customer_id and optional status.
      x-permissions: [campaigns:read, campaigns:read:masked]
      parameters:
        - $ref: '../openapi.yaml#/components/parameters/CustomerIdQuery'
        - name: status
          in: query
          required: false
          schema:
            type: string
        - name: q
          in: query
          required: false
          schema:
            type: string
        - name: sort
          in: query
          required: false
          schema:
            type: string
            enum: [name, updated_at, spend, budget_limit, status, tags, group, flow, owner, countries, budget_pct, clicks, impressions, conversions, unique_clicks, blocks, cost, revenue, profit, roi, ctr, cr, cpc, cpa, ecpa, epc, cpm, block_pct, leads, approved, hold_leads, rejected_leads, approve_rate, lp_clicks, lp_views, lp_ctr, bots, bot_pct]
        - name: order
          in: query
          required: false
          schema:
            type: string
            enum: [asc, desc]
        - $ref: '../openapi.yaml#/components/parameters/ReportFromQuery'
        - $ref: '../openapi.yaml#/components/parameters/ReportToQuery'
        - name: pacing_mode
          in: query
          required: false
          schema:
            type: string
        - name: budget_min_micro
          in: query
          required: false
          schema:
            type: integer
            format: int64
            minimum: 0
        - name: budget_max_micro
          in: query
          required: false
          schema:
            type: integer
            format: int64
            minimum: 0
        - name: owner_user_id
          in: query
          required: false
          schema:
            type: string
            format: uuid
        - name: country
          in: query
          required: false
          schema:
            type: string
            minLength: 2
            maxLength: 2
        - $ref: '../openapi.yaml#/components/parameters/LimitQuery'
        - $ref: '../openapi.yaml#/components/parameters/OffsetQuery'
      responses:
        '200':
          description: Campaign page
          content:
            application/json:
              schema:
                $ref: '../components/schemas/campaign.yaml#/CampaignListResponse'
        default:
          $ref: '../openapi.yaml#/components/responses/Error'

  /api/v1/campaigns/metrics:
    get:
      tags: [campaigns]
      operationId: campaignsListMetrics
      summary: Batch campaign list metrics
      description: Returns impressions, clicks, conversions, unique clicks, margin window, and blocks for up to 100 campaigns in one request.
      x-permissions: [campaigns:read, campaigns:read:masked]
      parameters:
        - name: ids
          in: query
          required: true
          schema:
            type: string
          description: Comma-separated campaign UUIDs (max 100).
        - $ref: '../openapi.yaml#/components/parameters/ReportFromQuery'
        - $ref: '../openapi.yaml#/components/parameters/ReportToQuery'
      responses:
        '200':
          description: Batch metrics keyed by campaign id
          content:
            application/json:
              schema:
                $ref: '../components/schemas/campaign.yaml#/CampaignListMetricsBatchResponse'
        default:
          $ref: '../openapi.yaml#/components/responses/Error'

  /api/v1/campaigns/target-countries:
    get:
      tags: [campaigns]
      operationId: campaignsListTargetCountries
      summary: List distinct campaign target countries
      description: Returns ISO country codes used in campaign target_countries for the scoped customer.
      x-permissions: [campaigns:read, campaigns:read:masked]
      parameters:
        - $ref: '../openapi.yaml#/components/parameters/CustomerIdQuery'
      responses:
        '200':
          description: Distinct target country codes
          content:
            application/json:
              schema:
                type: object
                required: [countries]
                properties:
                  countries:
                    type: array
                    items:
                      type: string
        default:
          $ref: '../openapi.yaml#/components/responses/Error'

  /api/v1/campaigns/{id}:
    get:
      tags: [campaigns]
      operationId: campaignsGet
      summary: Get campaign by id
      description: Returns full campaign DTO including optional ingress_cost_config.
      x-permissions: [campaigns:read, campaigns:read:masked]
      parameters:
        - $ref: '../openapi.yaml#/components/parameters/UuidPathId'
      responses:
        '200':
          description: Campaign
          content:
            application/json:
              schema:
                $ref: '../components/schemas/campaign.yaml#/Campaign'
        default:
          $ref: '../openapi.yaml#/components/responses/Error'
    patch:
      tags: [campaigns]
      operationId: campaignsPatch
      summary: Partial campaign update
      description: Merge semantics documented on PatchCampaignRequest schema.
      x-permissions: [campaigns:write]
      parameters:
        - $ref: '../openapi.yaml#/components/parameters/UuidPathId'
        - in: query
          name: force
          schema:
            type: boolean
            default: false
          description: Admin-only bypass when setting status to ACTIVE
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '../components/schemas/campaign.yaml#/PatchCampaignRequest'
      responses:
        '200':
          description: Updated campaign
          content:
            application/json:
              schema:
                $ref: '../components/schemas/campaign.yaml#/Campaign'
        '422':
          description: Publish validation failed when activating campaign
          content:
            application/json:
              schema:
                $ref: '../components/schemas/campaign.yaml#/CampaignPublishBlockedError'
        default:
          $ref: '../openapi.yaml#/components/responses/Error'

  /api/v1/campaigns/{id}/owner:
    put:
      tags: [campaigns]
      operationId: campaignsAssignOwner
      summary: Assign campaign owner user
      x-permissions: [campaigns:write]
      parameters:
        - $ref: '../openapi.yaml#/components/parameters/UuidPathId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '../components/schemas/campaign.yaml#/AssignCampaignOwnerRequest'
      responses:
        '200':
          description: Owner assigned
          content:
            application/json:
              schema:
                $ref: '../components/schemas/integrations.yaml#/StatusOKResponse'
        default:
          $ref: '../openapi.yaml#/components/responses/Error'

  /api/v1/campaigns/{id}/clone:
    post:
      tags: [campaigns]
      operationId: campaignsClone
      summary: Clone campaign with flow and postback config
      description: Requires Idempotency-Key header; duplicates budget freeze via ledger.
      x-permissions: [campaigns:write]
      parameters:
        - $ref: '../openapi.yaml#/components/parameters/UuidPathId'
        - name: Idempotency-Key
          in: header
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '../components/schemas/campaign.yaml#/CloneCampaignRequest'
      responses:
        '201':
          description: Cloned campaign
          content:
            application/json:
              schema:
                $ref: '../components/schemas/campaign.yaml#/CloneCampaignResult'
        default:
          $ref: '../openapi.yaml#/components/responses/Error'

  /api/v1/campaigns/{id}/export:
    get:
      tags: [campaigns]
      operationId: campaignsExport
      summary: Export campaign bundle for import elsewhere
      x-permissions: [campaigns:read]
      parameters:
        - $ref: '../openapi.yaml#/components/parameters/UuidPathId'
      responses:
        '200':
          description: Campaign export bundle
          content:
            application/json:
              schema:
                $ref: '../components/schemas/campaign.yaml#/CampaignExportBundle'
        default:
          $ref: '../openapi.yaml#/components/responses/Error'

  /api/v1/campaigns/import:
    post:
      tags: [campaigns]
      operationId: campaignsImport
      summary: Import campaign from export bundle
      description: Requires Idempotency-Key header; body embeds export bundle fields plus customer_id.
      x-permissions: [campaigns:write]
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '../components/schemas/campaign.yaml#/ImportCampaignRequest'
      responses:
        '201':
          description: Imported campaign
          content:
            application/json:
              schema:
                $ref: '../components/schemas/campaign.yaml#/ImportCampaignResult'
        default:
          $ref: '../openapi.yaml#/components/responses/Error'

  /api/v1/campaigns/migrate/sources:
    get:
      tags: [campaigns]
      operationId: campaignsMigrateListSources
      summary: List supported campaign migration source kinds
      x-permissions: [campaigns:read]
      responses:
        '200':
          description: Migration sources
          content:
            application/json:
              schema:
                $ref: '../components/schemas/campaign.yaml#/MigrationSourcesResponse'
        default:
          $ref: '../openapi.yaml#/components/responses/Error'

  /api/v1/campaigns/migrate/preview:
    post:
      tags: [campaigns]
      operationId: campaignsMigratePreview
      summary: Preview external tracker migration payload without importing
      x-permissions: [campaigns:write]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '../components/schemas/campaign.yaml#/MigratePreviewRequest'
      responses:
        '200':
          description: Mapped campaigns preview
          content:
            application/json:
              schema:
                $ref: '../components/schemas/campaign.yaml#/MigrationPreviewResult'
        default:
          $ref: '../openapi.yaml#/components/responses/Error'

  /api/v1/campaigns/import/validate:
    post:
      tags: [campaigns]
      operationId: campaignsImportValidate
      summary: Synchronous migration validation without committing campaigns
      x-permissions: [campaigns:write]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '../components/schemas/campaign.yaml#/MigratePreviewRequest'
      responses:
        '200':
          description: Validation preview
          content:
            application/json:
              schema:
                $ref: '../components/schemas/campaign.yaml#/MigrationPreviewResult'
        default:
          $ref: '../openapi.yaml#/components/responses/Error'

  /api/v1/campaigns/import/validate/jobs:
    post:
      tags: [campaigns]
      operationId: campaignsImportValidateJobCreate
      summary: Enqueue async migration validation job
      x-permissions: [campaigns:write]
      parameters:
        - in: header
          name: Idempotency-Key
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '../components/schemas/campaign.yaml#/ImportValidateJobRequest'
      responses:
        '201':
          description: Validation job accepted
          content:
            application/json:
              schema:
                $ref: '../components/schemas/ops_reports.yaml#/ReportJobStatus'
        default:
          $ref: '../openapi.yaml#/components/responses/Error'

  /api/v1/campaigns/import/validate/jobs/{id}:
    get:
      tags: [campaigns]
      operationId: campaignsImportValidateJobGet
      summary: Read async migration validation job status
      x-permissions: [campaigns:write]
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Validation job status
          content:
            application/json:
              schema:
                $ref: '../components/schemas/ops_reports.yaml#/ReportJobStatus'
        default:
          $ref: '../openapi.yaml#/components/responses/Error'

  /api/v1/campaigns/migrate/pull/preview:
    post:
      tags: [campaigns]
      operationId: campaignsMigratePullPreview
      summary: Pull migration payload from external tracker and preview
      x-permissions: [campaigns:write]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '../components/schemas/campaign.yaml#/MigratePullRequest'
      responses:
        '200':
          description: Mapped campaigns preview
          content:
            application/json:
              schema:
                $ref: '../components/schemas/campaign.yaml#/MigrationPreviewResult'
        default:
          $ref: '../openapi.yaml#/components/responses/Error'

  /api/v1/campaigns/migrate/pull/import:
    post:
      tags: [campaigns]
      operationId: campaignsMigratePullImport
      summary: Pull migration payload from external tracker and import
      x-permissions: [campaigns:write]
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '../components/schemas/campaign.yaml#/MigratePullRequest'
      responses:
        '201':
          description: Migration import result
          content:
            application/json:
              schema:
                $ref: '../components/schemas/campaign.yaml#/ImportMigrationResult'
        default:
          $ref: '../openapi.yaml#/components/responses/Error'

  /api/v1/campaigns/migrate/import:
    post:
      tags: [campaigns]
      operationId: campaignsMigrateImport
      summary: Import campaigns from external tracker migration payload
      description: Requires Idempotency-Key header; batch idempotency key applies to the full migrate request.
      x-permissions: [campaigns:write]
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '../components/schemas/campaign.yaml#/MigrateImportRequest'
      responses:
        '201':
          description: Migration import result
          content:
            application/json:
              schema:
                $ref: '../components/schemas/campaign.yaml#/ImportMigrationResult'
        default:
          $ref: '../openapi.yaml#/components/responses/Error'

  /api/v1/campaigns/{id}/placement-blocks:
    post:
      tags: [campaigns]
      operationId: campaignsBlockPlacement
      summary: Block a placement for a campaign
      x-permissions: [campaigns:write]
      parameters:
        - $ref: '../openapi.yaml#/components/parameters/UuidPathId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '../components/schemas/campaign.yaml#/BlockCampaignPlacementRequest'
      responses:
        '202':
          description: Block accepted
        default:
          $ref: '../openapi.yaml#/components/responses/Error'

  /api/v1/campaigns/{id}/events:
    get:
      tags: [campaigns]
      operationId: campaignsListEvents
      summary: List campaign conversion events
      x-permissions: [campaigns:read]
      parameters:
        - $ref: '../openapi.yaml#/components/parameters/UuidPathId'
        - $ref: '../openapi.yaml#/components/parameters/LimitQuery'
        - $ref: '../openapi.yaml#/components/parameters/OffsetQuery'
      responses:
        '200':
          description: Event page
          content:
            application/json:
              schema:
                $ref: '../components/schemas/campaign.yaml#/CampaignEventListResponse'
        default:
          $ref: '../openapi.yaml#/components/responses/Error'

  /api/v1/campaigns/{id}/margin:
    get:
      tags: [campaigns]
      operationId: campaignsGetMargin
      summary: Campaign margin guard window snapshot
      x-permissions: [campaigns:read]
      parameters:
        - $ref: '../openapi.yaml#/components/parameters/UuidPathId'
      responses:
        '200':
          description: Margin metrics
          content:
            application/json:
              schema:
                $ref: '../components/schemas/campaign.yaml#/CampaignMargin'
        default:
          $ref: '../openapi.yaml#/components/responses/Error'

  /api/v1/campaigns/{id}/integration-health:
    get:
      tags: [campaigns]
      operationId: campaignsGetIntegrationHealth
      summary: Integration readiness checklist for a campaign
      x-permissions: [campaigns:read, campaigns:read:masked]
      parameters:
        - $ref: '../openapi.yaml#/components/parameters/UuidPathId'
      responses:
        '200':
          description: Integration health rows
          content:
            application/json:
              schema:
                $ref: '../components/schemas/campaign.yaml#/CampaignIntegrationHealth'
        default:
          $ref: '../openapi.yaml#/components/responses/Error'

  /api/v1/campaigns/{id}/fraud:
    get:
      tags: [campaigns]
      operationId: campaignsGetFraud
      summary: Get campaign fraud thresholds
      x-permissions: [campaigns:read, campaigns:read:masked]
      parameters:
        - $ref: '../openapi.yaml#/components/parameters/UuidPathId'
      responses:
        '200':
          description: Fraud config
          content:
            application/json:
              schema:
                $ref: '../components/schemas/campaign.yaml#/CampaignFraudConfig'
        default:
          $ref: '../openapi.yaml#/components/responses/Error'
    patch:
      tags: [campaigns]
      operationId: campaignsPatchFraud
      summary: Update campaign fraud thresholds
      x-permissions: [campaigns:write]
      parameters:
        - $ref: '../openapi.yaml#/components/parameters/UuidPathId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '../components/schemas/campaign.yaml#/PatchCampaignFraudRequest'
      responses:
        '200':
          description: Updated fraud config
          content:
            application/json:
              schema:
                $ref: '../components/schemas/campaign.yaml#/CampaignFraudConfig'
        default:
          $ref: '../openapi.yaml#/components/responses/Error'

  /api/v1/campaigns/{id}/fraud/preview:
    post:
      tags: [campaigns]
      operationId: campaignsPreviewFraud
      summary: Preview fraud threshold impact (7d shadow scores)
      x-permissions: [campaigns:read, campaigns:read:masked]
      parameters:
        - $ref: '../openapi.yaml#/components/parameters/UuidPathId'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '../components/schemas/campaign.yaml#/PreviewCampaignFraudRequest'
      responses:
        '200':
          description: Preview estimate
          content:
            application/json:
              schema:
                $ref: '../components/schemas/campaign.yaml#/CampaignFraudPreview'
        default:
          $ref: '../openapi.yaml#/components/responses/Error'

  /api/v1/campaigns/{id}/editor:
    get:
      tags: [campaigns]
      operationId: campaignsEditorShell
      summary: Campaign editor section shell
      x-permissions: [campaigns:read, campaigns:read:masked]
      parameters:
        - $ref: '../openapi.yaml#/components/parameters/UuidPathId'
      responses:
        '200':
          description: Editor shell
          content:
            application/json:
              schema:
                $ref: '../components/schemas/campaign.yaml#/CampaignEditorShell'
        default:
          $ref: '../openapi.yaml#/components/responses/Error'

  /api/v1/campaigns/{id}/validate:
    post:
      tags: [campaigns]
      operationId: campaignsValidatePatch
      summary: Dry-run campaign patch validation
      x-permissions: [campaigns:write]
      parameters:
        - $ref: '../openapi.yaml#/components/parameters/UuidPathId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '../components/schemas/campaign.yaml#/PatchCampaignRequest'
      responses:
        '200':
          description: Validation result
          content:
            application/json:
              schema:
                $ref: '../components/schemas/campaign.yaml#/CampaignValidateResponse'
        default:
          $ref: '../openapi.yaml#/components/responses/Error'

  /api/v1/campaigns/{id}/publish:
    post:
      tags: [campaigns]
      operationId: campaignsPublish
      summary: Validate and activate a paused campaign
      x-permissions: [campaigns:write]
      parameters:
        - $ref: '../openapi.yaml#/components/parameters/UuidPathId'
        - in: query
          name: force
          schema:
            type: boolean
            default: false
          description: Admin-only bypass of publish validation gate
      responses:
        '200':
          description: Campaign published
          content:
            application/json:
              schema:
                $ref: '../components/schemas/campaign.yaml#/Campaign'
        '422':
          description: Publish validation failed
          content:
            application/json:
              schema:
                $ref: '../components/schemas/campaign.yaml#/CampaignPublishBlockedError'
        default:
          $ref: '../openapi.yaml#/components/responses/Error'

  /api/v1/campaigns/{id}/publish-check:
    get:
      tags: [campaigns]
      operationId: campaignsPublishCheck
      summary: Evaluate publish gate without changing status
      x-permissions: [campaigns:write]
      parameters:
        - $ref: '../openapi.yaml#/components/parameters/UuidPathId'
      responses:
        '200':
          description: Publish gate evaluation
          content:
            application/json:
              schema:
                $ref: '../components/schemas/campaign.yaml#/CampaignPublishCheck'
        default:
          $ref: '../openapi.yaml#/components/responses/Error'

  /api/v1/campaigns/{id}/smoke:
    post:
      tags: [campaigns]
      operationId: campaignsSmoke
      summary: Synthetic click smoke test for campaign redirect chain
      x-permissions: [campaigns:write]
      parameters:
        - $ref: '../openapi.yaml#/components/parameters/UuidPathId'
      responses:
        '200':
          description: Smoke check result
          content:
            application/json:
              schema:
                $ref: '../components/schemas/campaign.yaml#/CampaignSmokeResult'
        default:
          $ref: '../openapi.yaml#/components/responses/Error'

  /api/v1/campaigns/onboarding-templates:
    get:
      tags: [campaigns]
      operationId: campaignsOnboardingTemplates
      summary: List bundled campaign onboarding templates
      x-permissions: [campaigns:read, campaigns:read:masked]
      responses:
        '200':
          description: Onboarding templates
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '../components/schemas/campaign.yaml#/CampaignOnboardingTemplate'
        default:
          $ref: '../openapi.yaml#/components/responses/Error'

  /api/v1/campaigns/wizard/session:
    get:
      tags: [campaigns]
      operationId: campaignsWizardSessionGet
      summary: Read onboarding wizard session state
      x-permissions: [campaigns:write]
      parameters:
        - in: query
          name: session_id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Wizard session
          content:
            application/json:
              schema:
                $ref: '../components/schemas/campaign.yaml#/CampaignWizardSession'
        default:
          $ref: '../openapi.yaml#/components/responses/Error'
    post:
      tags: [campaigns]
      operationId: campaignsWizardSessionPost
      summary: Create, update, or commit onboarding wizard session
      x-permissions: [campaigns:write]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '../components/schemas/campaign.yaml#/CampaignWizardSessionRequest'
      responses:
        '200':
          description: Updated session or commit result
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '../components/schemas/campaign.yaml#/CampaignWizardSession'
                  - $ref: '../components/schemas/campaign.yaml#/CampaignWizardCommitResult'
        '201':
          description: Session created
          content:
            application/json:
              schema:
                $ref: '../components/schemas/campaign.yaml#/CampaignWizardSession'
        default:
          $ref: '../openapi.yaml#/components/responses/Error'

  /api/v1/campaigns/{id}/integration-panel:
    get:
      tags: [campaigns]
      operationId: campaignsIntegrationPanel
      summary: Campaign integration health panel
      x-permissions: [campaigns:read, campaigns:read:masked]
      parameters:
        - $ref: '../openapi.yaml#/components/parameters/UuidPathId'
      responses:
        '200':
          description: Integration panel
          content:
            application/json:
              schema:
                $ref: '../components/schemas/campaign.yaml#/CampaignIntegrationPanel'
        default:
          $ref: '../openapi.yaml#/components/responses/Error'

  /api/v1/campaigns/{id}/flow/validate:
    post:
      tags: [campaigns]
      operationId: campaignsFlowValidate
      summary: Validate campaign flow paths
      x-permissions: [campaigns:write]
      parameters:
        - $ref: '../openapi.yaml#/components/parameters/UuidPathId'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                paths:
                  type: array
                  items:
                    type: object
      responses:
        '200':
          description: Flow validation result
          content:
            application/json:
              schema:
                type: object
        default:
          $ref: '../openapi.yaml#/components/responses/Error'

  /api/v1/campaigns/{id}/macro-preview:
    post:
      tags: [campaigns]
      operationId: campaignsMacroPreview
      summary: Preview resolved click URL macros
      x-permissions: [campaigns:read, campaigns:read:masked]
      parameters:
        - $ref: '../openapi.yaml#/components/parameters/UuidPathId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        '200':
          description: Macro preview
          content:
            application/json:
              schema:
                type: object
        default:
          $ref: '../openapi.yaml#/components/responses/Error'

  /api/v1/campaigns/{id}/diff:
    get:
      tags: [campaigns]
      operationId: campaignsDiff
      summary: Compare campaign against another campaign
      x-permissions: [campaigns:read, campaigns:read:masked]
      parameters:
