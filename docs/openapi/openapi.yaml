openapi: 3.0.3
info:
  title: eSPX Management JSON API
  version: 1.0.0
  description: |
    Machine-readable contract for `/api/v1` JSON routes served by `cmd/management`
    (`internal/management` + `internal/adminapi`). HTMX `/admin/*` HTML routes are excluded.
    HTTP 501 stub routes (deferred dashboards/reports) are excluded — see `internal/openapi/stubs.go`.
servers:
  - url: http://127.0.0.1:8188
    description: Local management (default SERVER_PORT)
components:
  securitySchemes:
    AdminAPIKey:
      type: apiKey
      in: header
      name: X-Admin-API-Key
      description: Shared admin API key (`ADMIN_API_KEY`).
    SessionCookie:
      type: apiKey
      in: cookie
      name: accessToken
      description: JWT session cookie set by `POST /api/v1/auth/login`.
    ConsentHMAC:
      type: apiKey
      in: header
      name: X-Consent-Signature
      description: HMAC-SHA256 of raw request body (`CONSENT_HMAC_SECRET`).
  responses:
    Unauthorized:
      description: Unauthorized
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Forbidden:
      description: Forbidden — insufficient permission
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
  schemas:
    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
            message:
              type: string
    GenericObject:
      type: object
      additionalProperties: true
    LedgerEntry:
      type: object
      properties:
        id:
          type: integer
          format: int64
        customer_id:
          type: string
          format: uuid
        campaign_id:
          type: string
          format: uuid
        amount:
          type: string
        type:
          type: string
        idempotency_hash:
          type: string
        created_at:
          type: string
          format: date-time
    CustomerBalance:
      type: object
      required: [customer_id, balance, currency, ledger]
      properties:
        customer_id:
          type: string
          format: uuid
        balance:
          type: string
        currency:
          type: string
        ledger:
          type: array
          items:
            $ref: '#/components/schemas/LedgerEntry'
    CampaignMetrics:
      type: object
      properties:
        impressions:
          type: integer
          format: int64
        clicks:
          type: integer
          format: int64
        conversions:
          type: integer
          format: int64
    CampaignHourlyBucket:
      type: object
      properties:
        hour:
          type: string
        impressions:
          type: integer
          format: int64
        clicks:
          type: integer
          format: int64
        conversions:
          type: integer
          format: int64
    CampaignStats:
      type: object
      required: [campaign_id, current_spend, metrics, hourly, granularity, from, to, stale, consistency]
      properties:
        campaign_id:
          type: string
          format: uuid
        current_spend:
          type: string
        metrics:
          $ref: '#/components/schemas/CampaignMetrics'
        hourly:
          type: array
          items:
            $ref: '#/components/schemas/CampaignHourlyBucket'
        granularity:
          type: string
          enum: [hour]
        from:
          type: string
        to:
          type: string
        stale:
          type: boolean
        consistency:
          type: string
    SpendCurvePoint:
      type: object
      properties:
        hour:
          type: string
        spend_micro:
          type: integer
          format: int64
        impressions:
          type: integer
          format: int64
    ForecastAdvisory:
      type: object
      properties:
        code:
          type: string
        message:
          type: string
        suggested_pacing:
          type: string
    CampaignForecast:
      type: object
      properties:
        impressions_p50:
          type: integer
          format: int64
        impressions_p90:
          type: integer
          format: int64
        spend_curve:
          type: array
          items:
            $ref: '#/components/schemas/SpendCurvePoint'
        low_confidence:
          type: boolean
        advisory:
          $ref: '#/components/schemas/ForecastAdvisory'
    ReportTable:
      type: object
      properties:
        columns:
          type: array
          items:
            type: string
        rows:
          type: array
          items:
            type: object
            additionalProperties: true
    DashboardPayload:
      type: object
      additionalProperties: true
    AuthUser:
      type: object
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
        role:
          type: string
        customer_id:
          type: string
          format: uuid
        permissions:
          type: array
          items:
            type: string
