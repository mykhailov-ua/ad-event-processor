name: BPF Nightly

on:
  schedule:
    - cron: '0 4 * * 2'
  workflow_dispatch:

concurrency:
  group: bpf-nightly
  cancel-in-progress: false

jobs:
  bpf-hot-baseline:
    name: BPF hot gate baseline compare
    runs-on: ${{ vars.PERF_RUNNER_LABEL || 'ubuntu-latest' }}
    timeout-minutes: 45
    env:
      BPF_GATE_STRICT: ${{ vars.PERF_RUNNER_LABEL != '' && 'true' || 'false' }}
      BPF_GATE_COMPARE: '1'
      BPF_GATE_MODE: smoke
      BPF_GATE_DURATION: 90s
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.12'
          cache: true

      - name: Restore BPF hot baseline
        if: env.BPF_GATE_STRICT == 'true'
        uses: actions/cache@v4
        with:
          path: .ci-baselines/bpf/hot
          key: nightly-bpf-hot-${{ github.sha }}
          restore-keys: |
            nightly-bpf-hot-

      - name: Gate mode
        run: |
          if [ "$BPF_GATE_STRICT" = "true" ]; then
            echo "BPF hot nightly: smoke + baseline compare"
          else
            echo "SKIPPED (github-hosted): set PERF_RUNNER_LABEL for BPF nightly"
          fi

      - name: Stabilize CPU
        if: env.BPF_GATE_STRICT == 'true'
        run: bash scripts/perf/stabilize_cpu.sh

      - name: Hot BPF gate and baseline compare
        run: bash scripts/test/bpf_nightly_job.sh hot

      - uses: actions/upload-artifact@v4
        if: always() && env.BPF_GATE_STRICT == 'true'
        with:
          name: bpf-hot-nightly
          path: |
            bpf_hot_nightly.log
            var/bpf-gate/**/*
          retention-days: 14
          if-no-files-found: ignore

      - name: Save BPF hot baseline
        if: env.BPF_GATE_STRICT == 'true'
        uses: actions/cache/save@v4
        with:
          path: .ci-baselines/bpf/hot
          key: nightly-bpf-hot-${{ github.sha }}

  bpf-cold-soak:
    name: BPF cold soak regression
    runs-on: ${{ vars.PERF_RUNNER_LABEL || 'ubuntu-latest' }}
    timeout-minutes: 90
    needs: bpf-hot-baseline
    env:
      BPF_GATE_STRICT: ${{ vars.PERF_RUNNER_LABEL != '' && 'true' || 'false' }}
      BPF_GATE_MODE: business
      BPF_COLD_SOAK_DURATION: 30m
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.12'
          cache: true

      - name: Restore BPF cold baseline
        if: env.BPF_GATE_STRICT == 'true'
        uses: actions/cache@v4
        with:
          path: .ci-baselines/bpf/cold
          key: nightly-bpf-cold-${{ github.sha }}
          restore-keys: |
            nightly-bpf-cold-

      - name: Stabilize CPU
        if: env.BPF_GATE_STRICT == 'true'
        run: bash scripts/perf/stabilize_cpu.sh

      - name: Cold BPF soak and baseline compare
        run: bash scripts/test/bpf_nightly_job.sh cold

      - uses: actions/upload-artifact@v4
        if: always() && env.BPF_GATE_STRICT == 'true'
        with:
          name: bpf-cold-nightly
          path: |
            bpf_cold_nightly.log
            var/bpf-cold-soak/**/*
          retention-days: 14
          if-no-files-found: ignore

      - name: Save BPF cold baseline
        if: env.BPF_GATE_STRICT == 'true'
        uses: actions/cache/save@v4
        with:
          path: .ci-baselines/bpf/cold
          key: nightly-bpf-cold-${{ github.sha }}

  bpf-export-soak:
    name: BPF report export soak
    runs-on: ${{ vars.PERF_RUNNER_LABEL || 'ubuntu-latest' }}
    timeout-minutes: 60
    needs: bpf-hot-baseline
    env:
      BPF_GATE_STRICT: ${{ vars.PERF_RUNNER_LABEL != '' && 'true' || 'false' }}
      BPF_GATE_MODE: report-export-soak
      BPF_COLD_GATE: '1'
      LOAD_BPF_GATE: '1'
      BPF_GATE_PROFILE: lab
      BPF_GATE_DURATION: 5m
      REPORT_EXPORT_SOAK_PARALLEL: '2'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.12'
          cache: true

      - name: Gate mode
        run: |
          if [ "$BPF_GATE_STRICT" = "true" ]; then
            echo "BPF export soak: parallel CSV jobs under LOAD_BPF_GATE=1"
          else
            echo "SKIPPED (github-hosted): set PERF_RUNNER_LABEL for BPF export soak"
          fi

      - name: Stabilize CPU
        if: env.BPF_GATE_STRICT == 'true'
        run: bash scripts/perf/stabilize_cpu.sh

      - name: Report export BPF soak
        run: bash scripts/test/bpf_nightly_job.sh export

      - uses: actions/upload-artifact@v4
        if: always() && env.BPF_GATE_STRICT == 'true'
        with:
          name: bpf-export-soak-nightly
          path: |
            bpf_export_soak_nightly.log
            var/bpf-gate/**/*
          retention-days: 14
          if-no-files-found: ignore
