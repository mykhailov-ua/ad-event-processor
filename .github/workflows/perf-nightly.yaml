name: Perf Nightly

on:
  schedule:
    - cron: '0 3 * * 1'
  workflow_dispatch:

concurrency:
  group: perf-nightly
  cancel-in-progress: false

env:
  GOMAXPROCS: '1'

jobs:
  escape-report:
    name: Escape analysis regression
    runs-on: ${{ vars.PERF_RUNNER_LABEL || 'ubuntu-latest' }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.12'
          cache: true

      - name: Restore escape baseline
        uses: actions/cache@v4
        with:
          path: .ci-baselines/escape
          key: nightly-escape-${{ github.sha }}
          restore-keys: |
            nightly-escape-

      - name: Stabilize CPU
        run: bash scripts/perf/stabilize_cpu.sh

      - name: Escape report and regression gate
        run: |
          mkdir -p .ci-baselines/escape
          bash scripts/perf/escape_nightly_job.sh escape_report.txt .ci-baselines/escape/heap_lines.count

      - uses: actions/upload-artifact@v4
        with:
          name: escape-analysis
          path: escape_report.txt

      - name: Save escape baseline
        uses: actions/cache/save@v4
        with:
          path: .ci-baselines/escape
          key: nightly-escape-${{ github.sha }}

  redis-lua-bench:
    name: UnifiedFilter Redis bench regression
    runs-on: ${{ vars.PERF_RUNNER_LABEL || 'ubuntu-latest' }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.12'
          cache: true

      - name: Restore redis bench baseline
        uses: actions/cache@v4
        with:
          path: .ci-baselines/redis
          key: nightly-redis-${{ github.sha }}
          restore-keys: |
            nightly-redis-

      - name: Stabilize CPU
        run: bash scripts/perf/stabilize_cpu.sh

      - name: Benchmark and regression gate
        run: bash scripts/perf/nightly_bench_job.sh redis

      - uses: actions/upload-artifact@v4
        with:
          name: redis-lua-bench
          path: |
            redis_lua_bench.txt
            redis_lua_gate.txt

      - name: Save redis bench baseline
        uses: actions/cache/save@v4
        with:
          path: .ci-baselines/redis
          key: nightly-redis-${{ github.sha }}

  broker-protocol-bench:
    name: Broker protocol bench regression
    runs-on: ${{ vars.PERF_RUNNER_LABEL || 'ubuntu-latest' }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.12'
          cache: true

      - name: Restore broker bench baseline
        uses: actions/cache@v4
        with:
          path: .ci-baselines/broker
          key: nightly-broker-${{ github.sha }}
          restore-keys: |
            nightly-broker-

      - name: Stabilize CPU
        run: bash scripts/perf/stabilize_cpu.sh

      - name: Benchmark and regression gate
        run: bash scripts/perf/nightly_bench_job.sh broker

      - uses: actions/upload-artifact@v4
        with:
          name: broker-protocol-bench
          path: |
            broker_proto_bench.txt
            broker_proto_gate.txt

      - name: Save broker bench baseline
        uses: actions/cache/save@v4
        with:
          path: .ci-baselines/broker
          key: nightly-broker-${{ github.sha }}

  cache-miss-ab:
    name: Hot path cache-miss A/B (perf stat)
    runs-on: ${{ vars.PERF_RUNNER_LABEL || 'ubuntu-latest' }}
    timeout-minutes: 20
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.12'
          cache: true

      - name: Restore cache-miss baseline
        if: vars.PERF_RUNNER_LABEL != ''
        uses: actions/cache@v4
        with:
          path: .ci-baselines/cache-miss
          key: nightly-cache-miss-${{ github.sha }}
          restore-keys: |
            nightly-cache-miss-

      - name: Stabilize CPU
        if: vars.PERF_RUNNER_LABEL != ''
        run: bash scripts/perf/stabilize_cpu.sh

      - name: perf stat cache-miss gate
        run: bash scripts/perf/cache_miss_nightly_job.sh

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cache-miss-ab
          path: |
            cache_miss_perf_stat.txt
            .ci-baselines/cache-miss/current.txt
          if-no-files-found: ignore

      - name: Save cache-miss baseline
        if: vars.PERF_RUNNER_LABEL != ''
        uses: actions/cache/save@v4
        with:
          path: .ci-baselines/cache-miss
          key: nightly-cache-miss-${{ github.sha }}
