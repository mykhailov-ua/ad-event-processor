name: Sentinel Resilience

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: sentinel-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sentinel-failover:
    name: Redis Sentinel failover resilience
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.12'
          cache: true

      - name: Prepare env
        run: bash scripts/fault/sentinel_failover_env.sh

      - name: Sentinel failover resilience test
        run: bash scripts/test/sentinel.sh 2>&1 | tee sentinel.log

      - name: Upload sentinel log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: sentinel-log
          path: sentinel.log
          retention-days: 7
