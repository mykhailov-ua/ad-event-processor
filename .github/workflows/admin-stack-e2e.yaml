name: Admin stack e2e

on:
  workflow_dispatch:
  schedule:
    - cron: '0 3 * * 1'

concurrency:
  group: admin-stack-e2e
  cancel-in-progress: true

jobs:
  stack-e2e:
    name: Admin stack e2e
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Skip when web/ absent
        id: web
        run: |
          if [[ -f web/scripts/build.mjs ]]; then
            echo "present=1" >> "$GITHUB_OUTPUT"
          else
            echo "present=0" >> "$GITHUB_OUTPUT"
            echo "admin-stack-e2e: skipped (web/ absent; OpenAPI under api/openapi/)"
          fi
      - uses: actions/setup-go@v5
        if: steps.web.outputs.present == '1'
        with:
          go-version: '1.25.12'
          cache: true
      - uses: actions/setup-node@v4
        if: steps.web.outputs.present == '1'
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: web/e2e/package-lock.json
      - name: Run admin stack e2e
        if: steps.web.outputs.present == '1'
        run: bash scripts/test/admin_stack_e2e.sh
