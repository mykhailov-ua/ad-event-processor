name: Release images

on:
  push:
    tags: ['v*']
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Image tag (default: git ref)'
        required: false
        type: string

permissions:
  contents: read
  packages: write

concurrency:
  group: release-images-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Build and push ${{ matrix.profile }} GHCR image
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      matrix:
        include:
          - profile: pilot
            dockerfile: deploy/docker/Dockerfile.pilot
            tag_suffix: ''
            expect_bins: 'control processor tracker'
            forbid_bins: 'fraud-scorer broker region-proxy'
          - profile: pilot-ingest
            dockerfile: deploy/docker/Dockerfile.pilot-ingest
            tag_suffix: -ingest
            expect_bins: 'processor tracker'
            forbid_bins: 'control fraud-scorer broker region-proxy'
    steps:
      - uses: actions/checkout@v4

      - name: Resolve image tag
        id: meta
        run: |
          if [ -n "${{ github.event.inputs.tag }}" ]; then
            TAG="${{ github.event.inputs.tag }}"
          elif [ "${{ github.event_name }}" = "release" ]; then
            TAG="${{ github.event.release.tag_name }}"
          else
            TAG="${GITHUB_REF_NAME}"
          fi
          TAG="${TAG#v}"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "full_tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          echo "image_tag=${GITHUB_REF_NAME}${{ matrix.tag_suffix }}" >> "$GITHUB_OUTPUT"
          echo "image_tag_short=${TAG}${{ matrix.tag_suffix }}" >> "$GITHUB_OUTPUT"

      - name: Compute garble seed (per-tag, vault salt)
        id: garble
        env:
          GARBLE_SEED_SALT: ${{ secrets.GARBLE_SEED_SALT }}
        run: |
          if [ -z "$GARBLE_SEED_SALT" ]; then
            echo "GARBLE_SEED_SALT GitHub secret is required for release builds" >&2
            exit 1
          fi
          SEED=$(printf '%s:%s' "$GARBLE_SEED_SALT" "${{ steps.meta.outputs.full_tag }}" | sha256sum | cut -c1-32)
          echo "seed=${SEED}" >> "$GITHUB_OUTPUT"

      - name: Compute asset seal salt (per-tag, vault salt)
        id: seal
        env:
          ASSET_SEAL_SALT: ${{ secrets.ASSET_SEAL_SALT }}
        run: |
          if [ -z "$ASSET_SEAL_SALT" ]; then
            echo "ASSET_SEAL_SALT GitHub secret is required for release builds" >&2
            exit 1
          fi
          SALT=$(printf '%s:%s' "$ASSET_SEAL_SALT" "${{ steps.meta.outputs.full_tag }}" | sha256sum | cut -c1-64)
          echo "salt=${SALT}" >> "$GITHUB_OUTPUT"

      - name: Asset seal salt smoke
        env:
          ASSET_SEAL_SALT: ${{ steps.seal.outputs.salt }}
        run: bash scripts/ci/license/asset_seal_salt_smoke.sh

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        id: build
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          build-args: |
            GARBLE_SEED=${{ steps.garble.outputs.seed }}
            ASSET_SEAL_SALT=${{ steps.seal.outputs.salt }}
          tags: |
            ghcr.io/${{ github.repository }}:${{ steps.meta.outputs.image_tag }}
            ghcr.io/${{ github.repository }}:${{ steps.meta.outputs.image_tag_short }}
            ghcr.io/${{ github.repository_owner }}/ad-event-processor:${{ steps.meta.outputs.image_tag }}
            ghcr.io/${{ github.repository_owner }}/ad-event-processor:${{ steps.meta.outputs.image_tag_short }}
          cache-from: type=gha,scope=${{ matrix.profile }}
          cache-to: type=gha,mode=max,scope=${{ matrix.profile }}

      - name: Verify image binary surface
        run: |
          IMAGE="ghcr.io/${{ github.repository }}:${{ steps.meta.outputs.image_tag }}"
          CID=$(docker create "$IMAGE")
          FILES=$(docker export "$CID" | tar -t | grep -E '^[^/]+$' | sort)
          docker rm "$CID" >/dev/null
          echo "$FILES"
          for bin in ${{ matrix.expect_bins }}; do
            echo "$FILES" | grep -qx "$bin"
          done
          for bin in ${{ matrix.forbid_bins }}; do
            ! echo "$FILES" | grep -q "$bin"
          done

  release-installer:
    name: Build installer tarball
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: read
    steps:
      - uses: actions/checkout@v4

      - name: Resolve image tag
        id: meta
        run: |
          if [ -n "${{ github.event.inputs.tag }}" ]; then
            FULL_TAG="${{ github.event.inputs.tag }}"
          elif [ "${{ github.event_name }}" = "release" ]; then
            FULL_TAG="${{ github.event.release.tag_name }}"
          else
            FULL_TAG="${GITHUB_REF_NAME}"
          fi
          TAG="${FULL_TAG#v}"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "full_tag=${FULL_TAG}" >> "$GITHUB_OUTPUT"
          echo "image=ghcr.io/${{ github.repository_owner }}/ad-event-processor:${FULL_TAG}" >> "$GITHUB_OUTPUT"

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract garbled binaries from pilot image
        run: |
          docker pull "${{ steps.meta.outputs.image }}"
          bash scripts/install/extract_release_bins.sh "${{ steps.meta.outputs.image }}" "$RUNNER_TEMP/release-bins"

      - name: Build installer tarball
        env:
          AD_EVENT_PROCESSOR_RELEASE_BIN_DIR: ${{ runner.temp }}/release-bins
        run: make release-installer VERSION=${{ steps.meta.outputs.tag }}

      - name: Publish installer assets to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          FULL_TAG="${{ steps.meta.outputs.full_tag }}"
          VERSION="${{ steps.meta.outputs.tag }}"
          TARBALL="dist/ad-event-processor-installer-${VERSION}.tar.gz"
          cp "$TARBALL" dist/ad-event-processor-installer.tar.gz
          if ! gh release view "$FULL_TAG" >/dev/null 2>&1; then
            gh release create "$FULL_TAG" --title "$FULL_TAG" --generate-notes
          fi
          gh release upload "$FULL_TAG" \
            dist/ad-event-processor-installer.tar.gz \
            "dist/ad-event-processor-installer-${VERSION}.tar.gz" \
            --clobber

      - name: Summary
        run: |
          echo "Published pilot images:"
          echo "  ghcr.io/${{ github.repository_owner }}/ad-event-processor:${{ steps.meta.outputs.full_tag }} (tracker, processor, control)"
          echo "  ghcr.io/${{ github.repository_owner }}/ad-event-processor:${{ steps.meta.outputs.full_tag }}-ingest (tracker, processor)"
          echo "Installer tarball:"
          echo "  https://github.com/${{ github.repository }}/releases/download/${{ steps.meta.outputs.full_tag }}/ad-event-processor-installer.tar.gz"
          echo "Docker install (install.env):"
          echo "  AD_EVENT_PROCESSOR_USE_RELEASE_IMAGES=1"
          echo "  AD_EVENT_PROCESSOR_APP_IMAGE=ghcr.io/${{ github.repository_owner }}/ad-event-processor:${{ steps.meta.outputs.full_tag }}"
