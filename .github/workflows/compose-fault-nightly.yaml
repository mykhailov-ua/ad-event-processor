name: Compose fault drill

on:
  schedule:
    - cron: '0 4 * * 1'
  workflow_dispatch:

concurrency:
  group: compose-fault-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compose-fault-all:
    name: Compose fault drill (all)
    runs-on: ${{ vars.PERF_RUNNER_LABEL || 'ubuntu-latest' }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.12'
          cache: true

      - name: Host tune (sysctl backlog)
        run: sudo bash scripts/test/host_tune.sh

      - name: Compose fault drill (all)
        run: bash scripts/fault/compose_fault_drill.sh all 2>&1 | tee compose-fault.log

      - name: Upload drill log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: compose-fault-log
          path: |
            compose-fault.log
            var/fault-drill/
            var/ram-proof/
          retention-days: 14
