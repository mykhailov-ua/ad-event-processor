name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  paths:
    name: Gate - path-filter
    runs-on: ubuntu-latest
    outputs:
      openrtb: ${{ steps.filter.outputs.openrtb }}
      model: ${{ steps.filter.outputs.model }}
      go: ${{ steps.filter.outputs.go }}
      integration: ${{ steps.filter.outputs.integration }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            openrtb:
              - 'internal/openrtb/**'
              - 'internal/ingestion/openrtb*.go'
              - 'scripts/test/openrtb_fuzz_smoke.sh'
            model:
              - 'model/**'
            go:
              - '**/*.go'
              - 'go.mod'
              - 'go.sum'
              - 'api/**'
              - 'internal/**/queries/**'
            integration:
              - '**/*.go'
              - 'go.mod'
              - 'go.sum'
              - 'scripts/**'
              - 'tests/**'
              - 'deploy/**'
              - 'docker-compose*.yaml'
              - 'Dockerfile*'

  merge-lint:
    name: Gate - merge-lint
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.12'
          cache: true
      - name: Lint Go (golangci-lint, full repository)
        env:
          LINT_STRICT: "1"
        run: bash scripts/ci/lint_go_gate.sh all
      - name: Vet Go packages
        run: go vet ./...
      - name: Lint Go (gopls check, warning+)
        run: bash scripts/ci/lint_gopls_gate.sh
      - name: Lint Lua (luacheck + lua-language-server)
        run: bash scripts/ci/lint_lua_gate.sh
      - name: Lint TypeScript/JavaScript (tsc)
        run: bash scripts/ci/lint_ts_gate.sh
      - name: Lint configs (compose + nginx)
        run: bash scripts/ci/lint_configs_gate.sh

  merge-pr-fast:
    name: Gate - merge-pr-fast
    needs: merge-lint
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.12'
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: PR fast checks (alloc, unit -short, admin web; lint in merge-lint)
        env:
          SKIP_LINT: "1"
        run: bash scripts/ci/pr_fast.sh

  merge-race-short:
    name: Gate - merge-race-short
    needs: merge-pr-fast
    if: always() && needs.merge-pr-fast.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.12'
          cache: true
      - name: Race detector (go test -race -short)
        run: bash scripts/ci/race_short.sh 2>&1 | tee race_short.log
      - name: Upload race-short log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: merge-race-short-log
          path: race_short.log
          retention-days: 7

  merge-integration:
    name: Gate - merge-integration
    needs: merge-pr-fast
    if: always() && needs.merge-pr-fast.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.12'
          cache: true
      - name: Integration tests (testcontainers)
        run: bash scripts/ci/integration_test.sh 2>&1 | tee integration_test.log
      - name: Upload integration log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: merge-integration-log
          path: integration_test.log
          retention-days: 7

  merge-govulncheck:
    name: Gate - merge-govulncheck
    needs: merge-pr-fast
    if: always() && needs.merge-pr-fast.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.12'
          cache: true
      - name: govulncheck
        run: bash scripts/ci/govulncheck.sh

  merge-perf-smoke:
    name: Gate - merge-perf-smoke
    needs: merge-pr-fast
    if: always() && needs.merge-pr-fast.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      GOMAXPROCS: '1'
      PERF_GATE_STRICT: 'false'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.12'
          cache: true
      - name: Perf smoke (zero-alloc; benchstat skipped on github-hosted)
        run: bash scripts/ci/perf_smoke.sh 2>&1 | tee perf_smoke.log
      - name: Upload perf smoke log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: merge-perf-smoke-log
          path: perf_smoke.log
          retention-days: 7

  merge-openrtb-fuzz:
    name: Gate - merge-openrtb-fuzz
    needs: [merge-pr-fast, paths]
    if: |
      always() && needs.merge-pr-fast.result == 'success' && (
        github.event_name == 'workflow_dispatch' ||
        needs.paths.outputs.openrtb == 'true'
      )
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.12'
          cache: true
      - name: OpenRTB fuzz smoke (5s per target)
        run: make openrtb-fuzz-smoke

  merge-fraud-model:
    name: Gate - merge-fraud-model
    needs: [merge-pr-fast, paths]
    if: |
      always() && needs.merge-pr-fast.result == 'success' && (
        github.event_name == 'workflow_dispatch' ||
        needs.paths.outputs.model == 'true'
      )
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.12'
          cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install model dependencies
        run: pip install -r model/requirements.txt
      - name: fraudtrain-check (bootstrap + ml-validate)
        run: bash scripts/ci/fraudtrain.sh

  main-full-test:
    name: Gate - main-full-test
    needs: [merge-pr-fast, merge-race-short, paths]
    if: |
      always() &&
      needs.merge-pr-fast.result == 'success' &&
      needs.merge-race-short.result == 'success' &&
      (
        github.event_name == 'workflow_dispatch' ||
        (github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.paths.outputs.integration == 'true')
      )
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.12'
          cache: true
      - name: Full test suite (integration + fault, no -short)
        run: bash scripts/ci/full_test.sh 2>&1 | tee full_test.log
      - name: Upload full-test log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: main-full-test-log
          path: full_test.log
          retention-days: 7

  main-resilience:
    name: Gate - main-resilience
    needs: merge-pr-fast
    if: |
      always() && needs.merge-pr-fast.result == 'success' && (
        github.event_name == 'workflow_dispatch' ||
        (github.event_name == 'push' && github.ref == 'refs/heads/main')
      )
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      RESILIENCE_MIN_PROOFS: '52'
      RESILIENCE_MIN_PROOFS_MR: '12'
      RESILIENCE_LOG: resilience.log
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.12'
          cache: true
      - name: Container resilience suite
        run: bash scripts/fault/run.sh
      - name: Upload resilience log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: main-resilience-log
          path: resilience.log
          retention-days: 7

  main-license-red-team:
    name: Gate - main-license-red-team
    needs: merge-pr-fast
    if: |
      always() && needs.merge-pr-fast.result == 'success' && (
        github.event_name == 'workflow_dispatch' ||
        (github.event_name == 'push' && github.ref == 'refs/heads/main')
      )
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.12'
          cache: true
      - name: License red-team (P0 scenarios)
        run: make license-red-team
