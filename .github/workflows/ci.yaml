name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  paths:
    name: Path filter
    runs-on: ubuntu-latest
    outputs:
      openrtb: ${{ steps.filter.outputs.openrtb }}
      model: ${{ steps.filter.outputs.model }}
      go: ${{ steps.filter.outputs.go }}
      integration: ${{ steps.filter.outputs.integration }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            openrtb:
              - 'internal/openrtb/**'
              - 'internal/ingestion/openrtb*.go'
              - 'scripts/test/openrtb_fuzz_smoke.sh'
            model:
              - 'model/**'
            go:
              - '**/*.go'
              - 'go.mod'
              - 'go.sum'
              - 'api/**'
              - 'internal/**/queries/**'
            integration:
              - '**/*.go'
              - 'go.mod'
              - 'go.sum'
              - 'scripts/**'
              - 'tests/**'
              - 'deploy/**'
              - 'docker-compose*.yaml'
              - 'Dockerfile*'

  fast:
    name: Fast gate
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.12'
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: PR fast checks
        run: bash scripts/ci/pr_fast.sh

  govulncheck:
    name: govulncheck
    needs: paths
    if: needs.paths.outputs.go == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.12'
          cache: true
      - name: Run govulncheck
        run: bash scripts/ci/govulncheck.sh

  openrtb-fuzz:
    name: OpenRTB fuzz smoke
    needs: paths
    if: needs.paths.outputs.openrtb == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.12'
          cache: true
      - name: Fuzz smoke (5s per target)
        run: make openrtb-fuzz-smoke

  fraudtrain:
    name: Fraud model smoke
    needs: paths
    if: needs.paths.outputs.model == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.12'
          cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install model dependencies
        run: pip install -r model/requirements.txt
      - name: fraudtrain-check (bootstrap + ml-validate)
        run: bash scripts/ci/fraudtrain.sh

  full-test:
    name: Full test suite (no -short)
    needs: [fast, paths]
    if: |
      always() && needs.fast.result == 'success' && (
        github.event_name == 'workflow_dispatch' ||
        (github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.paths.outputs.integration == 'true')
      )
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.12'
          cache: true
      - name: Run full test suite
        run: bash scripts/ci/full_test.sh 2>&1 | tee full_test.log
      - name: Upload full-test log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: full-test-log
          path: full_test.log
          retention-days: 7

  resilience:
    name: Container resilience tests
    needs: fast
    if: |
      always() && needs.fast.result == 'success' && (
        github.event_name == 'workflow_dispatch' ||
        (github.event_name == 'push' && github.ref == 'refs/heads/main')
      )
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      RESILIENCE_MIN_PROOFS: '52'
      RESILIENCE_MIN_PROOFS_MR: '12'
      RESILIENCE_LOG: resilience.log
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.12'
          cache: true
      - name: Run resilience suite
        run: bash scripts/fault/run.sh
      - name: Upload resilience log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: resilience-log
          path: resilience.log
          retention-days: 7

  license-red-team:
    name: License red-team
    needs: fast
    if: |
      always() && needs.fast.result == 'success' && (
        github.event_name == 'workflow_dispatch' ||
        (github.event_name == 'push' && github.ref == 'refs/heads/main')
      )
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.12'
          cache: true
      - name: License red-team (P0 scenarios)
        run: make license-red-team

