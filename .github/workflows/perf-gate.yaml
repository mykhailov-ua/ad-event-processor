name: Performance Gate (strict)

on:
  push:
    branches: [main]
    paths:
      - 'internal/ingest/**'
      - 'internal/rtb/**'
      - 'internal/config/**'
      - 'internal/database/redis*.go'
      - 'pkg/logger/**'
      - 'pkg/broker/**'
      - 'deploy/nginx/lua/**'
      - 'api/**'
      - 'scripts/test/**'
  workflow_dispatch:

concurrency:
  group: perf-gate-strict-${{ github.ref }}
  cancel-in-progress: true

jobs:
  perf-strict:
    name: Gate - main-perf-strict
    runs-on: ${{ vars.PERF_RUNNER_LABEL || 'ubuntu-latest' }}
    timeout-minutes: 30
    env:
      GOMAXPROCS: '1'
      BASELINE_REF: main
      OUTDIR: ${{ github.workspace }}/var/ci/perf-gate
      PERF_GATE_STRICT: ${{ vars.PERF_RUNNER_LABEL != '' && 'true' || 'false' }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25.12'
          cache: true

      - name: Gate mode
        run: |
          if [ "$PERF_GATE_STRICT" = "true" ]; then
            echo "Strict perf gate (self-hosted): zero-alloc + benchstat regression vs baseline"
          else
            echo "Smoke perf gate (github-hosted): zero-alloc only - set repo variable PERF_RUNNER_LABEL for benchstat"
          fi

      - name: Stabilize CPU (performance governor)
        if: env.PERF_GATE_STRICT == 'true'
        run: bash scripts/perf/stabilize_cpu.sh

      - name: Run performance gate
        run: bash scripts/lib/tee_ci_log.sh gate_run.log bash scripts/test/load/gate_run.sh

      - name: Upload Benchmark Artifacts
        if: always() && env.PERF_GATE_STRICT == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results
          path: |
            var/ci/perf-gate/pr_bench.txt
            var/ci/perf-gate/baseline_bench.txt
            var/ci/perf-gate/gate_report.txt
            var/ci/gate_run.log
          retention-days: 14

      - name: Upload smoke bench artifact
        if: always() && env.PERF_GATE_STRICT != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: perf-gate-smoke
          path: |
            var/ci/perf-gate/pr_bench.txt
            var/ci/gate_run.log
          retention-days: 7

      - name: Upload gate report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: perf-gate-failure
          path: |
            var/ci/gate_run.log
            var/ci/perf-gate/gate_report.txt
          retention-days: 7
          if-no-files-found: ignore
