name: Enterprise Resilience

on:
  workflow_dispatch:

concurrency:
  group: enterprise-resilience-${{ github.ref }}
  cancel-in-progress: true

jobs:
  multi-region-drill:
    name: Multi-region resilience drill (manual)
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.12'
          cache: true

      - name: Multi-region resilience drill
        run: bash scripts/lib/tee_ci_log.sh mr-resilience.log bash scripts/test/multi_region_resilience_drill.sh

      - name: Upload drill log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: mr-resilience-log
          path: var/ci/mr-resilience.log
          retention-days: 7

  xdp-drill:
    name: XDP resilience drill (manual)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.12'
          cache: true

      - name: Install BPF build deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq clang llvm libbpf-dev linux-libc-dev

      - name: XDP resilience drill
        run: bash scripts/lib/tee_ci_log.sh xdp-resilience.log bash scripts/test/xdp_resilience_drill.sh

      - name: Upload drill log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: xdp-resilience-log
          path: var/ci/xdp-resilience.log
          retention-days: 7
