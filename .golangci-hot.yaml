version: "2"

# Hot-path Go lint profile (ingestion, rtb auction, tracker, broker).
# Run via: scripts/ci/lint_go_gate.sh hot
# Intentionally omits errcheck, noctx, contextcheck, bodyclose — zero-alloc / monotonic-deadline rules.
run:
  timeout: 5m
  go: "1.25.12"

linters:
  enable:
    - govet
    - staticcheck
    - unused
    - misspell
    - gocritic
    - forbidigo
    - errorlint
  settings:
    staticcheck:
      checks:
        - all
        - SA9003
        - SA4017
    gocritic:
      enabled-checks:
        - badCond
        - dupImport
        - nilValReturn
        - singleCaseSwitch
    forbidigo:
      forbid:
        - pattern: 'log\.Fatal'
        - pattern: 'panic\('
  exclusions:
    generated: lax
    rules:
      - path: '_test\.go'
        linters:
          - forbidigo
          - gocritic
          - errorlint
      - path: '(/|^)(.*/)?pb/'
        linters:
          - gocritic
      - path: 'cmd/tracker/main\.go'
        linters:
          - gocritic
        text: 'exitAfterDefer'
