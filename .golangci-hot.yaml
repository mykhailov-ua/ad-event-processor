version: "2"




run:
  timeout: 5m
  go: "1.25.12"

linters:
  enable:
    - govet
    - staticcheck
    - unused
    - misspell
    - gocritic
    - forbidigo
    - errorlint
  settings:
    staticcheck:
      checks:
        - all
        - SA9003
        - SA4017
    gocritic:
      enabled-checks:
        - dupImport
        - nilValReturn
    forbidigo:
      forbid:
        - pattern: 'log\.Fatal'
        - pattern: 'panic\('
  exclusions:
    generated: lax
    rules:
      - path: '_test\.go'
        linters:
          - forbidigo
          - gocritic
          - errorlint
      - path: '(/|^)(.*/)?pb/'
        linters:
          - gocritic
      - path: 'cmd/tracker/main\.go'
        linters:
          - gocritic
        text: 'exitAfterDefer'
